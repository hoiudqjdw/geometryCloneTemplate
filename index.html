<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geometry Dash Clone</title>
  <style>
:root {
  --bg: #080b16;
  --panel: rgba(10, 15, 30, 0.88);
  --panel-strong: rgba(15, 22, 44, 0.95);
  --line: #9ef0ff;
  --accent: #53d1ff;
  --accent-2: #ffda67;
  --danger: #ff6b8a;
  --success: #89ff90;
  --text: #eff8ff;
  --shadow: #10233f;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(circle at top, #1b2042, var(--bg) 60%);
  color: var(--text);
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
}

body {
  touch-action: none;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

#hud {
  position: absolute;
  inset: 0 auto auto 0;
  width: min(100%, 1000px);
  padding: 14px 16px 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  pointer-events: none;
}

#hud.hidden {
  display: none;
}

.hud-topline {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  font-size: clamp(0.78rem, 2vw, 1rem);
  letter-spacing: 0.14em;
  text-shadow: 2px 2px 0 var(--shadow);
}

.progress-shell {
  position: relative;
  height: 24px;
  border: 3px solid var(--line);
  background: rgba(6, 11, 22, 0.9);
  box-shadow: 0 0 0 3px rgba(17, 37, 70, 0.85);
  overflow: hidden;
}

#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #57ffa5, #53d1ff 70%, #fef27a);
  image-rendering: pixelated;
}

#progress-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-shadow: 2px 2px 0 #00121e;
}

#screen-root {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
}

.screen {
  width: min(92vw, 680px);
  border: 4px solid var(--line);
  background: linear-gradient(180deg, rgba(14, 21, 44, 0.92), rgba(7, 11, 24, 0.94));
  box-shadow: 0 0 0 6px rgba(11, 25, 44, 0.85), 0 22px 48px rgba(0, 0, 0, 0.4);
  padding: clamp(18px, 4vw, 34px);
  text-align: center;
}

.screen h1,
.screen h2 {
  margin: 0 0 14px;
  letter-spacing: 0.12em;
  text-shadow: 3px 3px 0 #172b55;
}

.screen h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
}

.screen h2 {
  font-size: clamp(1.4rem, 4vw, 2.2rem);
}

.screen p {
  margin: 10px auto;
  max-width: 44ch;
  line-height: 1.5;
}

.button-row,
.card-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 18px;
}

.pixel-button,
.character-card {
  border: 3px solid var(--line);
  background: linear-gradient(180deg, rgba(27, 55, 99, 0.95), rgba(16, 32, 62, 0.95));
  color: var(--text);
  box-shadow: 0 0 0 3px #10233f;
}

.pixel-button {
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 12px 18px;
  min-width: 148px;
}

.pixel-button:hover,
.pixel-button:focus-visible,
.character-card:hover,
.character-card:focus-visible {
  outline: none;
  transform: translateY(-2px);
  border-color: var(--accent-2);
}

.pixel-button.alt {
  background: linear-gradient(180deg, rgba(90, 46, 105, 0.95), rgba(47, 26, 62, 0.95));
}

.pixel-button.danger {
  background: linear-gradient(180deg, rgba(126, 43, 76, 0.95), rgba(72, 22, 41, 0.95));
}

.pixel-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.pixel-button.pod {
  background: linear-gradient(180deg, rgba(27, 119, 116, 0.98), rgba(12, 61, 73, 0.98));
}

.editor-screen {
  width: min(96vw, 1180px);
  height: min(94vh, 820px);
  padding: 16px;
  text-align: left;
  display: grid;
  grid-template-rows: auto auto minmax(230px, 1fr) auto;
  gap: 12px;
  overflow: hidden;
  position: relative;
}

.editor-screen h2 {
  margin: 0;
  text-align: center;
}

.editor-toolbar {
  display: grid;
  gap: 10px;
}

.editor-toolbar-row,
.editor-actions,
.editor-nudge {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.editor-label {
  color: #b5d8ff;
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  min-width: 76px;
}

.tool-button,
.mode-button,
.nudge-button {
  border: 2px solid #50769c;
  background: rgba(11, 27, 49, 0.94);
  color: var(--text);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  padding: 8px 10px;
  cursor: pointer;
}

.tool-button:hover,
.tool-button:focus-visible,
.mode-button:hover,
.mode-button:focus-visible,
.nudge-button:hover,
.nudge-button:focus-visible,
.tool-button.active,
.mode-button.active {
  outline: none;
  border-color: var(--accent-2);
  color: var(--accent-2);
}

.tool-button.active,
.mode-button.active {
  background: rgba(76, 54, 9, 0.92);
}

.editor-workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 230px;
  gap: 12px;
}

.editor-grid-scroll {
  min-width: 0;
  overflow: auto;
  border: 3px solid #375f85;
  background: #090f21;
  scrollbar-color: var(--accent) #0c1730;
}

.editor-grid {
  display: grid;
  width: max-content;
  min-height: 100%;
  align-content: end;
  background-image:
    linear-gradient(rgba(83, 209, 255, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(83, 209, 255, 0.08) 1px, transparent 1px);
  background-size: 38px 38px;
}

.grid-cell {
  position: relative;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  border-right: 1px solid rgba(83, 209, 255, 0.16);
  border-bottom: 1px solid rgba(83, 209, 255, 0.16);
  background: transparent;
  color: var(--text);
  cursor: crosshair;
  font: inherit;
  font-weight: 900;
  overflow: visible;
}

.grid-cell:hover,
.grid-cell:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: -2px;
  background: rgba(83, 209, 255, 0.12);
}

.grid-cell.clear-column {
  border-right: 3px solid var(--accent-2);
}

.grid-cell.selected {
  background: rgba(255, 218, 103, 0.22);
  outline: 2px solid var(--accent-2);
  outline-offset: -3px;
}

.grid-cell small {
  position: absolute;
  left: 2px;
  bottom: 1px;
  color: rgba(239, 248, 255, 0.5);
  font-size: 0.55rem;
  font-weight: 400;
}

.editor-object {
  --fx: 0;
  --fy: 0;
  position: absolute;
  left: 4px;
  bottom: 4px;
  width: 30px;
  height: 30px;
  z-index: 2;
  pointer-events: none;
  transform: translate(calc(var(--fx) * 38px), calc(var(--fy) * -38px));
  filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.35));
}

.object-dieBlock {
  border: 3px solid #6fd5ff;
  background:
    linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25% 75%, rgba(255,255,255,0.2) 75%),
    #355c8f;
  background-size: 12px 12px;
  box-shadow: inset -5px 0 rgba(0,0,0,0.2);
}

.object-thorn {
  left: 3px;
  bottom: 3px;
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 31px solid #ff9f5d;
  filter: drop-shadow(0 3px 0 #813f29);
}

.object-thorn::after {
  content: '';
  position: absolute;
  left: -3px;
  top: 13px;
  width: 6px;
  height: 10px;
  background: rgba(255,255,255,0.35);
}

.object-pad {
  left: 3px;
  bottom: 4px;
  width: 32px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.7);
  display: grid;
  place-items: center;
  font-size: 0.85rem;
  font-weight: 900;
  line-height: 1;
}

.object-jumpUp { background: #6b69ff; color: white; }
.object-halfSpeed { background: #ffd35b; color: #654d00; }
.object-doubleSpeed { background: #53d1ff; color: #10304f; }

.object-start-cube {
  border: 3px solid #bdf9ff;
  background: #53d1ff;
  box-shadow: inset 5px 5px rgba(255,255,255,0.2), inset -5px -5px rgba(13,70,109,0.45);
}

.object-start-cube::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 7px;
  width: 4px;
  height: 4px;
  background: #17365f;
  box-shadow: 11px 0 #17365f;
}

.object-start-cube::after {
  content: '';
  position: absolute;
  left: 5px;
  bottom: 5px;
  width: 17px;
  height: 4px;
  background: #17365f;
}

.object-start-airplane {
  left: 2px;
  bottom: 8px;
  width: 35px;
  height: 22px;
}

.object-start-airplane::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 3px;
  width: 17px;
  height: 16px;
  background: #fff;
  border-left: 6px solid #53d1ff;
}

.object-start-airplane::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-left: 15px solid #ff7a9f;
}

.editor-close {
  position: absolute;
  right: 10px;
  top: 8px;
  width: 38px;
  height: 38px;
  border: 2px solid #ff9bad;
  background: rgba(87, 20, 43, 0.95);
  color: white;
  font: 900 1.25rem/1 "Courier New", monospace;
  cursor: pointer;
  z-index: 3;
}

.confirm-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(1, 4, 12, 0.76);
}

.confirm-dialog {
  width: min(92%, 430px);
  border: 3px solid var(--accent-2);
  background: #0b1429;
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  padding: 22px;
  text-align: center;
}

.confirm-dialog h3 { margin: 0 0 10px; }

.load-screen {
  width: min(92vw, 760px);
  text-align: left;
}

.load-code-input {
  width: 100%;
  min-height: 260px;
  resize: vertical;
  border: 3px solid #50769c;
  background: #040914;
  color: #89ff90;
  font: 0.95rem/1.5 "Courier New", monospace;
  padding: 12px;
}

.load-status {
  min-height: 1.5em;
  color: #b5d8ff;
  line-height: 1.45;
}

.load-status.error { color: #ff9bad; }

.load-screen .button-row { justify-content: flex-start; }

.editor-side {
  border: 2px solid #274767;
  background: rgba(8, 16, 34, 0.9);
  padding: 12px;
  display: grid;
  align-content: start;
  gap: 12px;
}

.editor-side h3 {
  margin: 0;
  font-size: 1rem;
  color: var(--accent-2);
}

.editor-side p {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.45;
}

.clear-control {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 7px;
}

.clear-control input {
  min-width: 0;
  border: 2px solid #50769c;
  background: #071126;
  color: var(--text);
  font: inherit;
  padding: 8px;
}

.map-code-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: stretch;
}

.map-code {
  width: 100%;
  min-height: 88px;
  resize: vertical;
  border: 2px solid #50769c;
  background: #040914;
  color: #89ff90;
  font: 0.9rem/1.45 "Courier New", monospace;
  padding: 10px;
}

.editor-status {
  min-height: 1.3em;
  color: #b5d8ff;
  font-size: 0.82rem;
}

.character-card {
  width: min(100%, 250px);
  padding: 14px;
  cursor: pointer;
}

.character-card.selected {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px #6f5600;
}

.character-card canvas {
  width: 100%;
  max-width: 180px;
  aspect-ratio: 1;
  margin: 6px auto 10px;
  display: block;
  image-rendering: pixelated;
  background: radial-gradient(circle at top, #29345e, #0c1120 70%);
  border: 3px solid rgba(255, 255, 255, 0.08);
}

.mini-stats {
  display: grid;
  gap: 8px;
  margin-top: 18px;
  font-size: 0.95rem;
}

.tip {
  color: #b5d8ff;
  font-size: 0.92rem;
}

.flashy {
  color: var(--accent-2);
}

@media (max-width: 640px) {
  .screen {
    padding: 18px 14px 22px;
  }

  .pixel-button {
    min-width: 128px;
    width: 100%;
  }

  .character-card {
    width: 100%;
  }

  #screen-root {
    padding: 6px;
  }

  .editor-screen {
    width: 100%;
    height: 98vh;
    padding: 10px;
    grid-template-rows: auto auto minmax(210px, 1fr) auto;
  }

  .editor-workspace {
    grid-template-columns: 1fr;
  }

  .editor-side {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .editor-side h3,
  .editor-side .editor-status {
    grid-column: 1 / -1;
  }

  .editor-label {
    width: 100%;
  }

  .editor-actions .pixel-button {
    width: auto;
    min-width: 0;
    flex: 1 1 130px;
  }
}

  </style>

<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="Geometry Dash Clone game canvas"></canvas>

    <header id="hud" class="hidden" aria-live="polite">
      <div class="hud-topline">
        <span id="stage-indicator">STAGE 1</span>
        <span id="character-indicator">CUBE</span>
      </div>
      <div class="progress-shell">
        <div id="progress-fill"></div>
        <span id="progress-label">0%</span>
      </div>
    </header>

    <div id="screen-root"></div>
  </div>

  <script>
/* =========================================================
   mapGen.js  –  맵 생성 알고리즘
   ========================================================= */
const TILE = 40;
const STAGE_LENGTH = 8000;
const WORLD_HEIGHT = 540;
const GROUND_Y = 430;

const CUBE_PATTERNS = [
  'singleSpike',
  'doubleSpike',
  'tripleSpike',
  'shortBlock',
  'blockSpike',
  'tallBlockPad',
  'boostLane',
  'slowLane',
  'doubleBlock',
];

const SHIP_PAD_TYPES = ['boost', 'slow'];

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function hashString(value) {
  let hash = 2166136261;
  for (let i = 0; i < value.length; i += 1) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

class SeededRandom {
  constructor(seed) {
    this.seed = seed >>> 0;
  }

  next() {
    this.seed = (1664525 * this.seed + 1013904223) >>> 0;
    return this.seed / 4294967296;
  }

  float(min = 0, max = 1) {
    return min + (max - min) * this.next();
  }

  int(min, max) {
    return Math.floor(this.float(min, max + 1));
  }

  chance(probability) {
    return this.next() < probability;
  }

  pick(items) {
    return items[this.int(0, items.length - 1)];
  }
}

function buildStageTheme(stageNumber, character) {
  const themes = [
    {
      skyTop: '#1d2047',
      skyBottom: '#090c1c',
      glow: '#53d1ff',
      glow2: '#f3ff72',
      ground: '#183352',
      ground2: '#0e213a',
    },
    {
      skyTop: '#26144c',
      skyBottom: '#090616',
      glow: '#ff78cb',
      glow2: '#53d1ff',
      ground: '#3a2059',
      ground2: '#1d1236',
    },
    {
      skyTop: '#0f314d',
      skyBottom: '#051017',
      glow: '#53ffbf',
      glow2: '#8dd6ff',
      ground: '#15575c',
      ground2: '#0a2f34',
    },
    {
      skyTop: '#3c1b2d',
      skyBottom: '#0e0813',
      glow: '#ffb347',
      glow2: '#ff6b8a',
      ground: '#55322d',
      ground2: '#2b1716',
    },
  ];

  const theme = { ...themes[(stageNumber - 1) % themes.length] };
  if (character === 'ship') {
    theme.glow2 = '#f8fbff';
  }
  return theme;
}

function createStars(rng, length, theme) {
  const stars = [];
  const layerSpeeds = [0.18, 0.35, 0.55];
  const counts = [64, 48, 36];

  counts.forEach((count, layerIndex) => {
    for (let i = 0; i < count; i += 1) {
      const size = 2 + layerIndex;
      stars.push({
        x: rng.float(0, length),
        y: rng.float(24, WORLD_HEIGHT - 120),
        size,
        layer: layerIndex,
        speedFactor: layerSpeeds[layerIndex],
        color: layerIndex === 0 ? theme.glow2 : layerIndex === 1 ? theme.glow : '#ffffff',
      });
    }
  });

  return stars;
}

function obstacleRect(type, x, y, w, h, extra = {}) {
  return { type, x, y, w, h, ...extra };
}

function padRect(type, x, y, w, h, extra = {}) {
  return { id: `${type}-${Math.round(x)}-${Math.round(y)}`, type, x, y, w, h, ...extra };
}

function generateCubeMap(rng, stageNumber) {
  const obstacles = [];
  const pads = [];
  const difficulty = stageNumber - 1;
  let x = 430;
  let segmentIndex = 0;

  while (x < STAGE_LENGTH - 650) {
    const safeGap = rng.int(100, 220) + difficulty * 10;
    x += safeGap;
    const pattern = CUBE_PATTERNS[rng.int(0, Math.min(CUBE_PATTERNS.length - 1, 4 + difficulty))];

    if (pattern === 'singleSpike') {
      obstacles.push(obstacleRect('spikeUp', x, GROUND_Y - 30, 28, 30));
      x += 95;
    } else if (pattern === 'doubleSpike') {
      obstacles.push(obstacleRect('spikeUp', x, GROUND_Y - 30, 28, 30));
      obstacles.push(obstacleRect('spikeUp', x + 26, GROUND_Y - 30, 28, 30));
      x += 130;
    } else if (pattern === 'tripleSpike') {
      for (let i = 0; i < 3; i += 1) {
        obstacles.push(obstacleRect('spikeUp', x + i * 26, GROUND_Y - 30, 28, 30));
      }
      x += 165;
    } else if (pattern === 'shortBlock') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 44, 44));
      x += 125;
    } else if (pattern === 'blockSpike') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 44, 44));
      obstacles.push(obstacleRect('spikeUp', x + 56, GROUND_Y - 30, 28, 30));
      x += 165;
    } else if (pattern === 'tallBlockPad') {
      pads.push(padRect('jump', x - 82, GROUND_Y - 18, 42, 18, { power: 760 }));
      obstacles.push(obstacleRect('block', x, GROUND_Y - 86, 48, 86));
      x += 165;
    } else if (pattern === 'boostLane') {
      pads.push(padRect('boost', x - 14, GROUND_Y - 16, 48, 16, { multiplier: 1.38, duration: 2.3 }));
      obstacles.push(obstacleRect('spikeUp', x + 110, GROUND_Y - 30, 28, 30));
      obstacles.push(obstacleRect('spikeUp', x + 136, GROUND_Y - 30, 28, 30));
      x += 220;
    } else if (pattern === 'slowLane') {
      pads.push(padRect('slow', x - 10, GROUND_Y - 16, 48, 16, { multiplier: 0.78, duration: 2.7 }));
      obstacles.push(obstacleRect('block', x + 102, GROUND_Y - 44, 44, 44));
      obstacles.push(obstacleRect('spikeUp', x + 158, GROUND_Y - 30, 28, 30));
      x += 240;
    } else if (pattern === 'doubleBlock') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 42, 44));
      obstacles.push(obstacleRect('block', x + 92, GROUND_Y - 44, 42, 44));
      x += 190;
    }

    if (segmentIndex % 5 === 3 && rng.chance(0.35)) {
      pads.push(padRect('jump', x + 28, GROUND_Y - 18, 42, 18, { power: 740 }));
      obstacles.push(obstacleRect('block', x + 120, GROUND_Y - 70, 44, 70));
      x += 210;
    }

    segmentIndex += 1;
  }

  return {
    type: 'cube',
    groundY: GROUND_Y,
    obstacles,
    pads,
    length: STAGE_LENGTH,
    baseSpeed: 300 + difficulty * 18,
    recommendedJumpVelocity: -610 - difficulty * 8,
  };
}

function generateShipMap(rng, stageNumber) {
  const obstacles = [];
  const pads = [];
  const difficulty = stageNumber - 1;
  let x = 0;
  let center = 268;

  while (x < STAGE_LENGTH) {
    const segW = x < 420 ? 180 : rng.int(180, 260);
    const shift = x < 420 ? 0 : rng.int(-1 - difficulty, 1 + difficulty) * 18;
    center = clamp(center + shift, 175, 340);
    const gap = clamp(196 - difficulty * 14 + rng.int(-10, 20), 132, 210);
    const topHeight = clamp(center - gap / 2, 70, 300);
    const bottomStart = clamp(center + gap / 2, 230, WORLD_HEIGHT - 90);

    obstacles.push(obstacleRect('block', x, 0, segW, Math.round(topHeight), { zone: 'top' }));
    obstacles.push(obstacleRect('block', x, Math.round(bottomStart), segW, WORLD_HEIGHT - Math.round(bottomStart), { zone: 'bottom' }));

    if (x > 260 && rng.chance(0.4)) {
      const spikeW = 30;
      const spikeH = 26 + difficulty * 3;
      const spikeX = x + rng.int(24, Math.max(24, segW - 56));
      if (rng.chance(0.5)) {
        obstacles.push(obstacleRect('spikeDown', spikeX, Math.round(topHeight) - 2, spikeW, spikeH));
      } else {
        obstacles.push(obstacleRect('spikeUp', spikeX, Math.round(bottomStart) - spikeH + 2, spikeW, spikeH));
      }
    }

    if (x > 320 && x < STAGE_LENGTH - 500 && rng.chance(0.28)) {
      const padType = rng.pick(SHIP_PAD_TYPES);
      const midY = clamp(center - 14, 140, WORLD_HEIGHT - 150);
      pads.push(
        padRect(padType, x + segW * 0.5 - 18, midY, 36, 36, {
          multiplier: padType === 'boost' ? 1.34 : 0.8,
          duration: padType === 'boost' ? 2 : 2.5,
          floating: true,
        }),
      );
    }

    x += segW;
  }

  return {
    type: 'ship',
    groundY: GROUND_Y,
    obstacles,
    pads,
    length: STAGE_LENGTH,
    baseSpeed: 286 + difficulty * 16,
    thrust: 1460 + difficulty * 30,
  };
}

function generateStageMap({ stageNumber, character, sessionSeed }) {
  const seed = hashString(`${sessionSeed}-${character}-${stageNumber}`);
  const rng = new SeededRandom(seed);
  const base = character === 'ship' ? generateShipMap(rng, stageNumber) : generateCubeMap(rng, stageNumber);

  return {
    ...base,
    stageNumber,
    character,
    seed,
    theme: buildStageTheme(stageNumber, character),
    stars: createStars(rng, STAGE_LENGTH, buildStageTheme(stageNumber, character)),
  };
}

function buildCustomWorld(spec) {
  const character = spec.startMode === 'Airplane' ? 'ship' : 'cube';
  const start = spec.blocks.find((block) => block.type === 'start');
  const obstacles = [];
  const pads = [];

  spec.blocks.forEach((block, index) => {
    if (block.type === 'start') return;
    const x = block.x * TILE;
    if (block.type === 'dieBlock') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - (block.y + 1) * TILE, TILE, TILE));
    } else if (block.type === 'thorn') {
      obstacles.push(obstacleRect('spikeUp', x + 5, GROUND_Y - block.y * TILE - 30, 30, 30));
    } else if (block.type === 'jumpUp') {
      pads.push(padRect('jump', x, GROUND_Y - block.y * TILE - 16, 40, 16, { id: `custom-jump-${index}`, power: 760 }));
    } else if (block.type === 'halfSpeed') {
      pads.push(padRect('slow', x, GROUND_Y - block.y * TILE - 18, 40, 18, { id: `custom-slow-${index}`, multiplier: 0.5, duration: 2.8 }));
    } else if (block.type === 'doubleSpeed') {
      pads.push(padRect('boost', x, GROUND_Y - block.y * TILE - 18, 40, 18, { id: `custom-boost-${index}`, multiplier: 2, duration: 2.2 }));
    }
  });

  const clearWorldX = spec.clearX * TILE;
  const startWorldX = start.x * TILE;
  const length = Math.max(clearWorldX, startWorldX + TILE);
  const seed = hashString(buildMapCode({ startMode: spec.startMode, blocks: spec.blocks, clearX: spec.clearX }));
  const rng = new SeededRandom(seed);
  const theme = buildStageTheme(2, character);

  return {
    type: character,
    character,
    stageNumber: 'CUSTOM',
    groundY: GROUND_Y,
    obstacles,
    pads,
    length,
    startWorldX,
    startGridY: start.y,
    clearWorldX,
    baseSpeed: character === 'ship' ? 286 : 300,
    recommendedJumpVelocity: -610,
    thrust: 1460,
    seed,
    theme,
    stars: createStars(rng, Math.max(length, 960), theme),
  };
}


/* =========================================================
   screens.js  –  화면(UI) 관리
   ========================================================= */
const SCREENS = {
  START: 'start',
  CHARACTER: 'character',
  POD: 'pod',
  LOAD: 'load',
  PLAY: 'play',
  FAIL: 'fail',
  CLEAR: 'clear',
};

const EDITOR_TOOLS = [
  { type: 'start', label: 'START', icon: 'S' },
  { type: 'dieBlock', label: 'DIE BLOCK', icon: 'X' },
  { type: 'thorn', label: 'THORN', icon: '▲' },
  { type: 'jumpUp', label: 'JUMP UP', icon: 'J' },
  { type: 'halfSpeed', label: '0.5× SPEED', icon: '½' },
  { type: 'doubleSpeed', label: '2× SPEED', icon: '2×' },
  { type: 'erase', label: 'ERASE', icon: '⌫' },
];

function formatMapNumber(value) {
  const rounded = Math.round(Number(value) * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function buildMapCode(editor) {
  const blocks = [...editor.blocks].sort((a, b) => {
    if (a.type === 'start' && b.type !== 'start') return -1;
    if (b.type === 'start' && a.type !== 'start') return 1;
    return a.x - b.x || a.y - b.y;
  });
  return [
    `startMode(${editor.startMode})`,
    ...blocks.map((block) => `block(${block.type}, ${formatMapNumber(block.x)}, ${formatMapNumber(block.y)})`),
    `clear(${formatMapNumber(editor.clearX)})`,
  ].join('\n');
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function editorBlockMarkup(editor, block) {
  if (!block) return '';
  const fx = Math.round((block.x - Math.floor(block.x)) * 10) / 10;
  const fy = Math.round((block.y - Math.floor(block.y)) * 10) / 10;
  const style = `--fx:${fx};--fy:${fy}`;
  if (block.type === 'start') {
    const modeClass = editor.startMode === 'Airplane' ? 'object-start-airplane' : 'object-start-cube';
    return `<span class="editor-object ${modeClass}" style="${style}"></span>`;
  }
  if (block.type === 'thorn') {
    return `<span class="editor-object object-thorn" style="${style}"></span>`;
  }
  if (block.type === 'dieBlock') {
    return `<span class="editor-object object-dieBlock" style="${style}"></span>`;
  }
  const padContent = block.type === 'jumpUp' ? '↑' : block.type === 'halfSpeed' ? '←' : '»';
  return `<span class="editor-object object-pad object-${block.type}" style="${style}">${padContent}</span>`;
}

function parseMapCode(source) {
  const lines = String(source).split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  if (!lines.length) throw new Error('맵 코드를 입력해 주세요.');
  if (lines.length > 5002) throw new Error('블록은 최대 5000개까지 불러올 수 있습니다.');

  let startMode = null;
  let clearX = null;
  const blocks = [];
  const validTypes = new Set(EDITOR_TOOLS.filter((tool) => tool.type !== 'erase').map((tool) => tool.type));

  lines.forEach((line, index) => {
    const lineNumber = index + 1;
    const modeMatch = line.match(/^startMode\((Cube|Airplane)\)$/);
    if (modeMatch) {
      if (startMode) throw new Error(`${lineNumber}줄: startMode는 한 번만 사용할 수 있습니다.`);
      startMode = modeMatch[1];
      return;
    }

    const blockMatch = line.match(/^block\(([A-Za-z][A-Za-z0-9]*),\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)\)$/);
    if (blockMatch) {
      const [, type, rawX, rawY] = blockMatch;
      const x = Number(rawX);
      const y = Number(rawY);
      if (!validTypes.has(type)) throw new Error(`${lineNumber}줄: 알 수 없는 블록 '${type}'입니다.`);
      if (x < 0 || y < 0) throw new Error(`${lineNumber}줄: 좌표에는 음수를 사용할 수 없습니다.`);
      blocks.push({ type, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 });
      return;
    }

    const clearMatch = line.match(/^clear\((-?\d+(?:\.\d+)?)\)$/);
    if (clearMatch) {
      if (clearX !== null) throw new Error(`${lineNumber}줄: clear는 한 번만 사용할 수 있습니다.`);
      clearX = Math.round(Number(clearMatch[1]) * 10) / 10;
      if (clearX < 0) throw new Error(`${lineNumber}줄: clear 좌표에는 음수를 사용할 수 없습니다.`);
      return;
    }

    throw new Error(`${lineNumber}줄의 형식을 확인해 주세요.`);
  });

  if (!startMode) throw new Error('startMode(Cube) 또는 startMode(Airplane)이 필요합니다.');
  const starts = blocks.filter((block) => block.type === 'start');
  if (starts.length !== 1) throw new Error('start 블록은 정확히 하나가 필요합니다.');
  if (clearX === null) throw new Error('clear(x) 설정이 필요합니다.');
  if (clearX <= starts[0].x) throw new Error('clear 좌표는 시작 위치보다 오른쪽이어야 합니다.');

  const occupied = new Set();
  blocks.forEach((block) => {
    const key = `${Math.floor(block.x)},${Math.floor(block.y)}`;
    if (occupied.has(key)) throw new Error(`(${key}) 칸에 블록이 두 개 이상 있습니다.`);
    occupied.add(key);
  });

  return { startMode, blocks, clearX };
}

function screenMarkup({ title, body = '', buttons = '' }) {
  return `
    <section class="screen">
      <h1>${title}</h1>
      ${body}
      <div class="button-row">${buttons}</div>
    </section>
  `;
}

function bindButtons(root, handlers) {
  root.querySelectorAll('[data-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;
      handlers[action]?.(button.dataset.value || undefined);
    });
  });
}

function createScreenManager({
  root,
  hud,
  progressFill,
  progressLabel,
  stageIndicator,
  characterIndicator,
  onAction,
  renderCharacterPreview,
}) {
  const handlers = {
    startGame: () => onAction('startGame'),
    openCharacterSelect: () => onAction('openCharacterSelect'),
    openPod: () => onAction('openPod'),
    openLoad: () => onAction('openLoad'),
    selectCharacter: (value) => onAction('selectCharacter', value),
    beginRun: () => onAction('beginRun'),
    retryStage: () => onAction('retryStage'),
    backToMenu: () => onAction('backToMenu'),
    nextStage: () => onAction('nextStage'),
    setEditorMode: (value) => onAction('setEditorMode', value),
    selectEditorTool: (value) => onAction('selectEditorTool', value),
    placeEditorBlock: (value) => onAction('placeEditorBlock', value),
    toggleFineMove: () => onAction('toggleFineMove'),
    nudgeSelected: (value) => onAction('nudgeSelected', value),
    deleteSelected: () => onAction('deleteSelected'),
    setClearX: () => onAction('setClearX', root.querySelector('#editor-clear-x')?.value),
    exportMapCode: () => onAction('exportMapCode'),
    copyMapCode: () => onAction('copyMapCode'),
    requestPodExit: () => onAction('requestPodExit'),
    cancelPodExit: () => onAction('cancelPodExit'),
    confirmPodExit: () => onAction('confirmPodExit'),
    loadMapCode: () => onAction('loadMapCode', root.querySelector('#load-code-input')?.value || ''),
    playLoadedMap: () => onAction('playLoadedMap'),
    expandEditor: (value) => onAction('expandEditor', value),
  };

  function showStart() {
    hud.classList.add('hidden');
    root.innerHTML = screenMarkup({
      title: 'GEOMETRY DASH CLONE',
      body: `
        <p>Retro clone-built arcade action with procedural stages, pixel art, and touch/keyboard controls.</p>
        <p class="tip">Tap / click / <span class="flashy">Space</span> to jump as the cube. Hold to fly as the ship.</p>
      `,
      buttons: `
        <button class="pixel-button" data-action="openCharacterSelect">PLAY</button>
        <button class="pixel-button pod" data-action="openPod">POD</button>
        <button class="pixel-button alt" data-action="openLoad">LOAD</button>
      `,
    });
    bindButtons(root, handlers);
  }

  function showPodEditor(editor, scrollPosition = null, scrollShiftY = 0) {
    hud.classList.add('hidden');
    const cells = [];
    for (let y = editor.rows - 1; y >= 0; y -= 1) {
      for (let x = 0; x < editor.cols; x += 1) {
        const block = editor.blocks.find((item) => Math.floor(item.x) === x && Math.floor(item.y) === y);
        const isSelected = block?.id === editor.selectedId;
        const isClear = Math.floor(editor.clearX) === x;
        const classes = [
          'grid-cell',
          block ? `block-${block.type}` : '',
          isSelected ? 'selected' : '',
          isClear ? 'clear-column' : '',
        ].filter(Boolean).join(' ');
        const label = block
          ? `${block.type} (${formatMapNumber(block.x)}, ${formatMapNumber(block.y)})`
          : `빈 칸 (${x}, ${y})`;
        cells.push(`
          <button class="${classes}" data-action="placeEditorBlock" data-value="${x},${y}" title="${label}" aria-label="${label}">
            ${editorBlockMarkup(editor, block)}
            ${y === 0 ? `<small>${x}</small>` : ''}
          </button>
        `);
      }
    }

    const codePanel = editor.exportedCode
      ? `
          <div class="map-code-wrap">

            <button class="tool-button" data-action="copyMapCode">COPY</button>

            <button class="mode-button ${editor.startMode === 'Airplane' ? 'active' : ''}" data-action="setEditorMode" data-value="Airplane">AIRPLANE</button>
          </div>
          <div class="editor-toolbar-row">
            <span class="editor-label">BLOCK</span>
            ${EDITOR_TOOLS.map((tool) => `
              <button class="tool-button ${editor.tool === tool.type ? 'active' : ''}" data-action="selectEditorTool" data-value="${tool.type}">${tool.icon} ${tool.label}</button>
            `).join('')}
          </div>
        </div>

          <div class="editor-grid-scroll" aria-label="맵 제작 그리드">
            <div class="editor-grid" style="grid-template-columns:repeat(${editor.cols},38px);grid-template-rows:repeat(${editor.rows},38px)">${cells.join('')}</div>
          </div>
          <aside class="editor-side">
            <h3>POSITION</h3>
            <p>${selectedBlock

              : '그리드에서 블록을 놓거나 선택하세요.'}</p>

              <button class="nudge-button" data-action="nudgeSelected" data-value="right" ${selectedBlock ? '' : 'disabled'}>→</button>

              <button class="tool-button" data-action="setClearX">SET</button>
            </div>
            <p class="editor-status">${editor.status || '한 칸에는 블록 하나만 놓을 수 있습니다.'}</p>
          </aside>
        </div>

        <div>
          ${codePanel}
          <div class="editor-actions">
            <button class="pixel-button" data-action="exportMapCode">맵 코드 내보내기</button>
          </div>
        </div>

          <div class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="exit-confirm-title">

              <h3 id="exit-confirm-title">맵 에디터에서 나갈까요?</h3>

              <div class="button-row">
                <button class="pixel-button alt" data-action="cancelPodExit">계속 만들기</button>
                <button class="pixel-button danger" data-action="confirmPodExit">나가기</button>
              </div>
            </div>
          </div>
        ` : ''}

    bindButtons(root, handlers);

    if (scrollPosition) {
      const scroller = root.querySelector('.editor-grid-scroll');
      if (scroller) {
        scroller.scrollLeft = scrollPosition.left;
        scroller.scrollTop = scrollPosition.top + scrollShiftY;

    } else {
      const scroller = root.querySelector('.editor-grid-scroll');
      if (scroller) scroller.scrollTop = scroller.scrollHeight;
    }

    const scroller = root.querySelector('.editor-grid-scroll');
    if (scroller) {
      let expansionRequested = false;
      scroller.addEventListener('scroll', () => {
        if (expansionRequested) return;
        const nearRight = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 80;
        const nearTop = scroller.scrollTop <= 30;
        if (nearRight) {
          expansionRequested = true;
          handlers.expandEditor('right');
        } else if (nearTop) {
          expansionRequested = true;
          handlers.expandEditor('up');
        }
      }, { passive: true });
    }
  }

  function showLoad({ draft = '', error = '', ready = null } = {}) {

        <textarea id="load-code-input" class="load-code-input" spellcheck="false" aria-label="불러올 맵 코드" placeholder="startMode(Cube)&#10;block(start, 0, 0)&#10;block(thorn, 5, 0)&#10;clear(10)">${escapeHtml(draft)}</textarea>
        <p class="load-status ${error ? 'error' : ''}">${error ? escapeHtml(error) : ready ? `${ready.startMode} · 블록 ${ready.blocks.length}개 · CLEAR X ${formatMapNumber(ready.clearX)}` : ''}</p>

  function updateHud({ progress, stage, character }) {
    progressFill.style.width = `${Math.max(0, Math.min(100, progress * 100))}%`;
    progressLabel.textContent = `${Math.round(progress * 100)}%`;
    stageIndicator.textContent = `STAGE ${stage}`;
    characterIndicator.textContent = character.toUpperCase();
  }

  return {
    showStart,
    showPodEditor,
    showLoad,
    showCharacterSelect,
    showFail,
    showClear,
    showPlay,
    updateHud,
  };
}

function makeAudio(src, { loop = false, volume = 1 } = {}) {

}

function setupAudio() {

function unlockAudio() {

async function playMenuMusic() {

function stopStageMusic() {

function playSfx(kind) {

function getStageMap(character, stageNumber) {
  const characterMaps = app.maps[character];
  if (!characterMaps.has(stageNumber)) {
    characterMaps.set(stageNumber, generateStageMap({ stageNumber, character, sessionSeed: app.sessionSeed }));
  }
  return characterMaps.get(stageNumber);
}

function createPlayer(character, world = null) {
  const startGridY = world?.startGridY || 0;
  return character === 'ship'
    ? {
        character,
        w: 36,
        h: 24,
        screenX: 170,
        y: world ? Math.max(10, GROUND_Y - 24 - startGridY * TILE) : 260,
        vy: 0,
        rotation: 0,
      }
    : {
        character,
        w: 28,
        h: 28,
        screenX: 170,
        y: GROUND_Y - 28 - startGridY * TILE,
        vy: 0,
        grounded: true,
        rotation: 0,
      };
}

function resizeCanvas() {
  if (!canvas || !ctx) return;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = Math.floor(width * DPR);
  canvas.height = Math.floor(height * DPR);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const scale = Math.min(width / 960, height / 540);
  app.playfield.width = Math.floor(960 * scale);
  app.playfield.height = Math.floor(540 * scale);
}

function worldScale() {
  return app.playfield.width / 960;
}

function fieldOffset() {
  return {
    x: (window.innerWidth - app.playfield.width) / 2,
    y: (window.innerHeight - app.playfield.height) / 2,
  };
}

function getPlayerRect() {
  const player = app.player;
  if (!player) return null;
  return {
    x: app.cameraX + player.screenX - player.w / 2,
    y: player.y,
    w: player.w,
    h: player.h,
  };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function pointInTriangle(px, py, a, b, c) {
  const area = (p1, p2, p3) => (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y)) / 2;
  const total = Math.abs(area(a, b, c));
  const part = Math.abs(area({ x: px, y: py }, b, c)) + Math.abs(area(a, { x: px, y: py }, c)) + Math.abs(area(a, b, { x: px, y: py }));
  return Math.abs(total - part) < 0.5;
}

function triangleCollision(rect, obstacle) {
  const { x, y, w, h, type } = obstacle;
  const points =
    type === 'spikeDown'
      ? [
          { x, y },
          { x: x + w / 2, y: y + h },
          { x: x + w, y },
        ]
      : [
          { x, y: y + h },
          { x: x + w / 2, y },
          { x: x + w, y: y + h },
        ];

  const rectPoints = [
    { x: rect.x, y: rect.y },
    { x: rect.x + rect.w, y: rect.y },
    { x: rect.x, y: rect.y + rect.h },
    { x: rect.x + rect.w, y: rect.y + rect.h },
    { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 },
  ];

  if (rectsOverlap(rect, obstacle) && rectPoints.some((point) => pointInTriangle(point.x, point.y, points[0], points[1], points[2]))) {
    return true;
  }

  return rectsOverlap(rect, obstacle) && points.some((point) => point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h);
}

function applyPadEffect(pad) {
  if (!pad || app.padTriggers.has(pad.id)) return;
  app.padTriggers.add(pad.id);
  playSfx('click');

  if (pad.type === 'jump' && app.player.character === 'cube') {
    app.player.vy = -pad.power;
    app.player.grounded = false;
  }

  if (pad.type === 'boost' || pad.type === 'slow') {
    app.speedEffect = {
      multiplier: pad.multiplier,
      timer: pad.duration,
    };
  }
}

function collidePlayer() {
  const rect = getPlayerRect();
  if (!rect || !app.world) return false;

  for (const obstacle of app.world.obstacles) {
    if (obstacle.type === 'block' && rectsOverlap(rect, obstacle)) {
      return true;
    }
    if ((obstacle.type === 'spikeUp' || obstacle.type === 'spikeDown') && triangleCollision(rect, obstacle)) {
      return true;
    }
  }

  for (const pad of app.world.pads) {
    if (rectsOverlap(rect, pad)) {
      if (pad.type === 'jump' || pad.type === 'boost' || pad.type === 'slow') {
        applyPadEffect(pad);
      }
    }
  }

  return false;
}

function resetStage(stageNumber = app.currentStage) {
  app.isCustomRun = false;
  app.currentStage = stageNumber;
  app.world = getStageMap(app.selectedCharacter, app.currentStage);
  app.player = createPlayer(app.selectedCharacter);
  app.cameraX = 0;
  app.speedEffect = null;
  app.padTriggers = new Set();
  app.stageStartMs = performance.now();
  app.attempts[app.selectedCharacter][app.currentStage] += 1;
  app.screen = SCREENS.PLAY;
  screenManager.showPlay();
  screenManager.updateHud({ progress: 0, stage: app.currentStage, character: app.selectedCharacter });
  void playStageMusic(app.currentStage);
}

function resetCustomMap() {
  if (!app.loadedMapSpec) return;
  app.isCustomRun = true;
  app.selectedCharacter = app.loadedMapSpec.startMode === 'Airplane' ? 'ship' : 'cube';
  app.world = buildCustomWorld(app.loadedMapSpec);
  app.player = createPlayer(app.selectedCharacter, app.world);
  app.cameraX = app.world.startWorldX - app.player.screenX + app.player.w / 2;
  app.speedEffect = null;
  app.padTriggers = new Set();
  app.stageStartMs = performance.now();
  app.customAttempts += 1;
  app.screen = SCREENS.PLAY;
  screenManager.showPlay();
  screenManager.updateHud({ progress: 0, stage: 'CUSTOM', character: app.selectedCharacter });
  void playStageMusic(1);
}

function currentWorldProgress() {
  if (!app.world || !app.player) return 0;
  const playerWorldX = app.cameraX + app.player.screenX;
  if (app.isCustomRun) {
    const distance = Math.max(TILE, app.world.clearWorldX - app.world.startWorldX);
    return clamp((playerWorldX - app.world.startWorldX) / distance, 0, 1);
  }
  return clamp(playerWorldX / app.world.length, 0, 1);
}

function failStage() {
  stopStageMusic();
  playSfx('death');
  app.screen = SCREENS.FAIL;
  const progress = currentWorldProgress();
  app.failSummary = { percent: Math.round(progress * 100) };
  screenManager.showFail(app.failSummary);
}

function clearStage() {
  stopStageMusic();
  app.screen = SCREENS.CLEAR;
  const timeTaken = (performance.now() - app.stageStartMs) / 1000;
  app.clearSummary = {
    attempts: app.isCustomRun ? app.customAttempts : app.attempts[app.selectedCharacter][app.currentStage],
    timeTaken,
    stageNumber: app.currentStage,
    isLastStage: !app.isCustomRun && app.currentStage >= 4,
    isCustom: app.isCustomRun,
  };
  screenManager.showClear(app.clearSummary);
}

function currentSpeed() {
  if (!app.world) return 0;
  const effect = app.speedEffect?.multiplier || 1;
  return app.world.baseSpeed * effect;
}

function updateCube(dt) {
  const player = app.player;
  const jumpVelocity = app.world.recommendedJumpVelocity;

  if (app.input.justPressed && player.grounded) {
    player.vy = jumpVelocity;
    player.grounded = false;
    playSfx('click');
  }

  player.vy += 1800 * dt;
  player.y += player.vy * dt;
  player.rotation += dt * 7;

  if (player.y + player.h >= GROUND_Y) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.grounded = true;
    player.rotation = 0;
  }

  if (player.y > WORLD_HEIGHT + 120 || player.y < -160) {
    failStage();
    return;
  }
}

function updateShip(dt) {
  const player = app.player;
  if (app.input.pressed) {
    player.vy -= app.world.thrust * dt;
  }
  player.vy += 980 * dt;
  player.vy = clamp(player.vy, -520, 520);
  player.y += player.vy * dt;
  player.rotation = clamp(player.vy / 420, -0.8, 0.8);

  if (player.y <= 0 || player.y + player.h >= WORLD_HEIGHT) {
    failStage();
  }
}

function updateGame(dt) {
  if (app.screen !== SCREENS.PLAY || !app.world || !app.player) {
    app.input.justPressed = false;
    return;
  }

  if (app.speedEffect) {
    app.speedEffect.timer -= dt;
    if (app.speedEffect.timer <= 0) {
      app.speedEffect = null;
    }
  }

  app.cameraX += currentSpeed() * dt;

  if (app.player.character === 'ship') {
    updateShip(dt);
  } else {
    updateCube(dt);
  }

  if (app.screen === SCREENS.PLAY && collidePlayer()) {
    failStage();
  }

  const progress = currentWorldProgress();
  screenManager.updateHud({ progress, stage: app.isCustomRun ? 'CUSTOM' : app.currentStage, character: app.player.character });

  if (progress >= 0.995 && app.screen === SCREENS.PLAY) {
    clearStage();
  }

  app.input.justPressed = false;
}

function drawPixelRect(drawCtx, x, y, w, h, color, pixel = 6, accent) {
  drawCtx.fillStyle = color;
  drawCtx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  if (accent) {
    drawCtx.fillStyle = accent;
    for (let yy = 0; yy < h; yy += pixel * 2) {
      for (let xx = 0; xx < w; xx += pixel * 2) {
        drawCtx.fillRect(Math.round(x + xx), Math.round(y + yy), Math.min(pixel, w - xx), Math.min(pixel, h - yy));
      }
    }
  }
}

function drawGround(drawCtx, theme) {
  if (app.world?.character === 'ship') {
    drawCtx.fillStyle = 'rgba(255,255,255,0.06)';
    drawCtx.fillRect(0, 0, 960, 8);
    drawCtx.fillRect(0, WORLD_HEIGHT - 8, 960, 8);
    return;
  }
  const groundTop = GROUND_Y;
  drawPixelRect(drawCtx, 0, groundTop, 960, WORLD_HEIGHT - groundTop, theme.ground, 10, theme.ground2);
  drawCtx.fillStyle = theme.glow;
  drawCtx.fillRect(0, groundTop, 960, 6);
  drawCtx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let x = 0; x < 960; x += TILE) {
    drawCtx.fillRect(x, groundTop + ((Math.floor((x + app.cameraX * 0.2) / TILE) % 2) * 8), TILE / 2, 4);
  }
}

function drawParallax(drawCtx, theme) {
  const gradient = drawCtx.createLinearGradient(0, 0, 0, WORLD_HEIGHT);
  gradient.addColorStop(0, theme.skyTop);
  gradient.addColorStop(1, theme.skyBottom);
  drawCtx.fillStyle = gradient;
  drawCtx.fillRect(0, 0, 960, WORLD_HEIGHT);

  app.world?.stars.forEach((star) => {
    const px = ((star.x - app.cameraX * star.speedFactor) % 960 + 960) % 960;
    drawCtx.fillStyle = star.color;
    drawCtx.globalAlpha = 0.35 + star.layer * 0.2;
    drawCtx.fillRect(Math.round(px), Math.round(star.y), star.size, star.size);
    drawCtx.globalAlpha = 1;
  });

  drawCtx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 7; i += 1) {
    const width = 140 + i * 24;
    const height = 40 + (i % 3) * 30;
    const x = ((i * 170 - app.cameraX * (0.12 + i * 0.02)) % 1180 + 1180) % 1180 - 110;
    const y = 120 + i * 42;
    drawCtx.fillRect(x, y, width, height);
  }
}

function drawArrow(drawCtx, x, y, color, direction = 'up') {
  drawCtx.fillStyle = color;
  if (direction === 'up') {
    drawCtx.fillRect(x + 10, y + 8, 8, 16);
    drawCtx.beginPath();
    drawCtx.moveTo(x + 14, y);
    drawCtx.lineTo(x + 28, y + 12);
    drawCtx.lineTo(x, y + 12);
    drawCtx.closePath();
    drawCtx.fill();
  } else if (direction === 'right') {
    drawCtx.fillRect(x, y + 9, 20, 8);
    drawCtx.beginPath();
    drawCtx.moveTo(x + 30, y + 13);
    drawCtx.lineTo(x + 18, y + 24);
    drawCtx.lineTo(x + 18, y + 2);
    drawCtx.closePath();
    drawCtx.fill();
  } else if (direction === 'left') {
    drawCtx.fillRect(x + 12, y + 9, 20, 8);
    drawCtx.beginPath();
    drawCtx.moveTo(x, y + 13);
    drawCtx.lineTo(x + 12, y + 24);
    drawCtx.lineTo(x + 12, y + 2);
    drawCtx.closePath();
    drawCtx.fill();
  }
}

function drawPads(drawCtx) {
  if (!app.world) return;
  app.world.pads.forEach((pad) => {
    const x = pad.x - app.cameraX;
    if (x < -80 || x > 1040) return;

    if (pad.type === 'jump') {
      drawPixelRect(drawCtx, x, pad.y, pad.w, pad.h, '#6b69ff', 4, '#a6d7ff');
      drawArrow(drawCtx, x + 2, pad.y - 14, '#f5fbff', 'up');
    }

    if (pad.type === 'boost') {
      drawPixelRect(drawCtx, x, pad.y, pad.w, pad.h, '#53d1ff', 4, '#d6ffff');
      drawArrow(drawCtx, x + 2, pad.y + 2, '#10304f', 'right');
      drawArrow(drawCtx, x + 12, pad.y + 2, '#10304f', 'right');
    }

    if (pad.type === 'slow') {
      drawPixelRect(drawCtx, x, pad.y, pad.w, pad.h, '#ffd35b', 4, '#fff2a6');
      drawArrow(drawCtx, x + 4, pad.y + 2, '#654d00', 'left');
    }
  });
}

function drawObstacles(drawCtx) {
  if (!app.world) return;
  app.world.obstacles.forEach((obstacle) => {
    const x = obstacle.x - app.cameraX;
    if (x + obstacle.w < -60 || x > 1020) return;
    if (obstacle.type === 'block') {
      drawPixelRect(drawCtx, x, obstacle.y, obstacle.w, obstacle.h, '#355c8f', 6, '#6fd5ff');
      drawCtx.fillStyle = 'rgba(0,0,0,0.18)';
      drawCtx.fillRect(x + obstacle.w - 8, obstacle.y, 8, obstacle.h);
    } else {
      drawCtx.fillStyle = obstacle.type === 'spikeDown' ? '#ff7a9f' : '#ff9f5d';
      drawCtx.beginPath();
      if (obstacle.type === 'spikeDown') {
        drawCtx.moveTo(x, obstacle.y);
        drawCtx.lineTo(x + obstacle.w / 2, obstacle.y + obstacle.h);
        drawCtx.lineTo(x + obstacle.w, obstacle.y);
      } else {
        drawCtx.moveTo(x, obstacle.y + obstacle.h);
        drawCtx.lineTo(x + obstacle.w / 2, obstacle.y);
        drawCtx.lineTo(x + obstacle.w, obstacle.y + obstacle.h);
      }
      drawCtx.closePath();
      drawCtx.fill();
      drawCtx.fillStyle = 'rgba(255,255,255,0.25)';
      drawCtx.fillRect(x + obstacle.w / 2 - 3, obstacle.type === 'spikeDown' ? obstacle.y + obstacle.h / 2 : obstacle.y + obstacle.h / 2, 6, 10);
    }
  });
}

function drawCube(drawCtx, player) {
  const px = player.screenX - player.w / 2;
  drawCtx.save();
  drawCtx.translate(px + player.w / 2, player.y + player.h / 2);
  drawCtx.rotate(player.rotation);
  drawPixelRect(drawCtx, -player.w / 2, -player.h / 2, player.w, player.h, '#53d1ff', 6, '#bdf9ff');
  drawCtx.fillStyle = '#17365f';
  drawCtx.fillRect(-8, -6, 4, 4);
  drawCtx.fillRect(4, -6, 4, 4);
  drawCtx.fillRect(-8, 6, 16, 4);
  drawCtx.restore();
}

function drawShip(drawCtx, player) {
  const px = player.screenX - player.w / 2;
  const py = player.y;
  drawCtx.save();
  drawCtx.translate(px + player.w / 2, py + player.h / 2);
  drawCtx.rotate(player.rotation);
  drawCtx.fillStyle = '#fefefe';
  drawCtx.fillRect(-12, -8, 16, 16);
  drawCtx.fillStyle = '#53d1ff';
  drawCtx.fillRect(-16, -4, 8, 8);
  drawCtx.fillStyle = '#ff7a9f';
  drawCtx.beginPath();
  drawCtx.moveTo(4, -10);
  drawCtx.lineTo(18, 0);
  drawCtx.lineTo(4, 10);
  drawCtx.closePath();
  drawCtx.fill();
  drawCtx.fillStyle = '#ffda67';
  drawCtx.fillRect(-22, -4, 6, 8);
  drawCtx.fillStyle = 'rgba(255, 209, 111, 0.45)';
  drawCtx.fillRect(-28, -2, 8, 4);
  drawCtx.restore();
}

function drawStageMeta(drawCtx) {
  if (!app.world) return;
  drawCtx.fillStyle = 'rgba(255,255,255,0.15)';
  drawCtx.fillRect(0, 0, 960, 1);
  drawCtx.fillStyle = app.world.theme.glow;
  drawCtx.font = '16px Courier New';
  drawCtx.fillText(`SEED ${app.world.seed}`, 16, WORLD_HEIGHT - 18);
}

function render() {
  if (!ctx || !canvas) return;
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  const scale = worldScale();
  const offset = fieldOffset();

  ctx.save();
  ctx.translate(offset.x, offset.y);
  ctx.scale(scale, scale);

  const theme = app.world?.theme || {
    skyTop: '#1d2047',
    skyBottom: '#090c1c',
    glow: '#53d1ff',
    glow2: '#f3ff72',
    ground: '#183352',
    ground2: '#0e213a',
  };

  drawParallax(ctx, theme);
  drawGround(ctx, theme);
  drawPads(ctx);
  drawObstacles(ctx);

  if (app.player) {
    if (app.player.character === 'ship') {
      drawShip(ctx, app.player);
    } else {
      drawCube(ctx, app.player);
    }
  }

  drawStageMeta(ctx);
  ctx.restore();
}

function renderCharacterPreview(canvasEl, character) {
  const previewCtx = canvasEl.getContext('2d');
  previewCtx.setTransform(1, 0, 0, 1, 0, 0);
  previewCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  const previewScale = canvasEl.width / 180;
  previewCtx.scale(previewScale, previewScale);
  previewCtx.fillStyle = '#10172b';
  previewCtx.fillRect(0, 0, 180, 180);
  previewCtx.fillStyle = '#203257';
  previewCtx.fillRect(0, 130, 180, 50);
  previewCtx.fillStyle = '#53d1ff';
  for (let i = 0; i < 6; i += 1) {
    previewCtx.fillRect(18 + i * 26, 26 + (i % 2) * 12, 4, 4);
  }

  if (character === 'ship') {
    previewCtx.translate(85, 84);
    previewCtx.rotate(-0.18);
    previewCtx.fillStyle = '#ffffff';
    previewCtx.fillRect(-18, -12, 24, 24);
    previewCtx.fillStyle = '#53d1ff';
    previewCtx.fillRect(-28, -6, 10, 12);
    previewCtx.fillStyle = '#ff7a9f';
    previewCtx.beginPath();
    previewCtx.moveTo(8, -16);
    previewCtx.lineTo(34, 0);
    previewCtx.lineTo(8, 16);
    previewCtx.closePath();
    previewCtx.fill();
    previewCtx.fillStyle = '#ffda67';
    previewCtx.fillRect(-38, -6, 10, 12);
  } else {
    previewCtx.translate(90, 92);
    drawPixelRect(previewCtx, -28, -28, 56, 56, '#53d1ff', 8, '#bdf9ff');
    previewCtx.fillStyle = '#17365f';
    previewCtx.fillRect(-15, -12, 8, 8);
    previewCtx.fillRect(7, -12, 8, 8);
    previewCtx.fillRect(-15, 10, 30, 6);
  }
}

function animate(timestamp) {
  const dt = clamp((timestamp - (app.lastFrameMs || timestamp)) / 1000, 0, 0.033);
  app.lastFrameMs = timestamp;
  updateGame(dt);
  render();
  requestAnimationFrame(animate);
}

function onPressStart(event) {
  if (event.target instanceof Element && event.target.closest('.pixel-button, .character-card')) {
    unlockAudio();
  }
  if (app.screen === SCREENS.PLAY) {
    unlockAudio();
    app.input.pressed = true;
    app.input.justPressed = true;
    event.preventDefault();
  }
}

function onPressEnd(event) {
  if (app.screen === SCREENS.PLAY) {
    app.input.pressed = false;
    event.preventDefault();
  }
}

function rerenderPodEditor({ keepScroll = true, scrollShiftY = 0 } = {}) {
  const scroller = keepScroll ? screenRoot.querySelector('.editor-grid-scroll') : null;
  const scrollPosition = scroller
    ? { left: scroller.scrollLeft, top: scroller.scrollTop }
    : null;
  screenManager.showPodEditor(app.editor, scrollPosition, scrollShiftY);
}

function placeEditorBlock(value) {
  const [x, y] = String(value).split(',').map(Number);
  if (!Number.isInteger(x) || !Number.isInteger(y)) return;

  const occupiedIndex = app.editor.blocks.findIndex(
    (block) => Math.floor(block.x) === x && Math.floor(block.y) === y,
  );

  if (app.editor.tool === 'erase') {
    if (occupiedIndex >= 0) {
      app.editor.blocks.splice(occupiedIndex, 1);
      app.editor.selectedId = null;
      app.editor.status = `(${x}, ${y}) 블록을 지웠습니다.`;
    }
    app.editor.exportedCode = '';
    rerenderPodEditor();
    return;
  }

  if (occupiedIndex >= 0) {
    app.editor.selectedId = app.editor.blocks[occupiedIndex].id;
    app.editor.status = '블록을 선택했습니다. 방향 버튼으로 위치를 조정할 수 있습니다.';
    rerenderPodEditor();
    return;
  }

  if (app.editor.tool === 'start') {
    app.editor.blocks = app.editor.blocks.filter((block) => block.type !== 'start');
  }

  const block = {
    id: app.editor.nextId,
    type: app.editor.tool,
    x,
    y,
  };
  app.editor.nextId += 1;
  app.editor.blocks.push(block);
  app.editor.selectedId = block.id;
  app.editor.exportedCode = '';
  app.editor.status = `${block.type} 블록을 (${x}, ${y})에 놓았습니다.`;
  rerenderPodEditor();
}

function nudgeSelectedBlock(direction) {
  const selected = app.editor.blocks.find((block) => block.id === app.editor.selectedId);
  if (!selected) return;

  const step = app.editor.fineMove ? 0.1 : 1;
  const offsets = {
    left: [-step, 0],
    right: [step, 0],
    up: [0, step],
    down: [0, -step],
  };
  const [dx, dy] = offsets[direction] || [0, 0];
  const nextX = Math.round((selected.x + dx) * 10) / 10;
  const nextY = Math.round((selected.y + dy) * 10) / 10;

  if (nextX < 0 || nextY < 0) {
    app.editor.status = 'X와 Y 좌표에는 음수를 사용할 수 없습니다.';
    rerenderPodEditor();
    return;
  }

  const targetIsOccupied = app.editor.blocks.some((block) => (
    block.id !== selected.id
    && Math.floor(block.x) === Math.floor(nextX)
    && Math.floor(block.y) === Math.floor(nextY)
  ));
  if (targetIsOccupied) {
    app.editor.status = '이 칸에는 이미 다른 블록이 있습니다.';
    rerenderPodEditor();
    return;
  }

  selected.x = nextX;
  selected.y = nextY;
  if (nextX >= app.editor.cols - 3) app.editor.cols = Math.ceil(nextX) + 40;
  if (nextY >= app.editor.rows - 3) app.editor.rows = Math.ceil(nextY) + 12;
  app.editor.exportedCode = '';
  app.editor.status = `${selected.type}: (${formatMapNumber(nextX)}, ${formatMapNumber(nextY)})`;
  rerenderPodEditor();
}

function handleScreenAction(action, value) {
  unlockAudio();
  playSfx('click');

  if (action === 'openPod') {
    app.screen = SCREENS.POD;
    app.editor.exitConfirm = false;
    rerenderPodEditor({ keepScroll: false });
  }

  if (action === 'openLoad') {
    app.screen = SCREENS.LOAD;
    screenManager.showLoad({ draft: app.loadDraft, error: app.loadError, ready: app.loadedMapSpec });
  }

  if (action === 'requestPodExit') {
    app.editor.exitConfirm = true;
    rerenderPodEditor();
  }

  if (action === 'cancelPodExit') {
    app.editor.exitConfirm = false;
    rerenderPodEditor();
  }

  if (action === 'confirmPodExit') {
    app.editor.exitConfirm = false;
    app.screen = SCREENS.START;
    screenManager.showStart();
    void playMenuMusic();
  }

  if (action === 'expandEditor' && (value === 'right' || value === 'up')) {
    if (value === 'right') {
      app.editor.cols += 40;
      rerenderPodEditor();
    } else {
      const addedRows = 10;
      app.editor.rows += addedRows;
      rerenderPodEditor({ scrollShiftY: addedRows * 38 });
    }
  }

  if (action === 'setEditorMode' && (value === 'Cube' || value === 'Airplane')) {
    app.editor.startMode = value;
    app.editor.exportedCode = '';
    app.editor.status = `${value} 모드로 시작합니다.`;
    rerenderPodEditor();
  }

  if (action === 'selectEditorTool' && EDITOR_TOOLS.some((tool) => tool.type === value)) {
    app.editor.tool = value;
    app.editor.status = value === 'erase' ? '지울 블록을 선택하세요.' : `${value} 블록을 놓을 칸을 선택하세요.`;
    rerenderPodEditor();
  }

  if (action === 'placeEditorBlock' && value) {
    placeEditorBlock(value);
  }

  if (action === 'toggleFineMove') {
    app.editor.fineMove = !app.editor.fineMove;
    app.editor.status = app.editor.fineMove
      ? '미세 이동이 켜졌습니다. 방향 버튼으로 0.1씩 이동합니다.'
      : '일반 이동이 켜졌습니다. 방향 버튼으로 1씩 이동합니다.';
    rerenderPodEditor();
  }

  if (action === 'nudgeSelected' && value) {
    nudgeSelectedBlock(value);
  }

  if (action === 'deleteSelected') {
    app.editor.blocks = app.editor.blocks.filter((block) => block.id !== app.editor.selectedId);
    app.editor.selectedId = null;
    app.editor.exportedCode = '';
    app.editor.status = '선택한 블록을 삭제했습니다.';
    rerenderPodEditor();
  }

  if (action === 'setClearX') {
    const clearX = Math.round(Number(value) * 10) / 10;
    if (Number.isFinite(clearX) && clearX >= 0) {
      app.editor.clearX = clearX;
      if (clearX >= app.editor.cols - 3) app.editor.cols = Math.ceil(clearX) + 40;
      app.editor.exportedCode = '';
      app.editor.status = `클리어 위치를 X ${formatMapNumber(clearX)}로 정했습니다.`;
    } else {
      app.editor.status = '클리어 위치에는 0 이상의 좌표를 입력해 주세요.';
    }
    rerenderPodEditor();
  }

  if (action === 'exportMapCode') {
    app.editor.exportedCode = buildMapCode(app.editor);
    app.editor.status = '맵 코드를 만들었습니다.';
    rerenderPodEditor();
  }

  if (action === 'copyMapCode' && app.editor.exportedCode) {
    const code = app.editor.exportedCode;
    const copyPromise = navigator.clipboard?.writeText(code);
    if (!copyPromise) {
      const output = document.getElementById('map-code-output');
      output?.select();
      app.editor.status = '코드가 선택되었습니다. 직접 복사해 주세요.';
      return;
    }
    copyPromise.then(() => {
      app.editor.status = '맵 코드를 복사했습니다.';
      rerenderPodEditor();
    }).catch(() => {
      const output = document.getElementById('map-code-output');
      output?.select();
      app.editor.status = '코드가 선택되었습니다. 직접 복사해 주세요.';
      rerenderPodEditor();
    });
  }

  if (action === 'loadMapCode') {
    app.loadDraft = value || '';
    try {
      app.loadedMapSpec = parseMapCode(app.loadDraft);
      app.loadError = '';
      screenManager.showLoad({ draft: app.loadDraft, ready: app.loadedMapSpec });
    } catch (error) {
      app.loadedMapSpec = null;
      app.loadError = error instanceof Error ? error.message : '맵 코드를 불러오지 못했습니다.';
      screenManager.showLoad({ draft: app.loadDraft, error: app.loadError });
    }
  }

  if (action === 'playLoadedMap' && app.loadedMapSpec) {
    resetCustomMap();
  }

  if (action === 'openCharacterSelect') {
    app.screen = SCREENS.CHARACTER;
    screenManager.showCharacterSelect({ selectedCharacter: app.selectedCharacter });
    void playMenuMusic();
  }

  if (action === 'backToMenu') {
    app.screen = SCREENS.START;
    stopStageMusic();
    screenManager.showStart();
    void playMenuMusic();
  }

  if (action === 'selectCharacter' && value) {
    app.selectedCharacter = value;
    app.currentStage = 1;
    screenManager.showCharacterSelect({ selectedCharacter: app.selectedCharacter });
  }

  if (action === 'beginRun' || action === 'startGame') {
    app.currentStage = 1;
    resetStage(1);
  }

  if (action === 'retryStage') {
    if (app.isCustomRun) {
      resetCustomMap();
    } else {
      resetStage(app.currentStage);
    }
  }

  if (action === 'nextStage') {
    resetStage(app.currentStage + 1);
  }
}

const screenManager =
  createScreenManager({
        root: screenRoot,
        hud,
        progressFill,
        progressLabel,
        stageIndicator,
        characterIndicator,
        onAction: handleScreenAction,
        renderCharacterPreview,
      });

function init() {
  if (!canvas || !ctx || !screenManager) return;
  setupAudio();
  resizeCanvas();
  app.world = getStageMap(app.selectedCharacter, app.currentStage);
  app.player = createPlayer(app.selectedCharacter);
  screenManager.showStart();
  void playMenuMusic();
  requestAnimationFrame(animate);
}

// 초기화
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      if (!event.repeat) {
        onPressStart(event);
      }
      event.preventDefault();
    }
  });
  window.addEventListener('keyup', (event) => {
    if (event.code === 'Space') {
      onPressEnd(event);
    }
  });
  window.addEventListener('pointerdown', onPressStart, { passive: false });
  window.addEventListener('pointerup', onPressEnd, { passive: false });
  window.addEventListener('pointercancel', onPressEnd, { passive: false });
  window.addEventListener('blur', () => {
    app.input.pressed = false;
  });
  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
