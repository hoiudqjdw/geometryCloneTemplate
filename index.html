  // 그리드 포인터 처리: MOVE ON → 화면 이동 / MOVE OFF → 클릭 배치 · 드래그 직사각형 채우기
  function attachEditorPointer(editor, scroller, grid) {
    const cellMap = new Map();
    grid.querySelectorAll('[data-cell]').forEach((el) => cellMap.set(el.dataset.cell, el));
    let drag = null;

    const cellAt = (clientX, clientY) => {
      const el = document.elementFromPoint(clientX, clientY)?.closest?.('[data-cell]');
      if (!el || !grid.contains(el)) return null;
      const [x, y] = el.dataset.cell.split(',').map(Number);
      return { x, y };
    };

    const clearPreview = () => {
      grid.querySelectorAll('.drag-preview').forEach((el) => el.classList.remove('drag-preview', 'drag-erase'));
    };

    const paintPreview = () => {
      clearPreview();
      const minX = Math.min(drag.start.x, drag.end.x);
      const maxX = Math.max(drag.start.x, drag.end.x);
      const minY = Math.min(drag.start.y, drag.end.y);
      const maxY = Math.max(drag.start.y, drag.end.y);
      for (let y = minY; y <= maxY; y += 1) {
        for (let x = minX; x <= maxX; x += 1) {
          const el = cellMap.get(`${x},${y}`);
          if (!el) continue;
          el.classList.add('drag-preview');
          if (editor.tool === 'erase') el.classList.add('drag-erase');
        }
      }
    };

    grid.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      if (editor.moveMode) {
        drag = {
          kind: 'pan',
          px: event.clientX,
          py: event.clientY,
          left: scroller.scrollLeft,
          top: scroller.scrollTop,
        };
        scroller.classList.add('panning');
      } else {
        const cell = cellAt(event.clientX, event.clientY);
        if (!cell) return;
        drag = { kind: 'rect', start: cell, end: cell };
        paintPreview();
      }
      grid.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    });

    grid.addEventListener('pointermove', (event) => {
      if (!drag) return;
      if (drag.kind === 'pan') {
        scroller.scrollLeft = drag.left - (event.clientX - drag.px);
        scroller.scrollTop = drag.top - (event.clientY - drag.py);
        return;
      }
      const cell = cellAt(event.clientX, event.clientY);
      if (cell && (cell.x !== drag.end.x || cell.y !== drag.end.y)) {
        drag.end = cell;
        paintPreview();
      }
    });

    const finish = (cancelled) => {
      if (!drag) return;
      const done = drag;
      drag = null;
      scroller.classList.remove('panning');

      if (done.kind === 'pan') {
        // 끝까지 옮기면 맵 확장
        const nearRight = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 40;
        const nearTop = scroller.scrollTop <= 20;
        if (nearRight) handlers.expandEditor('right');
        else if (nearTop) handlers.expandEditor('up');
        return;
      }

      clearPreview();
      if (cancelled) return;
      const { start, end } = done;
      if (start.x === end.x && start.y === end.y) {
        handlers.placeEditorBlock(`${start.x},${start.y}`);
      } else {
        handlers.fillEditorRect(`${start.x},${start.y},${end.x},${end.y}`);
      }
    };

    grid.addEventListener('pointerup', () => finish(false));
    grid.addEventListener('pointercancel', () => finish(true));

    // 키보드(Enter/Space)로 칸 누르기
    grid.addEventListener('click', (event) => {
      if (event.detail !== 0 || editor.moveMode) return;
      const el = event.target.closest('[data-cell]');
      if (el) handlers.placeEditorBlock(el.dataset.cell);
    });
  }

  function showPodEditor(editor, scrollPosition = null, scrollShiftY = 0) {
    hud.classList.add('hidden');
    const blockMap = new Map();
    editor.blocks.forEach((block) => blockMap.set(`${Math.floor(block.x)},${Math.floor(block.y)}`, block));

    const cells = [];
    for (let y = editor.rows - 1; y >= 0; y -= 1) {
      for (let x = 0; x < editor.cols; x += 1) {
        const block = blockMap.get(`${x},${y}`);
        const isSelected = block && block.id === editor.selectedId;
        const isClear = Math.floor(editor.clearX) === x;
        const classes = [
          'grid-cell',
          block ? `block-${block.type}` : '',
          isSelected ? 'selected' : '',
          isClear ? 'clear-column' : '',

        const rotationText = block && block.type !== 'start' && block.rotation
          ? `, ${formatMapNumber(block.rotation)}°`
          : '';
        const label = block
          ? `${editorBlockTag(editor, block)} (${formatMapNumber(block.x)}, ${formatMapNumber(block.y)}${rotationText})${block.code ? ' · 코드 있음' : ''}`
          : `빈 칸 (${x}, ${y})`;
        cells.push(`<button type="button" class="${classes}" data-cell="${x},${y}" title="${label}" aria-label="${label}">${editorBlockMarkup(editor, block)}${y === 0 ? `<small>${x}</small>` : ''}</button>`);

    root.innerHTML = `
      <section class="screen editor-screen">

        <h2>POD MAP EDITOR</h2>
        <div class="editor-toolbar">
          <div class="editor-toolbar-row">
            <span class="editor-label">START MODE</span>
            ${MODES.map((mode) => `<button class="mode-button ${editor.startMode === mode.code ? 'active' : ''}" data-action="setEditorMode" data-value="${mode.code}"><span class="tool-sprite sprite sprite-start${mode.code}" aria-hidden="true"></span>${mode.label}</button>`).join('')}
            <span class="editor-label">VIEW</span>

          </div>
          <div class="editor-toolbar-row">
            <span class="editor-label">BLOCK</span>
            ${paletteMarkup(editor)}
          </div>
          ${editor.paletteCategory ? `<div class="editor-toolbar-row palette-items">${paletteItemsMarkup(editor)}</div>` : ''}
        </div>

        <div class="editor-workspace">
          <div class="editor-grid-scroll ${editor.moveMode ? 'move-mode' : ''}" aria-label="맵 제작 그리드">
            <div class="editor-grid" style="grid-template-columns:repeat(${editor.cols},${EDITOR_CELL}px);grid-template-rows:repeat(${editor.rows},${EDITOR_CELL}px)">${cells.join('')}</div>
          </div>
          <aside class="editor-side">
            <h3>POSITION</h3>
            <p>${selectedBlock
              ? `${TYPE_LABELS[selectedBlock.type]}<br>X ${formatMapNumber(selectedBlock.x)} / Y ${formatMapNumber(selectedBlock.y)}${selectedRotatable ? ` / ${formatMapNumber(selectedBlock.rotation || 0)}°` : ''}`
              : '그리드에서 블록을 놓거나 선택하세요.'}</p>
            ${selectedBlock ? `<p>TAG <code class="tag-chip">${escapeHtml(selectedTag)}</code></p>` : ''}
            <button class="tool-button code-button" data-action="openBlockCode" ${selectedRotatable ? '' : 'disabled'}>{} CODE${codeLines ? ` · ${codeLines}줄` : ''}</button>

              <button class="nudge-button" data-action="nudgeSelected" data-value="up" ${selectedBlock ? '' : 'disabled'}>↑</button>

            <div class="rotate-row" aria-label="회전">
              <button class="nudge-button" data-action="rotateEditor" data-value="-90">⟲90</button>

function makeAudio(src, { loop = false, volume = 1 } = {}) {
  const audio = new Audio(src);
  audio.loop = loop;
  audio.volume = volume;
  audio.preload = 'auto';
  return audio;
}

function setupAudio() {
  app.audio.menu = makeAudio(MENU_MUSIC, { loop: true, volume: 0.35 });
  app.audio.click = makeAudio(BUTTON_SOUND, { volume: 0.6 });
  app.audio.death = makeAudio(DEATH_SOUND, { volume: 0.7 });
}

function unlockAudio() {
  if (app.audioUnlocked) return;
  app.audioUnlocked = true;
  if (app.screen !== SCREENS.PLAY) {
    void playMenuMusic();
  }
}

async function playMenuMusic() {
  if (!app.audio.menu) return;
  stopStageMusic();
  app.audio.menu.currentTime = 0;
  try {
    await app.audio.menu.play();
  } catch {
    // Browser may require interaction first.
  }
}

function stopMenuMusic() {
  if (!app.audio.menu) return;
  app.audio.menu.pause();
}

async function playStageMusic(stageNumber) {
  stopMenuMusic();
  stopStageMusic();
  app.audio.stage = makeAudio(STAGE_MUSIC[stageNumber], { loop: true, volume: 0.4 });
  try {
    await app.audio.stage.play();
  } catch {
    // Browser may require interaction first.
  }
}

function stopStageMusic() {
  if (!app.audio.stage) return;
  app.audio.stage.pause();
  app.audio.stage = null;
}

function playSfx(kind) {
  const audio = app.audio[kind];
  if (!audio) return;
  try {
    audio.currentTime = 0;
    void audio.play();
  } catch {
    // Ignore autoplay restrictions.
  }
}

function getStageMap(character, stageNumber) {

  if (!characterMaps.has(stageNumber)) {
    characterMaps.set(stageNumber, generateStageMap({ stageNumber, character, sessionSeed: app.sessionSeed }));
  }
  return characterMaps.get(stageNumber);
}

const PLAYER_SIZES = {
  cube: [28, 28],
  ship: [36, 24],
  ball: [28, 28],
  ufo: [30, 24],
  wave: [16, 16],
  robot: [26, 30],
  spider: [30, 22],
  swing: [30, 26],
};

function createPlayer(character, world = null) {
  const startGridY = world?.startGridY || 0;
  const [w, h] = PLAYER_SIZES[character] || PLAYER_SIZES.cube;
  const flying = FLYING_MODES.has(character);
  return {
    character,
    w,
    h,
    screenX: 170,
    // 나는 모드: 커스텀 맵은 시작 칸 가운데, 기본 맵은 화면 가운데 / 나머지: 바닥(시작 칸) 위
    y: flying
      ? world ? GROUND_Y - (startGridY + 1) * TILE + (TILE - h) / 2 : 260
      : GROUND_Y - h - startGridY * TILE,
    vy: 0,
    gravity: 1,
    grounded: !flying && startGridY === 0,
    groundOwner: null,
    rotation: 0,
    boostTimer: 0,
    flipBuffer: 0,
    trail: [],
    flash: null,
    dash: null,         // 화살표 공점 돌진 중 { angle, slope }
    swingInvert: false, // 스윙 위아래 뒤바뀜 (초록 공점)
  };
}

// 모드 포털: 중심 높이를 유지한 채 모드 전환
function switchPlayerMode(mode) {
  const player = app.player;
  if (!player || player.character === mode) return;
  const centerY = player.y + player.h / 2;
  const template = createPlayer(mode);
  player.character = mode;
  player.w = template.w;
  player.h = template.h;
  player.y = centerY - player.h / 2;
  player.vy *= 0.5;
  player.grounded = false;
  player.rotation = 0;
  player.boostTimer = 0;
  player.flipBuffer = 0;
  player.trail = [];
  // 중력 방향은 모드가 바뀌어도 유지 (스윙은 지금 중력에 맞춰 위아래 기준을 정함)
  if (mode === 'swing') player.swingInvert = gravityOf(player) === -1;
}

function resizeCanvas() {
  if (!canvas || !ctx) return;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = Math.floor(width * DPR);
  canvas.height = Math.floor(height * DPR);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const scale = Math.min(width / 960, height / 540);
  app.playfield.width = Math.floor(960 * scale);
  app.playfield.height = Math.floor(540 * scale);
}

function worldScale() {
  return app.playfield.width / 960;
}

function fieldOffset() {
  return {
    x: (window.innerWidth - app.playfield.width) / 2,
    y: (window.innerHeight - app.playfield.height) / 2,
  };
}

function getPlayerRect() {
  const player = app.player;
  if (!player) return null;
  return {
    x: app.cameraX + player.screenX - player.w / 2,
    y: player.y,
    w: player.w,
    h: player.h,
  };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function pointInTriangle(px, py, a, b, c) {
  const area = (p1, p2, p3) => (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y)) / 2;
  const total = Math.abs(area(a, b, c));
  const part = Math.abs(area({ x: px, y: py }, b, c)) + Math.abs(area(a, { x: px, y: py }, c)) + Math.abs(area(a, b, { x: px, y: py }));
  return Math.abs(total - part) < 0.5;
}

function triangleCollision(rect, obstacle) {
  const { x, y, w, h, type } = obstacle;
  const points =
    type === 'spikeDown'
      ? [
          { x, y },
          { x: x + w / 2, y: y + h },
          { x: x + w, y },
        ]
      : [
          { x, y: y + h },
          { x: x + w / 2, y },
          { x: x + w, y: y + h },
        ];

  const rectPointsList = [
    { x: rect.x, y: rect.y },
    { x: rect.x + rect.w, y: rect.y },
    { x: rect.x, y: rect.y + rect.h },
    { x: rect.x + rect.w, y: rect.y + rect.h },
    { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 },
  ];

  if (rectsOverlap(rect, obstacle) && rectPointsList.some((point) => pointInTriangle(point.x, point.y, points[0], points[1], points[2]))) {
    return true;
  }

  return rectsOverlap(rect, obstacle) && points.some((point) => point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h);
}

/* ---------- 패드 · 공점 · 포털 ---------- */
function applyPadEffect(pad) {
  if (!pad || app.padTriggers.has(pad.id)) return;
  app.padTriggers.add(pad.id);

  if (pad.type === 'portal') {
    if (app.player.character !== pad.mode) playSfx('click');
    switchPlayerMode(pad.mode);
    return;
  }

  playSfx('click');

  if (pad.type === 'jump') {
    // 점프 패드: 중력 반대 방향으로 튕겨 냄 (웨이브는 영향 없음)
    const player = app.player;
    const dir = gravityOf(player);
    if (player.character === 'ship' || player.character === 'swing') {
      player.vy = -pad.power * 0.55 * dir;
    } else if (player.character !== 'wave') {
      player.vy = -pad.power * dir;
      player.grounded = false;
      player.boostTimer = 0;
    }
    if (pad.owner) pad.owner.jumped = true;
  }

  if (pad.type === 'boost' || pad.type === 'slow') {
    app.speedEffect = {
      multiplier: pad.multiplier,
      timer: pad.duration,
    };
  }
}

function handleTriggers() {
  const rect = getPlayerRect();
  app.touchingOrb = null;
  if (!rect || !app.world) return;
  let playerPolygon = null;
  for (const pad of app.world.pads) {
    if (!rectsOverlap(rect, pad)) continue;
    if (pad.parts) {
      playerPolygon = playerPolygon || rectPoints(rect.x, rect.y, rect.w, rect.h);
      if (!pad.parts.some((part) => polygonsOverlap(playerPolygon, part))) continue;
    }
    if (pad.type === 'dashStop') {
      endDash(app.player); // S블록: 화살표 공점 돌진 강제 중단
      continue;
    }
    if (ORB_PAD_TYPES.has(pad.type)) {
      if (!app.padTriggers.has(pad.id)) app.touchingOrb = pad;
      continue;
    }
    applyPadEffect(pad);
  }
}

// 공점: 닿아 있는 동안 클릭하면 공중에서도 점프 (공점 하나당 1회)
const ORB_PAD_TYPES = new Set(['orb', 'orbGreen', 'orbBlack', 'orbDash']);
const ORB_BLOCK_TYPES = new Set(['nextJump', 'greenOrb', 'blackOrb', 'dashOrb']);

function useOrb() {
  const orb = app.touchingOrb;
  if (!orb || orb.type !== 'orb') return false;
  app.padTriggers.add(orb.id);
  if (orb.owner) orb.owner.jumped = true;
  app.touchingOrb = null;
  playSfx('click');
  return true;
}

/* ---------- 밟을 수 있는 블록(square, slope) ---------- */
function solidsNear(rect) {
  if (!app.world?.solids?.length) return [];
  return app.world.solids.filter((solid) => solid.x < rect.x + rect.w + 2 && solid.x + solid.w > rect.x - 2);
}

function worldHasGround() {
  return Boolean(app.world?.custom || app.world?.type === 'cube' || app.world?.type === 'gravity');
}

function findFloor(rect, prevBottom, dx, snapAllowed) {
  let best = null;
  const bottom = rect.y + rect.h;
  const centerX = rect.x + rect.w / 2;
  // stepClimb: slope 픽셀 계단(최대 45°)을 오르내릴 수 있게 허용하는 높이
  const consider = (y, grad, stepClimb = 0, owner = null) => {
    const steep = Math.abs(grad) > MAX_WALKABLE_GRAD;
    const slopeStep = (steep ? 0 : dx * Math.abs(grad)) + stepClimb;
    const allowance = 6 + slopeStep;
    const snap = snapAllowed && !steep ? slopeStep + 6 : 0;
    if (bottom >= y - snap && prevBottom <= y + allowance) {
      // 높이가 같으면 캐릭터 가운데 아래에 있는 블록을 밟은 것으로 (jump 판정용)
      const underCenter = owner && owner.bounds && centerX >= owner.bounds.x && centerX < owner.bounds.x + owner.bounds.w;
      if (!best || y < best.y - 0.01 || (Math.abs(y - best.y) <= 0.01 && underCenter && !best.underCenter)) {
        best = { y, grad: steep ? 0 : grad, owner, underCenter };
      }
    }
  };

  if (worldHasGround()) consider(GROUND_Y, 0);
  for (const solid of solidsNear(rect)) {
    const surface = surfaceUnder(solid.points, rect.x + 1, rect.x + rect.w - 1, 'top');
    if (surface) consider(surface.y, surface.grad, solid.kind === 'slope' ? dx + 1 : 0, solid.owner || null);
  }
  return best;
}

// 천장(블록 아랫면, 기본 통로 맵 천장). snapAllowed: 거꾸로 붙어 다닐 때 경사를 따라가기
function findCeiling(rect, prevTop, dx, snapAllowed = false) {
  let best = null;
  const consider = (y, grad, extra = 0, owner = null) => {
    const steep = Math.abs(grad) > MAX_WALKABLE_GRAD;
    const slopeStep = (steep ? 0 : dx * Math.abs(grad)) + extra;
    const allowance = 6 + slopeStep;
    const snap = snapAllowed && !steep ? slopeStep + 6 : 0;
    if (rect.y <= y + snap && prevTop >= y - allowance && (!best || y > best.y)) {
      best = { y, grad: steep ? 0 : grad, owner };
    }
  };
  if (app.world?.ceilingY != null) consider(app.world.ceilingY, 0);
  for (const solid of solidsNear(rect)) {
    const surface = surfaceUnder(solid.points, rect.x + 1, rect.x + rect.w - 1, 'bottom');
    if (surface) consider(surface.y, surface.grad, solid.kind === 'slope' ? dx + 1 : 0, solid.owner || null);
  }
  return best;
}

// 착지 처리 후에도 square/slope 안에 박혀 있으면 = 옆이나 아래에서 부딪힘 → 사망
function hitsSolidSide() {
  const rect = getPlayerRect();
  if (!rect) return false;
  const inner = { x: rect.x + 3, y: rect.y + 3, w: rect.w - 6, h: rect.h - 6 };
  const innerPoints = rectPoints(inner.x, inner.y, inner.w, inner.h);
  return solidsNear(rect).some((solid) => rectsOverlap(inner, solid) && polygonsOverlap(innerPoints, solid.points));
}

function hitsHazard() {
  const rect = getPlayerRect();
  if (!rect || !app.world) return false;
  let rectPolygon = null;

  for (const obstacle of app.world.obstacles) {
    if (obstacle.x > rect.x + rect.w + 4 || obstacle.x + obstacle.w < rect.x - 4) continue;
    if (obstacle.type === 'block' && rectsOverlap(rect, obstacle)) return true;
    if ((obstacle.type === 'spikeUp' || obstacle.type === 'spikeDown') && triangleCollision(rect, obstacle)) return true;
    if (obstacle.type === 'pixelHazard' && rectsOverlap(rect, obstacle)) {
      // 픽셀 히트박스: 캐릭터 쪽을 2px 줄여 약간 너그럽게
      rectPolygon = rectPolygon || rectPoints(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
      if (obstacle.parts.some((part) => polygonsOverlap(rectPolygon, part))) return true;
    }
  }
  return false;
}

/* ---------- 연습 모드 (체크포인트) ---------- */
const PRACTICE_AUTO_INTERVAL = 2;   // 2초마다 자동 체크포인트
const PRACTICE_CONFIRM_TIME = 0.35; // 자동 체크포인트는 찍고 나서 이만큼 살아남아야 저장 (바로 죽는 자리 방지)
const PRACTICE_RESPAWN_DELAY = 0.6;
const PRACTICE_MAX_CHECKPOINTS = 400;

function createPracticeState(active = false) {
  return {
    active,
    checkpoints: [],
    start: null,
    sinceLast: 0,
    pending: null,
    dead: false,
    respawnTimer: 0,
    deathAt: null,
    attempts: active ? 1 : 0,
    flash: 0,
  };
}

function snapshotBlock(block) {
  return {
    kind: block.kind,
    type: block.type,
    design: block.design, // px/convert는 항상 새 배열을 만들어서 참조만 들고 있어도 안전
    x: block.x,
    y: block.y,
    rotation: block.rotation,
    ghost: block.ghost,
    hidden: block.hidden,
    jumped: block.jumped,
    vars: new Map(block.vars),
  };
}

// 지금 순간을 통째로 저장 (코드가 없는 블록은 바뀌지 않으므로 저장하지 않음)
function captureGameState(kind = 'auto') {
  const world = app.world;
  const player = app.player;
  const state = {
    kind,
    cameraX: app.cameraX,
    cameraY: app.cameraY,
    player: { ...player },
    speedEffect: app.speedEffect ? { ...app.speedEffect } : null,
    padTriggers: new Set(app.padTriggers),
    markerX: app.cameraX + player.screenX,
    markerY: player.y + player.h / 2,
  };
  if (world?.custom) {
    state.world = {
      time: world.time,
      globals: new Map(world.globals),
      disabledKeys: { ...world.disabledKeys },
      scripts: world.scripts.map((rt) => ({
        done: rt.done,
        waitUntil: rt.waitUntil,
        stack: rt.stack.map((frame) => ({ ...frame })),
        block: snapshotBlock(rt.block),
      })),
    };
  }
  return state;
}

function restoreGameState(state) {
  const world = app.world;
  app.cameraX = state.cameraX;
  app.cameraY = state.cameraY;
  Object.assign(app.player, state.player);
  app.player.trail = [];
  app.player.flash = null;
  app.speedEffect = state.speedEffect ? { ...state.speedEffect } : null;
  app.padTriggers = new Set(state.padTriggers);
  app.touchingOrb = null;
  app.input.justPressed = false;

  if (world?.custom && state.world) {
    world.time = state.world.time;
    world.globals = new Map(state.world.globals);
    world.disabledKeys = { ...state.world.disabledKeys };
    world.scripts.forEach((rt, index) => {
      const saved = state.world.scripts[index];
      if (!saved) return;
      rt.done = saved.done;
      rt.waitUntil = saved.waitUntil;
      rt.stack = saved.stack.map((frame) => ({ ...frame }));
      const block = rt.block;
      const { vars, ...fields } = saved.block;
      Object.assign(block, fields);
      block.vars.clear();
      vars.forEach((value, key) => block.vars.set(key, value));
      block.dirty = true;
    });
    world.scriptErrors = [];
    rebuildWorldLists(world);
  }
}

function setupPractice() {
  app.practice = createPracticeState(app.practiceMode);
  if (app.practice.active) app.practice.start = captureGameState('start');
  updatePracticeBar();
}

function practiceActive() {
  return Boolean(app.practice?.active && app.screen === SCREENS.PLAY);
}

function practiceDead() {
  return Boolean(app.practice?.active && app.practice.dead);
}

function pushCheckpoint(state) {
  const practice = app.practice;
  practice.checkpoints.push(state);
  if (practice.checkpoints.length > PRACTICE_MAX_CHECKPOINTS) practice.checkpoints.shift();
  practice.flash = 0.5;
  updatePracticeBar();
}

function addManualCheckpoint() {
  if (!practiceActive() || app.practice.dead) return;
  app.practice.pending = null;
  app.practice.sinceLast = 0;
  pushCheckpoint(captureGameState('manual'));
  playSfx('click');
}

function removeLastCheckpoint() {
  if (!practiceActive()) return;
  const practice = app.practice;
  practice.pending = null;
  practice.sinceLast = 0;
  if (practice.checkpoints.length) {
    practice.checkpoints.pop();
    playSfx('click');
  }
  updatePracticeBar();
}

// 매 프레임 (살아 있을 때): 자동 체크포인트
function updatePracticeCheckpoints(dt) {
  const practice = app.practice;
  if (!practice?.active || practice.dead) return;
  practice.flash = Math.max(0, practice.flash - dt);
  if (practice.pending) {
    practice.pending.age += dt;
    if (practice.pending.age >= PRACTICE_CONFIRM_TIME) {
      pushCheckpoint(practice.pending.state);
      practice.pending = null;
    }
  }
  practice.sinceLast += dt;
  if (practice.sinceLast >= PRACTICE_AUTO_INTERVAL) {
    practice.sinceLast = 0;
    practice.pending = { state: captureGameState('auto'), age: 0 };
  }
}

function practiceDeath() {
  const practice = app.practice;
  if (practice.dead) return;
  playSfx('death');
  practice.dead = true;
  practice.pending = null; // 죽기 직전에 찍힌 자동 체크포인트는 버림
  practice.respawnTimer = PRACTICE_RESPAWN_DELAY;
  practice.deathAt = {
    x: app.cameraX + app.player.screenX,
    y: app.player.y + app.player.h / 2,
    character: app.player.character,
  };
}

function practiceRespawn() {
  const practice = app.practice;
  const target = practice.checkpoints[practice.checkpoints.length - 1] || practice.start;
  restoreGameState(target);
  practice.dead = false;
  practice.deathAt = null;
  practice.sinceLast = 0;
  practice.pending = null;
  practice.attempts += 1;
  updatePracticeBar();
}

function updatePracticeBar() {
  if (!practiceBar) return;
  const practice = app.practice;
  const count = practice?.checkpoints.length || 0;
  practiceBar.querySelector('[data-practice-count]').textContent = `체크포인트 ${count} · 시도 ${practice?.attempts || 0}`;
  practiceBar.querySelector('[data-practice="remove"]').disabled = count === 0;
}

let practiceBarShown = false;
function syncPracticeBar() {
  const show = practiceActive();
  if (show === practiceBarShown) return;
  practiceBarShown = show;
  practiceBar?.classList.toggle('hidden', !show);
  if (show) updatePracticeBar();
}

function drawCheckpoints(drawCtx) {
  const practice = app.practice;
  if (!practice?.active) return;
  const list = practice.checkpoints;
  list.forEach((checkpoint, index) => {
    const x = checkpoint.markerX - app.cameraX;
    if (x < -20 || x > 980) return;
    const last = index === list.length - 1;
    const size = last ? 9 + practice.flash * 10 : 6;
    drawCtx.save();
    drawCtx.translate(Math.round(x), Math.round(checkpoint.markerY));
    drawCtx.rotate(Math.PI / 4);
    drawCtx.globalAlpha = last ? 1 : 0.55;
    drawCtx.fillStyle = checkpoint.kind === 'manual' ? '#89ff90' : '#57e0c8';
    drawCtx.fillRect(-size / 2, -size / 2, size, size);
    drawCtx.strokeStyle = '#0b2a1c';
    drawCtx.lineWidth = 2;
    drawCtx.strokeRect(-size / 2, -size / 2, size, size);
    drawCtx.restore();
  });
}

function drawPracticeDeath(drawCtx) {
  const practice = app.practice;
  if (!practice?.dead || !practice.deathAt) return;
  const progress = 1 - practice.respawnTimer / PRACTICE_RESPAWN_DELAY;
  const x = practice.deathAt.x - app.cameraX;
  const y = practice.deathAt.y;
  drawCtx.fillStyle = '#53d1ff';
  drawCtx.globalAlpha = Math.max(0, 1 - progress);
  for (let i = 0; i < 10; i += 1) {
    const angle = (i / 10) * Math.PI * 2;
    const distance = 8 + progress * 60;
    drawCtx.fillRect(Math.round(x + Math.cos(angle) * distance - 3), Math.round(y + Math.sin(angle) * distance - 3), 6, 6);
  }
  drawCtx.globalAlpha = 1;
}

// 게임이 멈췄는가 (화면 전환 또는 연습 모드에서 죽어 있는 중)
function runStopped() {
  return app.screen !== SCREENS.PLAY || practiceDead();
}

function resetStage(stageNumber = app.currentStage) {
  app.isCustomRun = false;
  app.currentStage = stageNumber;
  app.world = getStageMap(app.selectedCharacter, app.currentStage);
  app.player = createPlayer(app.selectedCharacter);
  app.cameraX = 0;
  app.cameraY = 0;
  app.speedEffect = null;
  app.padTriggers = new Set();
  app.touchingOrb = null;
  app.stageStartMs = performance.now();
  if (!app.practiceMode) app.attempts[app.selectedCharacter][app.currentStage] += 1;
  app.screen = SCREENS.PLAY;
  setupPractice();
  screenManager.showPlay();
  screenManager.updateHud({ progress: 0, stage: app.currentStage, character: app.selectedCharacter, practice: app.practiceMode });
  void playStageMusic(app.currentStage);
}

function resetCustomMap() {
  if (!app.loadedMapSpec) return;
  app.isCustomRun = true;
  app.selectedCharacter = MODE_BY_CODE[app.loadedMapSpec.startMode]?.id || 'cube';
  app.world = buildCustomWorld(app.loadedMapSpec);
  app.player = createPlayer(app.selectedCharacter, app.world);
  app.cameraX = app.world.startWorldX - app.player.screenX + app.player.w / 2;
  app.cameraY = Math.min(0, app.player.y - 250);
  app.speedEffect = null;
  app.padTriggers = new Set();
  app.touchingOrb = null;
  app.stageStartMs = performance.now();
  if (!app.practiceMode) app.customAttempts += 1;
  app.screen = SCREENS.PLAY;
  setupPractice();
  screenManager.showPlay();
  screenManager.updateHud({ progress: 0, stage: 'CUSTOM', character: app.selectedCharacter, practice: app.practiceMode });
  void playStageMusic(1);
}

function currentWorldProgress() {
  if (!app.world || !app.player) return 0;
  const playerWorldX = app.cameraX + app.player.screenX;
  if (app.isCustomRun) {
    const distance = Math.max(TILE, app.world.clearWorldX - app.world.startWorldX);
    return clamp((playerWorldX - app.world.startWorldX) / distance, 0, 1);
  }
  return clamp(playerWorldX / app.world.length, 0, 1);
}

function failStage() {
  if (app.screen !== SCREENS.PLAY) return;
  if (app.practice?.active) {
    practiceDeath(); // 연습 모드: 결과 화면 없이 체크포인트에서 다시
    return;
  }
  stopStageMusic();
  playSfx('death');
  app.screen = SCREENS.FAIL;
  const progress = currentWorldProgress();
  app.failSummary = { percent: Math.round(progress * 100) };
  screenManager.showFail(app.failSummary);
}

function clearStage() {
  stopStageMusic();
  app.screen = SCREENS.CLEAR;
  const timeTaken = (performance.now() - app.stageStartMs) / 1000;
  const isPractice = Boolean(app.practice?.active);
  app.clearSummary = {
    attempts: isPractice
      ? app.practice.attempts
      : app.isCustomRun ? app.customAttempts : app.attempts[app.selectedCharacter][app.currentStage],
    timeTaken,
    stageNumber: app.currentStage,
    isLastStage: !app.isCustomRun && app.currentStage >= 4,
    isCustom: app.isCustomRun,
    isPractice,
    checkpoints: isPractice ? app.practice.checkpoints.length : 0,
  };
  if (app.practice) app.practice.active = false;
  if (app.isCustomRun) app.clearSummary.stageNumber = 'CUSTOM';
  screenManager.showClear(app.clearSummary);
}

function currentSpeed() {
  if (!app.world) return 0;
  const effect = app.speedEffect?.multiplier || 1;
  return app.world.baseSpeed * effect;
}

/* ---------- 게임 모드별 물리 ----------
   player.gravity: 1 = 아래로 떨어짐, -1 = 위로 떨어짐
   모든 모드가 중력 방향을 따름 (초록 공점으로 뒤집을 수 있음)
*/
const MODE_PHYSICS = {
  cube: { gravity: CUBE_GRAVITY },
  robot: { gravity: CUBE_GRAVITY, jump: 430, boostTime: 0.24 },
  ufo: { gravity: 1600, flap: 480, orb: 620, maxFall: 650 },
  ball: { gravity: 1500, push: 180, orb: 560, maxSpeed: 800, buffer: 0.12 },
  spider: { gravity: 1800, orb: 560, maxSpeed: 900 },
  swing: { gravity: 1500, maxSpeed: 460, orb: 460 },
  ship: { gravity: SHIP_GRAVITY, maxSpeed: 520 },
  wave: {},
};

function gravityOf(player) {
  return player.gravity === -1 ? -1 : 1;
}

// 중력 쪽 표면에 닿으면 착지, 반대쪽 표면은 bumpHead일 때만 막힘 (아니면 박혀서 죽음)
function resolveSurfaces(player, prevY, dx, { snap = false, bumpHead = true } = {}) {
  const dir = gravityOf(player);
  const rect = getPlayerRect();
  if (player.vy >= 0) {
    const floor = findFloor(rect, prevY + player.h, dx, snap && dir === 1);
    if (floor && (dir === 1 || bumpHead || !floor.owner)) {
      player.y = floor.y - player.h;
      player.vy = 0;
      return dir === 1 ? floor : null;
    }
  } else {
    const ceiling = findCeiling(rect, prevY, dx, snap && dir === -1);
    if (ceiling && (dir === -1 || bumpHead || !ceiling.owner)) {
      player.y = ceiling.y;
      player.vy = 0;
      return dir === -1 ? ceiling : null;
    }
  }
  return null;
}

function landOn(player, surface) {
  player.grounded = Boolean(surface);
  player.groundOwner = surface?.owner || null;
  return Boolean(surface);
}

function markJumpFrom(player) {
  if (player.groundOwner) player.groundOwner.jumped = true; // jump 조건: 이 블록 위에서 점프
}

function jumpVelocity() {
  return app.world.recommendedJumpVelocity ?? -610;
}

function updateCubeMode(dt, dx, prevY) {
  const player = app.player;
  const dir = gravityOf(player);
  const wasGrounded = player.grounded;
  if (app.input.justPressed) {
    if (useOrb()) {
      player.vy = jumpVelocity() * dir;
      player.grounded = false;
    } else if (player.grounded) {
      player.vy = jumpVelocity() * dir;
      player.grounded = false;
      markJumpFrom(player);
      playSfx('click');
    }
  }
  player.vy += MODE_PHYSICS.cube.gravity * dir * dt;
  player.y += player.vy * dt;
  const floor = resolveSurfaces(player, prevY, dx, { snap: wasGrounded, bumpHead: false });
  if (landOn(player, floor)) player.rotation = Math.atan(floor.grad) * dir;
  else player.rotation += dt * 7 * dir;
}

// 로봇: 누르고 있는 동안(최대 boostTime) 상승 속도 유지 → 오래 누를수록 높이
function updateRobotMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.robot;
  const dir = gravityOf(player);
  const wasGrounded = player.grounded;
  if (app.input.justPressed) {
    if (useOrb()) {
      player.vy = jumpVelocity() * dir;
      player.boostTimer = 0;
      player.grounded = false;
    } else if (player.grounded) {
      player.vy = -settings.jump * dir;
      player.boostTimer = settings.boostTime;
      player.grounded = false;
      markJumpFrom(player);
      playSfx('click');
    }
  }
  if (player.boostTimer > 0 && app.input.pressed) {
    player.vy = -settings.jump * dir;
    player.boostTimer -= dt;
  } else {
    player.boostTimer = 0;
    player.vy += settings.gravity * dir * dt;
  }
  player.y += player.vy * dt;
  const floor = resolveSurfaces(player, prevY, dx, { snap: wasGrounded, bumpHead: false });
  if (landOn(player, floor)) player.boostTimer = 0;
  player.rotation = floor ? Math.atan(floor.grad) * dir : clamp((player.vy * dir) / 2400, -0.2, 0.2);
}

// UFO: 클릭할 때마다 공중에서도 짧게 도약
function updateUfoMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.ufo;
  const dir = gravityOf(player);
  const wasGrounded = player.grounded;
  if (app.input.justPressed) {
    if (useOrb()) {
      player.vy = -settings.orb * dir;
    } else {
      if (player.grounded) markJumpFrom(player);
      player.vy = -settings.flap * dir;
    }
    player.grounded = false;
  }
  player.vy += settings.gravity * dir * dt;
  player.vy = dir === 1 ? Math.min(player.vy, settings.maxFall) : Math.max(player.vy, -settings.maxFall);
  player.y += player.vy * dt;
  landOn(player, resolveSurfaces(player, prevY, dx, { snap: wasGrounded && player.vy * dir >= 0, bumpHead: true }));
  player.rotation = clamp((player.vy * dir) / 1500, -0.3, 0.3);
}

// 볼: 표면에 닿아 있을 때 클릭하면 중력 반전
function updateBallMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.ball;
  const wasGrounded = player.grounded;
  if (app.input.justPressed) {
    if (useOrb()) {
      player.vy = -gravityOf(player) * settings.orb;
      player.grounded = false;
      player.flipBuffer = 0;
    } else {
      player.flipBuffer = settings.buffer; // 착지 직전에 누른 것도 인정
    }
  }
  if (player.flipBuffer > 0 && player.grounded) {
    markJumpFrom(player);
    player.gravity = -gravityOf(player);
    player.vy = player.gravity * settings.push;
    player.grounded = false;
    player.flipBuffer = 0;
    playSfx('click');
  }
  player.flipBuffer = Math.max(0, (player.flipBuffer || 0) - dt);
  const dir = gravityOf(player);
  player.vy = clamp(player.vy + settings.gravity * dir * dt, -settings.maxSpeed, settings.maxSpeed);
  player.y += player.vy * dt;
  landOn(player, resolveSurfaces(player, prevY, dx, { snap: wasGrounded, bumpHead: true }));
  player.rotation += (dx / (player.w / 2)) * dir; // 굴러가기
}

// 스파이더: 클릭하면 반대쪽 표면으로 순간 이동
function updateSpiderMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.spider;
  const wasGrounded = player.grounded;
  if (app.input.justPressed) {
    if (useOrb()) {
      player.vy = -gravityOf(player) * settings.orb;
      player.grounded = false;
    } else if (player.grounded) {
      markJumpFrom(player);
      const fromY = player.y + player.h / 2;
      const target = findOppositeSurface(getPlayerRect(), gravityOf(player));
      player.gravity = -gravityOf(player);
      if (target) {
        player.y = player.gravity === -1 ? target.y : target.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.groundOwner = target.owner || null;
      } else {
        player.vy = player.gravity * 1400; // 반대쪽에 표면이 없으면 날아가 버림
        player.grounded = false;
      }
      player.flash = { t: 0.18, fromY, toY: player.y + player.h / 2 };
      playSfx('click');
      return; // 순간 이동한 프레임은 물리 계산 생략
    }
  }
  const dir = gravityOf(player);
  player.vy = clamp(player.vy + settings.gravity * dir * dt, -settings.maxSpeed, settings.maxSpeed);
  player.y += player.vy * dt;
  landOn(player, resolveSurfaces(player, prevY, dx, { snap: wasGrounded, bumpHead: true }));
  player.rotation = 0;
}

// 스윙: 누르고 있으면 중력이 위로, 떼면 아래로
function updateSwingMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.swing;
  if (app.input.justPressed && useOrb()) player.vy = -settings.orb;
  // 초록 공점을 쓰면 위아래가 뒤바뀜 (swingInvert)
  player.gravity = (app.input.pressed ? -1 : 1) * (player.swingInvert ? -1 : 1);
  player.vy = clamp(player.vy + settings.gravity * player.gravity * dt, -settings.maxSpeed, settings.maxSpeed);
  player.y += player.vy * dt;
  landOn(player, resolveSurfaces(player, prevY, dx, { bumpHead: true }));
  player.rotation = clamp(player.vy / 520, -0.6, 0.6);
}

function updateShipMode(dt, dx, prevY) {
  const player = app.player;
  const settings = MODE_PHYSICS.ship;
  const dir = gravityOf(player);
  if (app.input.justPressed && useOrb()) player.vy = ORB_SHIP_IMPULSE * dir;
  if (app.input.pressed) player.vy -= (app.world.thrust ?? 1460) * dir * dt;
  player.vy = clamp(player.vy + settings.gravity * dir * dt, -settings.maxSpeed, settings.maxSpeed);
  player.y += player.vy * dt;
  resolveSurfaces(player, prevY, dx, { bumpHead: true });
  player.grounded = false;
  player.rotation = clamp((player.vy * dir) / 420, -0.8, 0.8);
}

// 웨이브: 누르면 대각선 위, 떼면 대각선 아래 (가로 속도와 같은 크기 → 45°)
function updateWaveMode(dt, dx, prevY) {
  const player = app.player;
  const up = app.input.pressed;
  player.vy = (up ? -1 : 1) * gravityOf(player) * currentSpeed();
  player.y += player.vy * dt;
  const sliding = Boolean(resolveSurfaces(player, prevY, dx, { bumpHead: true })) || player.vy === 0;
  player.grounded = false;
  player.rotation = sliding ? 0 : ((up ? -1 : 1) * gravityOf(player) * Math.PI) / 4;
  player.trail = player.trail || [];
  player.trail.push({ x: app.cameraX + player.screenX, y: player.y + player.h / 2 });
  if (player.trail.length > 90) player.trail.shift();
}

const MODE_UPDATERS = {
  cube: updateCubeMode,
  robot: updateRobotMode,
  ufo: updateUfoMode,
  ball: updateBallMode,
  spider: updateSpiderMode,
  swing: updateSwingMode,
  ship: updateShipMode,
  wave: updateWaveMode,
};

// 스파이더 순간 이동 목적지: dir 1이면 위쪽 천장, -1이면 아래쪽 바닥
function findOppositeSurface(rect, dir) {
  const x1 = rect.x + 1;
  const x2 = rect.x + rect.w - 1;
  let best = null;
  if (dir === 1) {
    if (app.world.ceilingY != null && app.world.ceilingY <= rect.y + 1) best = { y: app.world.ceilingY };
    for (const solid of solidsNear(rect)) {
      const surface = surfaceUnder(solid.points, x1, x2, 'bottom');
      if (surface && surface.y <= rect.y + 1 && (!best || surface.y > best.y)) best = { y: surface.y, owner: solid.owner };
    }
  } else {
    const bottom = rect.y + rect.h;
    if (worldHasGround() && GROUND_Y >= bottom - 1) best = { y: GROUND_Y };
    for (const solid of solidsNear(rect)) {
      const surface = surfaceUnder(solid.points, x1, x2, 'top');
      if (surface && surface.y >= bottom - 1 && (!best || surface.y < best.y)) best = { y: surface.y, owner: solid.owner };
    }
  }
  return best;
}

// 맵 밖으로 나가면 사망 (기본 맵 위쪽은 막힘)
function checkPlayerBounds() {
  const player = app.player;
  const world = app.world;
  if (world.custom) {
    if (player.y > GROUND_Y + 400 || player.y + player.h < world.topLimit) failStage();
  } else if (world.type === 'ship') {
    if (player.y <= 0 || player.y + player.h >= WORLD_HEIGHT) failStage();
  } else if (world.type === 'gravity') {
    if (player.y + player.h < 0 || player.y > WORLD_HEIGHT) failStage();
  } else {
    if (player.y < 0) {
      player.y = 0;
      player.vy = Math.max(player.vy, 0);
    }
    if (player.y > WORLD_HEIGHT + 120) failStage();
  }
}

/* ---------- 특수 공점 ----------
   초록 공점: 중력 반전 · 검은 공점: 중력 방향으로 확 내리꽂힘
   화살표 공점: 누르고 있는 동안 화살표 방향(-80°~80°)으로 돌진, 떼거나 S블록에 닿으면 멈춤
*/
const BLACK_ORB_SPEED = 1100;
const GREEN_ORB_PUSH = 260;

// 돌진 각도: 화면 기준 시계 방향 (0° = →, 양수 = 아래쪽, 음수 = 위쪽)
function signedAngle(angle) {
  const value = normalizeAngle(angle);
  return value > 180 ? value - 360 : value;
}

function clampDashAngle(angle) {
  return normalizeAngle(clamp(signedAngle(angle), -DASH_ANGLE_LIMIT, DASH_ANGLE_LIMIT));
}

function flipPlayerGravity(player) {
  if (player.character === 'swing') {
    player.swingInvert = !player.swingInvert;
    player.gravity = -gravityOf(player);
  } else {
    player.gravity = -gravityOf(player);
  }
  player.grounded = false;
  player.groundOwner = null;
  player.boostTimer = 0;
}

// 노란 공점(nextJump)은 각 모드 안에서 처리, 나머지는 여기서
function useSpecialOrb() {
  const orb = app.touchingOrb;
  if (!app.input.justPressed || !orb || orb.type === 'orb') return false;
  const player = app.player;
  if (orb.type === 'orbBlack' && player.character === 'wave') return false; // 웨이브는 속도가 고정이라 효과 없음
  app.padTriggers.add(orb.id);
  if (orb.owner) orb.owner.jumped = true;
  app.touchingOrb = null;
  playSfx('click');

  if (orb.type === 'orbGreen') {
    flipPlayerGravity(player);
    player.vy = gravityOf(player) * GREEN_ORB_PUSH;
  } else if (orb.type === 'orbBlack') {
    player.vy = gravityOf(player) * BLACK_ORB_SPEED;
    player.grounded = false;
    player.boostTimer = 0;
  } else if (orb.type === 'orbDash') {
    const angle = signedAngle(clampDashAngle(orb.owner?.rotation || 0));
    player.dash = { angle, slope: Math.tan((angle * Math.PI) / 180) };
    player.grounded = false;
    player.boostTimer = 0;
  }
  app.input.justPressed = false; // 같은 클릭으로 점프까지 하지 않도록
  return true;
}

function endDash(player) {
  if (!player.dash) return;
  player.dash = null;
  player.vy = 0;
}

function updateDash(dt, dx, prevY) {
  const player = app.player;
  if (!app.input.pressed) {
    endDash(player);
    return false;
  }
  player.vy = player.dash.slope * currentSpeed();
  player.y += player.dash.slope * dx;
  resolveSurfaces(player, prevY, dx, { bumpHead: true });
  player.grounded = false;
  player.rotation = (player.dash.angle * Math.PI) / 180;
  if (player.character === 'wave') {
    player.trail.push({ x: app.cameraX + player.screenX, y: player.y + player.h / 2 });
    if (player.trail.length > 90) player.trail.shift();
  }
  return true;
}

function updatePlayerMode(dt, dx, prevY) {
  const player = app.player;
  if (player.flash) {
    player.flash.t -= dt;
    if (player.flash.t <= 0) player.flash = null;
  }
  useSpecialOrb();
  if (!(player.dash && updateDash(dt, dx, prevY))) {
    (MODE_UPDATERS[player.character] || updateCubeMode)(dt, dx, prevY);
  }
  if (!runStopped()) checkPlayerBounds();
}

// 커스텀 맵은 높이 쌓인 블록을 따라갈 수 있도록 세로 카메라 사용
function updateCameraY(dt) {
  if (!app.world?.custom || !app.player) {
    app.cameraY = 0;
    return;
  }
  const topMargin = 140;
  const bottomMargin = 330;
  const screenY = app.player.y - app.cameraY;
  let target = app.cameraY;
  if (screenY < topMargin) target = app.player.y - topMargin;
  else if (screenY > bottomMargin) target = app.player.y - bottomMargin;
  target = Math.min(0, target);
  app.cameraY += (target - app.cameraY) * Math.min(1, dt * 8);
}

/* ---------- 블록 코드 실행 ---------- */
function playerGridPosition() {
  const rect = getPlayerRect();
  if (!rect) return { x: 0, y: 0 };
  return {
    x: Math.round((rect.x / TILE) * 1000) / 1000,
    y: Math.round(((GROUND_Y - (rect.y + rect.h)) / TILE) * 1000) / 1000,
  };
}

// caTp(A, B): 캐릭터 왼쪽 아래를 그리드 (A, B)로
function teleportPlayer(gridX, gridY) {
  const player = app.player;
  if (!player) return;
  app.cameraX = gridX * TILE - player.screenX + player.w / 2;
  player.y = GROUND_Y - gridY * TILE - player.h;
  player.vy = 0;
  player.grounded = false;
  player.groundOwner = null;
}

function isKeyDisabled(source) {
  const keys = app.world?.disabledKeys;
  if (!keys || !source) return false;
  const active = (key) => (keys[key] ?? -Infinity) > app.world.time;
  return active('all') || active(source);
}

function reportScriptError(block, error) {
  const message = error instanceof Error ? error.message : String(error);
  const text = `${block.kind.tag} (${formatMapNumber(block.x)}, ${formatMapNumber(block.y)}) 코드 오류 · ${message}`;
  console.warn(text);
  app.world.scriptErrors.push({ text, until: app.world.time + 6 });
  if (app.world.scriptErrors.length > 4) app.world.scriptErrors.shift();
}

function runBlockScripts(dt) {
  const world = app.world;
  if (!world?.custom) return;
  world.time += dt;
  for (const runtime of world.scripts) {
    if (runtime.done) continue;
    try {
      stepScript(runtime);
    } catch (error) {
      runtime.done = true;
      reportScriptError(runtime.block, error);
    }
    if (runStopped()) return; // kill() 등으로 끝남
  }
  if (world.listsDirty) rebuildWorldLists(world);
}

function updateGame(dt) {
  if (app.screen !== SCREENS.PLAY || !app.world || !app.player) {
    app.input.justPressed = false;
    return;
  }

  // 연습 모드: 죽은 뒤 잠깐 멈췄다가 마지막 체크포인트에서 다시
  if (practiceDead()) {
    app.practice.respawnTimer -= dt;
    if (app.practice.respawnTimer <= 0) practiceRespawn();
    app.input.justPressed = false;
    return;
  }

  if (app.speedEffect) {
    app.speedEffect.timer -= dt;
    if (app.speedEffect.timer <= 0) {
      app.speedEffect = null;
    }
  }

  // 블록 코드 실행 (커스텀 맵)
  if (app.world.custom) {
    runBlockScripts(dt);
    if (runStopped()) {
      app.input.justPressed = false;
      return;
    }
    if (isKeyDisabled(app.input.source)) {
      app.input.pressed = false;
      app.input.justPressed = false;
    }
  }

  const dx = currentSpeed() * dt;
  app.cameraX += dx;

  handleTriggers();
  const prevY = app.player.y;

  updatePlayerMode(dt, dx, prevY);

  if (!runStopped() && (hitsSolidSide() || hitsHazard())) {
    failStage();
  }

  if (!runStopped()) {
    updateCameraY(dt);
    const progress = currentWorldProgress();
    screenManager.updateHud({ progress, stage: app.isCustomRun ? 'CUSTOM' : app.currentStage, character: app.player.character, practice: Boolean(app.practice?.active) });

    if (progress >= 0.995) {
      clearStage();
    } else {
      updatePracticeCheckpoints(dt);
    }
  }

  app.input.justPressed = false;
}

/* ---------- 렌더링 ---------- */
function drawPixelRect(drawCtx, x, y, w, h, color, pixel = 6, accent) {
  drawCtx.fillStyle = color;
  drawCtx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  if (accent) {
    drawCtx.fillStyle = accent;
    for (let yy = 0; yy < h; yy += pixel * 2) {
      for (let xx = 0; xx < w; xx += pixel * 2) {
        drawCtx.fillRect(Math.round(x + xx), Math.round(y + yy), Math.min(pixel, w - xx), Math.min(pixel, h - yy));
      }
    }
  }
}

function tracePolygon(drawCtx, points, offsetX) {
  drawCtx.beginPath();
  points.forEach((point, index) => {
    if (index === 0) drawCtx.moveTo(point.x - offsetX, point.y);
    else drawCtx.lineTo(point.x - offsetX, point.y);
  });
  drawCtx.closePath();
}

function drawGround(drawCtx, theme) {
  if (!app.world?.custom && app.world?.type === 'ship') {
    drawCtx.fillStyle = 'rgba(255,255,255,0.06)';
    drawCtx.fillRect(0, 0, 960, 8);
    drawCtx.fillRect(0, WORLD_HEIGHT - 8, 960, 8);
    return;
  }
  const groundTop = GROUND_Y;
  const groundHeight = WORLD_HEIGHT - groundTop + 400;
  drawPixelRect(drawCtx, 0, groundTop, 960, groundHeight, theme.ground, 10, theme.ground2);
  drawCtx.fillStyle = theme.glow;
  drawCtx.fillRect(0, groundTop, 960, 6);
  drawCtx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let x = 0; x < 960; x += TILE) {
    drawCtx.fillRect(x, groundTop + ((Math.floor((x + app.cameraX * 0.2) / TILE) % 2) * 8), TILE / 2, 4);
  }
  // 볼 · 스파이더 통로의 천장
  if (!app.world?.custom && app.world?.ceilingY != null) {
    const ceiling = app.world.ceilingY;
    drawPixelRect(drawCtx, 0, -400, 960, ceiling + 400, theme.ground, 10, theme.ground2);
    drawCtx.fillStyle = theme.glow;
    drawCtx.fillRect(0, ceiling - 6, 960, 6);
  }
}

function drawParallax(drawCtx, theme) {
  const gradient = drawCtx.createLinearGradient(0, 0, 0, WORLD_HEIGHT);
  gradient.addColorStop(0, theme.skyTop);
  gradient.addColorStop(1, theme.skyBottom);
  drawCtx.fillStyle = gradient;
  drawCtx.fillRect(0, 0, 960, WORLD_HEIGHT);

  app.world?.stars.forEach((star) => {
    const px = ((star.x - app.cameraX * star.speedFactor) % 960 + 960) % 960;
    drawCtx.fillStyle = star.color;
    drawCtx.globalAlpha = 0.35 + star.layer * 0.2;
    drawCtx.fillRect(Math.round(px), Math.round(star.y), star.size, star.size);
    drawCtx.globalAlpha = 1;
  });

  drawCtx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 7; i += 1) {
    const width = 140 + i * 24;
    const height = 40 + (i % 3) * 30;
    const x = ((i * 170 - app.cameraX * (0.12 + i * 0.02)) % 1180 + 1180) % 1180 - 110;
    const y = 120 + i * 42;
    drawCtx.fillRect(x, y, width, height);
  }
}

function defaultSprite(key) {
  return getSpriteCanvas(DEFAULT_DESIGNS[key]);
}

// 스프라이트를 (cx, cy) 중심, size 크기, rotation(도)으로 그림
function drawSpriteAt(drawCtx, sprite, cx, cy, w, h, rotation = 0) {
  if (!rotation) {
    drawCtx.drawImage(sprite, Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
    return;
  }
  drawCtx.save();
  drawCtx.translate(cx, cy);
  drawCtx.rotate((rotation * Math.PI) / 180);
  drawCtx.drawImage(sprite, -w / 2, -h / 2, w, h);
  drawCtx.restore();
}

// 큰 직사각형은 40px 근처 크기로 나눠서 스프라이트를 타일처럼 깔기
function drawSpriteTiled(drawCtx, sprite, x, y, w, h) {
  const cols = Math.max(1, Math.round(w / TILE));
  const rows = Math.max(1, Math.round(h / TILE));
  const cellW = w / cols;
  const cellH = h / rows;
  for (let row = 0; row < rows; row += 1) {
    for (let col = 0; col < cols; col += 1) {
      drawCtx.drawImage(sprite, Math.round(x + col * cellW), Math.round(y + row * cellH), Math.ceil(cellW), Math.ceil(cellH));
    }
  }
}

// 커스텀 맵: 블록마다 8×8 디자인 스프라이트
function drawDecor(drawCtx) {
  if (!app.world?.decor) return;
  app.world.decor.forEach((item) => {
    const x = item.cx - app.cameraX;
    if (x < -TILE * 2 || x > 960 + TILE * 2) return;
    // item = 실행 중인 블록. ghost: 투명도(0~100), 쓴 공점은 흐리게, S블록은 안 보임
    if (item.type === 'sBlock') return;
    const used = ORB_BLOCK_TYPES.has(item.type) && app.padTriggers.has(item.id);
    const alpha = (1 - (item.ghost || 0) / 100) * (used ? 0.3 : 1);
    if (alpha <= 0) return;
    drawCtx.globalAlpha = alpha;
    drawSpriteAt(drawCtx, item.sprite, x, item.cy, TILE, TILE, item.rotation);
    drawCtx.globalAlpha = 1;
  });
}

// 기본 스테이지: 기존 히트박스 크기에 기본 디자인 스프라이트를 맞춰 그림
function drawProceduralPads(drawCtx) {
  if (!app.world) return;
  const spriteKey = { jump: 'jumpUp', boost: 'doubleSpeed', slow: 'halfSpeed' };
  app.world.pads.forEach((pad) => {
    const x = pad.x - app.cameraX;
    if (x < -80 || x > 1040 || !spriteKey[pad.type]) return;
    const sprite = defaultSprite(spriteKey[pad.type]);
    if (pad.floating) {
      drawCtx.drawImage(sprite, Math.round(x), Math.round(pad.y), pad.w, pad.h);
    } else {
      // 패드 그림이 아래쪽 칸에 있으니 아래에 맞춤
      drawCtx.drawImage(sprite, Math.round(x), Math.round(pad.y + pad.h - TILE), pad.w, TILE);
    }
  });
}

function drawProceduralObstacles(drawCtx) {
  if (!app.world) return;
  app.world.obstacles.forEach((obstacle) => {
    const x = obstacle.x - app.cameraX;
    if (x + obstacle.w < -60 || x > 1020) return;
    if (obstacle.type === 'block') {
      drawSpriteTiled(drawCtx, defaultSprite('dieBlock'), x, obstacle.y, obstacle.w, obstacle.h);
    } else if (obstacle.type === 'spikeUp' || obstacle.type === 'spikeDown') {
      drawSpriteAt(drawCtx, defaultSprite('thorn'), x + obstacle.w / 2, obstacle.y + obstacle.h / 2, obstacle.w, obstacle.h,
        obstacle.type === 'spikeDown' ? 180 : 0);
    }
  });
}

// 모든 모드 공통: 8×8 스프라이트를 정사각형으로 그림 (히트박스는 모드별 크기)
function drawPlayer(drawCtx, player) {
  if (player.character === 'wave' && player.trail?.length > 1) {
    drawCtx.save();
    drawCtx.strokeStyle = 'rgba(83, 209, 255, 0.55)';
    drawCtx.lineWidth = 6;
    drawCtx.lineJoin = 'round';
    drawCtx.beginPath();
    player.trail.forEach((point, index) => {
      const x = point.x - app.cameraX;
      if (index === 0) drawCtx.moveTo(x, point.y);
      else drawCtx.lineTo(x, point.y);
    });
    drawCtx.lineTo(player.screenX, player.y + player.h / 2);
    drawCtx.stroke();
    drawCtx.restore();
  }
  if (player.flash) {
    // 스파이더 순간 이동 잔상
    drawCtx.fillStyle = `rgba(255, 94, 126, ${Math.max(0, player.flash.t / 0.18) * 0.5})`;
    const top = Math.min(player.flash.fromY, player.flash.toY);
    drawCtx.fillRect(player.screenX - 8, top, 16, Math.abs(player.flash.toY - player.flash.fromY));
  }
  const size = Math.max(player.w, player.h) * (player.character === 'wave' ? 1.5 : 1);
  drawCtx.save();
  drawCtx.translate(player.screenX, player.y + player.h / 2);
  drawCtx.rotate(player.rotation);
  if (player.gravity === -1 && player.character !== 'ball') drawCtx.scale(1, -1); // 거꾸로 붙어 있으면 뒤집어 그림
  drawCtx.drawImage(defaultSprite(characterSpriteKey(player.character)), -size / 2, -size / 2, size, size);
  drawCtx.restore();
}

function drawScriptErrors(drawCtx) {
  const errors = app.world?.scriptErrors?.filter((item) => item.until > app.world.time);
  if (!errors?.length) return;
  drawCtx.font = '13px Courier New';
  errors.forEach((item, index) => {
    const y = 78 + index * 22;
    const width = Math.min(940, drawCtx.measureText(item.text).width + 16);
    drawCtx.fillStyle = 'rgba(60, 8, 24, 0.85)';
    drawCtx.fillRect(10, y - 15, width, 20);
    drawCtx.fillStyle = '#ff9bad';
    drawCtx.fillText(item.text, 18, y);
  });
}

function drawStageMeta(drawCtx) {
  if (!app.world) return;
  drawCtx.fillStyle = 'rgba(255,255,255,0.15)';
  drawCtx.fillRect(0, 0, 960, 1);
  drawCtx.fillStyle = app.world.theme.glow;
  drawCtx.font = '16px Courier New';
  drawCtx.fillText(`SEED ${app.world.seed}`, 16, WORLD_HEIGHT - 18);
}

function render() {
  if (!ctx || !canvas) return;
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  const scale = worldScale();
  const offset = fieldOffset();

  ctx.imageSmoothingEnabled = false;
  ctx.save();
  ctx.translate(offset.x, offset.y);
  ctx.scale(scale, scale);

  const theme = app.world?.theme || {
    skyTop: '#1d2047',
    skyBottom: '#090c1c',
    glow: '#53d1ff',
    glow2: '#f3ff72',
    ground: '#183352',
    ground2: '#0e213a',
  };

  drawParallax(ctx, theme);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, 960, WORLD_HEIGHT);
  ctx.clip();
  ctx.translate(0, -Math.round(app.cameraY));
  drawGround(ctx, theme);
  if (app.world?.custom) {
    drawDecor(ctx);
  } else {
    drawProceduralPads(ctx);
    drawProceduralObstacles(ctx);
  }

  drawCheckpoints(ctx);
  if (app.player && !practiceDead()) {
    drawPlayer(ctx, app.player);
  }
  drawPracticeDeath(ctx);
  ctx.restore();

  drawStageMeta(ctx);
  drawScriptErrors(ctx);
  ctx.restore();
}

function renderCharacterPreview(canvasEl, character) {
  const previewCtx = canvasEl.getContext('2d');
  previewCtx.setTransform(1, 0, 0, 1, 0, 0);
  previewCtx.imageSmoothingEnabled = false;
  previewCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  const previewScale = canvasEl.width / 180;
  previewCtx.scale(previewScale, previewScale);
  previewCtx.fillStyle = '#10172b';
  previewCtx.fillRect(0, 0, 180, 180);
  previewCtx.fillStyle = '#203257';
  previewCtx.fillRect(0, 130, 180, 50);
  previewCtx.fillStyle = '#53d1ff';
  for (let i = 0; i < 6; i += 1) {
    previewCtx.fillRect(18 + i * 26, 26 + (i % 2) * 12, 4, 4);
  }
  const sprite = defaultSprite(characterSpriteKey(character));
  previewCtx.drawImage(sprite, 50, 50, 80, 80);
}

function animate(timestamp) {
  const dt = clamp((timestamp - (app.lastFrameMs || timestamp)) / 1000, 0, 0.033);
  app.lastFrameMs = timestamp;
  updateGame(dt);
  syncPracticeBar();
  render();
  requestAnimationFrame(animate);
}

function onPressStart(event) {
  if (event.target instanceof Element && event.target.closest('.pixel-button, .character-card')) {
    unlockAudio();
  }
  if (event.target instanceof Element && event.target.closest('#practice-bar')) return; // 연습 버튼은 점프 아님
  if (app.screen === SCREENS.PLAY) {
    unlockAudio();
    const source = event.type === 'keydown' ? 'space' : 'click';
    if (isKeyDisabled(source)) {
      event.preventDefault();
      return; // noKey로 막힌 키
    }
    app.input.source = source;
    app.input.pressed = true;
    app.input.justPressed = true;
    event.preventDefault();
  }
}

function onPressEnd(event) {
  if (app.screen === SCREENS.PLAY) {
    app.input.pressed = false;
    event.preventDefault();
  }
}

/* ---------- 맵 에디터 동작 ---------- */
function rerenderPodEditor({ keepScroll = true, scrollShiftY = 0 } = {}) {
  const scroller = keepScroll ? screenRoot.querySelector('.editor-grid-scroll') : null;
  const scrollPosition = scroller
    ? { left: scroller.scrollLeft, top: scroller.scrollTop }
    : null;
  screenManager.showPodEditor(app.editor, scrollPosition, scrollShiftY);
}

// 선택한 도구 → 놓을 블록 정보 (start / 블록 종류 / 코드 블록)
function editorToolSpec(tool) {
  const editor = app.editor;
  if (tool === 'start') return { type: 'start', kindId: null, code: '' };
  const kind = getEditorKind(editor, tool);
  if (kind) return { type: kind.type, kindId: kind.id, code: '' };
  if (String(tool).startsWith('coded:')) {
    const coded = editor.codedTools.find((item) => `coded:${item.id}` === tool);
    const codedKind = coded && getEditorKind(editor, coded.kindId);
    if (codedKind) return { type: codedKind.type, kindId: codedKind.id, code: coded.code };
  }
  return null;
}

function makeEditorBlock(spec, x, y) {
  const block = {
    id: app.editor.nextId,
    type: spec.type,
    kindId: spec.kindId,
    x,
    y,
    rotation: spec.type !== 'start' ? fixBlockRotation(spec.type, app.editor.placeRotation) : 0,
    code: spec.code || '',
  };
  app.editor.nextId += 1;
  return block;
}

function placeEditorBlock(value) {
  const [x, y] = String(value).split(',').map(Number);
  if (!Number.isInteger(x) || !Number.isInteger(y)) return;

  const occupiedIndex = app.editor.blocks.findIndex(
    (block) => Math.floor(block.x) === x && Math.floor(block.y) === y,
  );

  if (app.editor.tool === 'erase') {
    if (occupiedIndex >= 0) {
      app.editor.blocks.splice(occupiedIndex, 1);
      app.editor.selectedId = null;
      app.editor.status = `(${x}, ${y}) 블록을 지웠습니다.`;
    }
    app.editor.exportedCode = '';
    rerenderPodEditor();
    return;
  }

  if (occupiedIndex >= 0) {
    app.editor.selectedId = app.editor.blocks[occupiedIndex].id;
    app.editor.status = '블록을 선택했습니다. 방향 버튼으로 위치를, ROTATE로 각도를 조정할 수 있습니다.';
    rerenderPodEditor();
    return;
  }

  const spec = editorToolSpec(app.editor.tool);
  if (!spec) return;
  if (spec.type === 'start') {
    app.editor.blocks = app.editor.blocks.filter((block) => block.type !== 'start');
  }

  const block = makeEditorBlock(spec, x, y);
  app.editor.blocks.push(block);
  app.editor.selectedId = block.id;
  app.editor.exportedCode = '';
  app.editor.status = `${editorBlockTag(app.editor, block)} 블록을 (${x}, ${y})에 놓았습니다.${block.code ? ' (코드 포함)' : ''}`;
  rerenderPodEditor();
}

// 드래그한 직사각형 영역 채우기 (START 제외, ERASE면 영역 지우기)
function fillEditorRect(value) {
  const [x1, y1, x2, y2] = String(value).split(',').map(Number);
  if (![x1, y1, x2, y2].every(Number.isInteger)) return;
  const minX = Math.min(x1, x2);
  const maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2);
  const inRect = (block) => {
    const bx = Math.floor(block.x);
    const by = Math.floor(block.y);
    return bx >= minX && bx <= maxX && by >= minY && by <= maxY;
  };
  const tool = app.editor.tool;

  if (tool === 'start') {
    app.editor.status = 'START 블록은 드래그로 채울 수 없습니다. 한 칸만 클릭해 주세요.';
    rerenderPodEditor();
    return;
  }

  if (tool === 'erase') {
    const before = app.editor.blocks.length;
    app.editor.blocks = app.editor.blocks.filter((block) => !inRect(block));
    const removed = before - app.editor.blocks.length;
    if (!app.editor.blocks.some((block) => block.id === app.editor.selectedId)) app.editor.selectedId = null;
    app.editor.exportedCode = '';
    app.editor.status = `영역에서 블록 ${removed}개를 지웠습니다.`;
    rerenderPodEditor();
    return;
  }

  const spec = editorToolSpec(tool);
  if (!spec) return;
  const occupied = new Set(app.editor.blocks.map((block) => `${Math.floor(block.x)},${Math.floor(block.y)}`));
  let added = 0;
  let skipped = 0;
  for (let y = minY; y <= maxY; y += 1) {
    for (let x = minX; x <= maxX; x += 1) {
      if (occupied.has(`${x},${y}`)) {
        skipped += 1;
        continue;
      }
      app.editor.blocks.push(makeEditorBlock(spec, x, y));
      added += 1;
    }
  }
  app.editor.selectedId = null;
  app.editor.exportedCode = '';
  app.editor.status = `${spec.kindId ? editorKindTag(getEditorKind(app.editor, spec.kindId)) : tool} 블록 ${added}개를 채웠습니다.${skipped ? ` (이미 블록이 있는 ${skipped}칸은 건너뜀)` : ''}`;
  rerenderPodEditor();
}

function applyEditorRotation(angle) {
  const normalized = normalizeAngle(angle);
  const selected = app.editor.blocks.find((block) => block.id === app.editor.selectedId);
  app.editor.placeRotation = normalized;
  if (selected && ROTATABLE_TYPES.has(selected.type)) {
    selected.rotation = fixBlockRotation(selected.type, normalized);
    app.editor.exportedCode = '';
    if (selected.type === 'dashOrb') {
      const signed = selected.rotation > 180 ? selected.rotation - 360 : selected.rotation;
      app.editor.status = `화살표 공점 방향 ${formatMapNumber(signed)}° (0° = →, 양수 = 아래쪽, 음수 = 위쪽, -80°~80°까지)`;
    } else {
      app.editor.status = `${TYPE_LABELS[selected.type]} 블록을 ${formatMapNumber(normalized)}°로 돌렸습니다. (히트박스도 함께 회전)`;
    }
  } else {
    app.editor.status = `새로 놓을 블록 각도를 ${formatMapNumber(normalized)}°로 정했습니다.`;
  }
  rerenderPodEditor();
}

function rotateEditor(delta) {
  if (!Number.isFinite(delta)) return;
  const selected = app.editor.blocks.find((block) => block.id === app.editor.selectedId);
  const base = selected && ROTATABLE_TYPES.has(selected.type) ? selected.rotation || 0 : app.editor.placeRotation;
  applyEditorRotation(base + delta);
}

function setEditorRotation(value) {
  const angle = Number(value);
  if (value === '' || value === undefined || !Number.isFinite(angle)) {
    app.editor.status = '각도에는 숫자를 입력해 주세요.';
    rerenderPodEditor();
    return;
  }
  applyEditorRotation(angle);
}

function nudgeSelectedBlock(direction) {
  const selected = app.editor.blocks.find((block) => block.id === app.editor.selectedId);
  if (!selected) return;

  const step = app.editor.fineMove ? 0.1 : 1;
  const offsets = {
    left: [-step, 0],
    right: [step, 0],
    up: [0, step],
    down: [0, -step],
  };
  const [dx, dy] = offsets[direction] || [0, 0];
  const nextX = Math.round((selected.x + dx) * 10) / 10;
  const nextY = Math.round((selected.y + dy) * 10) / 10;

  if (nextX < 0 || nextY < 0) {
    app.editor.status = 'X와 Y 좌표에는 음수를 사용할 수 없습니다.';
    rerenderPodEditor();
    return;
  }

  const targetIsOccupied = app.editor.blocks.some((block) => (
    block.id !== selected.id
    && Math.floor(block.x) === Math.floor(nextX)
    && Math.floor(block.y) === Math.floor(nextY)
  ));
  if (targetIsOccupied) {
    app.editor.status = '이 칸에는 이미 다른 블록이 있습니다.';
    rerenderPodEditor();
    return;
  }

  selected.x = nextX;
  selected.y = nextY;
  if (nextX >= app.editor.cols - 3) app.editor.cols = Math.ceil(nextX) + 40;
  let addedRows = 0;
  if (nextY >= app.editor.rows - 3) {
    const newRows = Math.ceil(nextY) + 12;
    addedRows = newRows - app.editor.rows;
    app.editor.rows = newRows;
  }
  app.editor.exportedCode = '';
  app.editor.status = `${selected.type}: (${formatMapNumber(nextX)}, ${formatMapNumber(nextY)})`;
  rerenderPodEditor({ scrollShiftY: addedRows * EDITOR_CELL });
}

/* ---------- 픽셀 디자인 편집기 (블록 종류별) ---------- */
function setEditorKindDesign(kindId, tokens, status) {
  const editor = app.editor;
  const kind = getEditorKind(editor, kindId);
  if (!kind) return;
  kind.design = tokens;
  editor.exportedCode = '';
  editor.design.status = `${status} · 테그 ${editorKindTag(kind)}`;
}

function handleDesignAction(action, value) {
  const editor = app.editor;
  const design = editor.design;
  if (!getEditorKind(editor, design.kindId)) design.kindId = editor.kinds[0].id;
  const kind = getEditorKind(editor, design.kindId);

  if (action === 'openDesign') {
    if (getEditorKind(editor, value)) design.kindId = value;
    editor.designOpen = true;
    design.status = '';
  } else if (action === 'closeDesign') {
    editor.designOpen = false;
    const changed = editor.kinds.filter((item) => editorKindTag(item) !== item.type).map(editorKindTag);
    editor.status = changed.length ? `기본과 다른 디자인 테그: ${changed.join(', ')}` : '모든 블록이 기본 디자인입니다.';
  } else if (action === 'selectDesignType' && getEditorKind(editor, value)) {
    design.kindId = value;
    design.status = `테그 ${editorKindTag(getEditorKind(editor, value))} 디자인을 편집합니다.`;
  } else if (action === 'setDesignBrush' && ['color', 'transparent', 'empty', 'pick'].includes(value)) {
    design.brush = value;
    design.status = {
      color: '색 브러시: 보이는 픽셀 (히트박스 있음)',
      transparent: '투명 브러시: 안 보이지만 히트박스가 있는 픽셀',
      empty: '빈 칸 브러시: 히트박스가 없는 픽셀',
      pick: '스포이트: 그리드에서 색을 고르세요.',
    }[value];
  } else if (action === 'setDesignColor') {
    const token = normalizePixelToken(value);
    if (token && token !== EMPTY_PX && token !== TRANSPARENT_PX) {
      design.color = token;
      design.brush = 'color';
      design.status = `색 ${token}`;
    }
  } else if (action === 'pickDesignColor' && value) {
    if (value === EMPTY_PX || value === TRANSPARENT_PX) {
      design.brush = value === EMPTY_PX ? 'empty' : 'transparent';
      design.status = value === EMPTY_PX ? '빈 칸을 골랐습니다.' : '투명을 골랐습니다.';
    } else {
      design.color = value;
      design.brush = 'color';
      design.status = `색 ${value}을(를) 골랐습니다.`;
    }
  } else if (action === 'commitDesignPixels' && Array.isArray(value) && value.length === 64) {
    setEditorKindDesign(kind.id, value, `저장했습니다. 히트박스 ${designHitboxCount(value)}/64`);
  } else if (action === 'designFillAll') {
    const token = design.brush === 'transparent' ? TRANSPARENT_PX
      : design.brush === 'empty' ? EMPTY_PX
      : design.color;
    setEditorKindDesign(kind.id, Array(64).fill(token), '전체를 채웠습니다.');
  } else if (action === 'designClearAll') {
    setEditorKindDesign(kind.id, Array(64).fill(EMPTY_PX), '전체를 비웠습니다. (히트박스 없음)');
  } else if (action === 'designReset') {
    setEditorKindDesign(kind.id, [...DEFAULT_DESIGNS[kind.type]], '기본 디자인으로 되돌렸습니다.');
  } else if (action === 'toggleDesignHitbox') {
    design.showHitbox = !design.showHitbox;
    design.status = design.showHitbox ? '빨간 테두리 = 히트박스가 있는 픽셀' : '';
  } else if (action === 'newDesignVariant') {
    const variant = { id: `v${editor.nextKindId}`, type: kind.type, design: [...kind.design], base: false };
    editor.nextKindId += 1;
    editor.kinds.push(variant);
    design.kindId = variant.id;
    design.status = `${TYPE_LABELS[kind.type]}의 새 종류(★)를 만들었습니다. 픽셀을 바꾸면 테그가 새로 생깁니다.`;
  } else if (action === 'deleteDesignVariant' && !kind.base) {
    // 이 종류를 쓰던 블록은 기본 종류로 돌아감
    editor.blocks.forEach((block) => {
      if (block.kindId === kind.id) block.kindId = kind.type;
    });
    editor.codedTools.forEach((coded) => {
      if (coded.kindId === kind.id) coded.kindId = kind.type;
    });
    if (editor.tool === kind.id) editor.tool = kind.type;
    editor.kinds = editor.kinds.filter((item) => item.id !== kind.id);
    design.kindId = kind.type;
    editor.exportedCode = '';
    design.status = '종류를 지웠습니다. 쓰던 블록은 기본 디자인으로 바뀌었습니다.';
  } else if (action === 'applyDesignCode') {
    try {
      const text = String(value).trim();
      const match = text.match(/^design\(\s*([A-Za-z][A-Za-z0-9_]*)\s*,([\s\S]*)\)$/);
      const body = match ? match[2] : text;
      const tokens = parseDesignTokens(body);
      setEditorKindDesign(kind.id, tokens, '디자인 코드를 적용했습니다.');
    } catch (error) {
      design.status = error instanceof Error ? error.message : '코드를 적용하지 못했습니다.';
    }
  }

  rerenderPodEditor();
}

/* ---------- 블록 코드 편집기 ---------- */
function registerCodedTool(kindId, code) {
  const editor = app.editor;
  const existing = editor.codedTools.find((coded) => coded.kindId === kindId && coded.code === code);
  if (existing) return existing;
  const coded = { id: editor.nextCodedId, kindId, code };
  editor.nextCodedId += 1;
  editor.codedTools.push(coded);
  return coded;
}

function handleCodeAction(action, value) {
  const editor = app.editor;
  const selected = editor.blocks.find((block) => block.id === editor.selectedId);

  if (action === 'openBlockCode') {
    if (!selected || selected.type === 'start') {
      editor.status = '코드를 넣을 블록을 먼저 선택하세요. (start 제외)';
    } else {
      editor.codeEditor = { blockId: selected.id, draft: selected.code || '', error: '' };
    }
  } else if (action === 'cancelBlockCode') {
    editor.codeEditor = null;
  } else if (action === 'saveBlockCode' && editor.codeEditor) {
    const block = editor.blocks.find((item) => item.id === editor.codeEditor.blockId);
    const code = dedentCode(String(value));
    editor.codeEditor.draft = String(value);
    if (!block) {
      editor.codeEditor = null;
    } else {
      try {
        compileScript(code);
        block.code = code.trim() ? code : '';
        editor.codeEditor = null;
        editor.exportedCode = '';
        if (block.code) {
          registerCodedTool(block.kindId, block.code);
          editor.paletteCategory = 'coded';
          editor.status = `코드를 저장했습니다. 블록 선택 창의 {} ${editorBlockTag(editor, block)}로 같은 코드 블록을 더 놓을 수 있습니다.`;
        } else {
          editor.status = '빈 코드라 코드를 지웠습니다.';
        }
      } catch (error) {
        editor.codeEditor.error = error instanceof Error ? error.message : String(error);
      }
    }
  } else if (action === 'deleteBlockCode' && editor.codeEditor) {
    const block = editor.blocks.find((item) => item.id === editor.codeEditor.blockId);
    if (block) block.code = '';
    editor.codeEditor = null;
    editor.exportedCode = '';
    editor.status = '블록 코드를 지웠습니다.';
  } else if (action === 'removeCodedTool') {
    const id = Number(value);
    editor.codedTools = editor.codedTools.filter((coded) => coded.id !== id);
    if (editor.tool === `coded:${id}`) editor.tool = 'start';
    editor.status = '코드 블록을 선택 창에서 뺐습니다. (이미 놓은 블록의 코드는 그대로입니다)';
  }

  rerenderPodEditor();
}

function handleScreenAction(action, value) {
  unlockAudio();
  playSfx('click');

  if (action === 'openPod') {
    app.screen = SCREENS.POD;
    app.editor.exitConfirm = false;
    rerenderPodEditor({ keepScroll: false });
  }

  if (action === 'openLoad') {
    app.screen = SCREENS.LOAD;
    screenManager.showLoad({ draft: app.loadDraft, error: app.loadError, ready: app.loadedMapSpec });
  }

  if (action === 'requestPodExit') {
    app.editor.exitConfirm = true;
    rerenderPodEditor();
  }

  if (action === 'cancelPodExit') {
    app.editor.exitConfirm = false;
    rerenderPodEditor();
  }

  if (action === 'confirmPodExit') {
    app.editor.exitConfirm = false;
    app.screen = SCREENS.START;
    screenManager.showStart();
    void playMenuMusic();
  }

  if (action === 'togglePaletteCategory' && EDITOR_CATEGORIES.some((category) => category.id === value)) {
    app.editor.paletteCategory = app.editor.paletteCategory === value ? null : value;
    rerenderPodEditor();
  }

  if (action === 'toggleMoveMode') {
    app.editor.moveMode = !app.editor.moveMode;
    app.editor.status = app.editor.moveMode
      ? 'MOVE ON: 그리드를 드래그해서 화면을 옮기세요. 오른쪽 끝이나 위쪽 끝까지 옮기면 맵이 넓어집니다.'
      : 'MOVE OFF: 화면이 고정됩니다. 클릭으로 한 칸, 드래그로 직사각형을 채웁니다.';
    rerenderPodEditor();
  }

  if (action === 'expandEditor' && (value === 'right' || value === 'up')) {
    if (value === 'right') {
      app.editor.cols += 40;
      app.editor.status = '맵을 오른쪽으로 40칸 넓혔습니다.';
      rerenderPodEditor();
    } else {
      const addedRows = 10;
      app.editor.rows += addedRows;
      app.editor.status = '맵을 위쪽으로 10칸 넓혔습니다.';
      rerenderPodEditor({ scrollShiftY: addedRows * EDITOR_CELL });
    }
  }

  if (action === 'setEditorMode' && MODE_BY_CODE[value]) {
    app.editor.startMode = value;
    app.editor.exportedCode = '';
    app.editor.status = `${value} 모드로 시작합니다.`;
    rerenderPodEditor();
  }

  if (action === 'selectEditorTool' && (value === 'erase' || editorToolSpec(value))) {
    app.editor.tool = value;
    app.editor.status = value === 'erase'
      ? '지울 블록을 누르거나, 드래그해서 영역을 지우세요.'
      : value === 'start'
      ? 'START 블록을 놓을 칸을 클릭하세요.'
      : (() => {
        const spec = editorToolSpec(value);
        const tag = editorKindTag(getEditorKind(app.editor, spec.kindId));
        return `테그 ${tag}${spec.code ? ' (코드 포함)' : ''} 블록을 놓을 칸을 클릭하거나 드래그하세요.`;
      })();
    rerenderPodEditor();
  }

  if (action === 'placeEditorBlock' && value) {
    placeEditorBlock(value);
  }

  if (action === 'fillEditorRect' && value) {
    fillEditorRect(value);
  }

  if (action === 'rotateEditor' && value) {
    rotateEditor(Number(value));
  }

  if (action === 'setEditorRotation') {
    setEditorRotation(value);
  }

  if (action === 'toggleFineMove') {
    app.editor.fineMove = !app.editor.fineMove;
    app.editor.status = app.editor.fineMove
      ? '미세 이동이 켜졌습니다. 방향 버튼으로 0.1씩 이동합니다.'
      : '일반 이동이 켜졌습니다. 방향 버튼으로 1씩 이동합니다.';
    rerenderPodEditor();
  }

  if (action === 'nudgeSelected' && value) {
    nudgeSelectedBlock(value);
  }

  if (action === 'deleteSelected') {
    app.editor.blocks = app.editor.blocks.filter((block) => block.id !== app.editor.selectedId);
    app.editor.selectedId = null;
    app.editor.exportedCode = '';
    app.editor.status = '선택한 블록을 삭제했습니다.';
    rerenderPodEditor();
  }

  if (action === 'setClearX') {
    const clearX = Math.round(Number(value) * 10) / 10;
    if (value !== '' && Number.isFinite(clearX) && clearX >= 0) {
      app.editor.clearX = clearX;
      if (clearX >= app.editor.cols - 3) app.editor.cols = Math.ceil(clearX) + 40;
      app.editor.exportedCode = '';
      app.editor.status = `클리어 위치를 X ${formatMapNumber(clearX)}로 정했습니다.`;
    } else {
      app.editor.status = '클리어 위치에는 0 이상의 좌표를 입력해 주세요.';
    }
    rerenderPodEditor();
  }

  if (action === 'exportMapCode') {
    app.editor.exportedCode = buildMapCode(app.editor);
    app.editor.status = '맵 코드를 만들었습니다.';
    rerenderPodEditor();
  }

  if (action === 'copyMapCode' && app.editor.exportedCode) {
    const code = app.editor.exportedCode;
    const fallback = () => {
      app.editor.status = '코드가 선택되었습니다. 직접 복사해 주세요.';
      rerenderPodEditor();
      document.getElementById('map-code-output')?.select();
    };
    const copyPromise = navigator.clipboard?.writeText(code);
    if (!copyPromise) {
      fallback();
    } else {
      copyPromise.then(() => {
        app.editor.status = '맵 코드를 복사했습니다.';
        rerenderPodEditor();
      }).catch(fallback);
    }
  }

  if (action.startsWith('design') || ['openDesign', 'closeDesign', 'selectDesignType', 'setDesignBrush',
    'setDesignColor', 'pickDesignColor', 'commitDesignPixels', 'toggleDesignHitbox', 'applyDesignCode',
    'newDesignVariant', 'deleteDesignVariant'].includes(action)) {
    handleDesignAction(action, value);
  }

  if (['openBlockCode', 'saveBlockCode', 'cancelBlockCode', 'deleteBlockCode', 'removeCodedTool'].includes(action)) {
    handleCodeAction(action, value);
  }

  if (action === 'loadMapCode') {
    app.loadDraft = value || '';
    try {
      app.loadedMapSpec = parseMapCode(app.loadDraft);
      app.loadError = '';
      screenManager.showLoad({ draft: app.loadDraft, ready: app.loadedMapSpec });
    } catch (error) {
      app.loadedMapSpec = null;
      app.loadError = error instanceof Error ? error.message : '맵 코드를 불러오지 못했습니다.';
      screenManager.showLoad({ draft: app.loadDraft, error: app.loadError });
    }
  }

  if ((action === 'playLoadedMap' || action === 'practiceLoadedMap') && app.loadedMapSpec) {
    app.practiceMode = action === 'practiceLoadedMap';
    resetCustomMap();
  }

  if (action === 'openCharacterSelect') {
    app.screen = SCREENS.CHARACTER;
    screenManager.showCharacterSelect({ selectedCharacter: app.selectedCharacter });
    void playMenuMusic();
  }

  if (action === 'backToMenu') {
    if (app.practice) app.practice.active = false;
    app.screen = SCREENS.START;
    stopStageMusic();
    screenManager.showStart();
    void playMenuMusic();
  }

  if (action === 'selectCharacter' && MODE_BY_ID[value]) {
    app.selectedCharacter = value;
    app.currentStage = 1;
    screenManager.showCharacterSelect({ selectedCharacter: app.selectedCharacter });
  }

  if (action === 'beginRun' || action === 'startGame' || action === 'beginPractice') {
    app.practiceMode = action === 'beginPractice';
    app.currentStage = 1;
    resetStage(1);
  }

  // 같은 스테이지를 연습 모드 / 일반 모드로 다시
  if (action === 'practiceStage' || action === 'playNormal') {
    app.practiceMode = action === 'practiceStage';
    if (app.isCustomRun) resetCustomMap();
    else resetStage(app.currentStage);
  }

  if (action === 'retryStage') {
    if (app.isCustomRun) {
      resetCustomMap();
    } else {
      resetStage(app.currentStage);
    }
  }

  if (action === 'nextStage') {
    resetStage(app.currentStage + 1);
  }
}

const screenManager =
  createScreenManager({
        root: screenRoot,
        hud,
        progressFill,
        progressLabel,
        stageIndicator,
        characterIndicator,
        onAction: handleScreenAction,
        renderCharacterPreview,
      });

function init() {
  if (!canvas || !ctx || !screenManager) return;
  setupAudio();
  resizeCanvas();
  app.world = getStageMap(app.selectedCharacter, app.currentStage);
  app.player = createPlayer(app.selectedCharacter);
  screenManager.showStart();
  void playMenuMusic();
  requestAnimationFrame(animate);
}

// 초기화
  practiceBar?.querySelectorAll('[data-practice]').forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.dataset.practice;
      if (action === 'add') addManualCheckpoint();
      else if (action === 'remove') removeLastCheckpoint();
      else if (action === 'exit') handleScreenAction('backToMenu');
      button.blur(); // Space가 버튼을 누르지 않도록
    });
  });
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('keydown', (event) => {
    // 연습 모드 단축키: Z = 체크포인트 추가, X = 마지막 체크포인트 삭제
    if (practiceActive() && !event.repeat && (event.code === 'KeyZ' || event.code === 'KeyX')) {
      if (event.code === 'KeyZ') addManualCheckpoint();
      else removeLastCheckpoint();
      event.preventDefault();
      return;
    }
    if (event.code === 'Space') {
      if (app.screen !== SCREENS.PLAY) return; // 에디터 입력창 등에서는 Space 정상 동작
      if (!event.repeat) {
        onPressStart(event);
      }
      event.preventDefault();
    }
  });
  window.addEventListener('keyup', (event) => {
    if (event.code === 'Space') {
      onPressEnd(event);
    }
  });
  window.addEventListener('pointerdown', onPressStart, { passive: false });
  window.addEventListener('pointerup', onPressEnd, { passive: false });
  window.addEventListener('pointercancel', onPressEnd, { passive: false });
  window.addEventListener('blur', () => {
    app.input.pressed = false;
  });
  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
