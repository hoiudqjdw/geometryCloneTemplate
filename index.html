<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geometry Dash Clone</title>
  <style>
:root {
  --bg: #080b16;
  --panel: rgba(10, 15, 30, 0.88);
  --panel-strong: rgba(15, 22, 44, 0.95);
  --line: #9ef0ff;
  --accent: #53d1ff;
  --accent-2: #ffda67;
  --danger: #ff6b8a;
  --success: #89ff90;
  --text: #eff8ff;
  --shadow: #10233f;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(circle at top, #1b2042, var(--bg) 60%);
  color: var(--text);
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
}

body {
  touch-action: none;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

#hud {
  position: absolute;
  inset: 0 auto auto 0;
  width: min(100%, 1000px);
  padding: 14px 16px 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  pointer-events: none;
}

#hud.hidden {
  display: none;
}

.hud-topline {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  font-size: clamp(0.78rem, 2vw, 1rem);
  letter-spacing: 0.14em;
  text-shadow: 2px 2px 0 var(--shadow);
}

.progress-shell {
  position: relative;
  height: 24px;
  border: 3px solid var(--line);
  background: rgba(6, 11, 22, 0.9);
  box-shadow: 0 0 0 3px rgba(17, 37, 70, 0.85);
  overflow: hidden;
}

#progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #57ffa5, #53d1ff 70%, #fef27a);
  image-rendering: pixelated;
}

#progress-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-shadow: 2px 2px 0 #00121e;
}

/* 연습 모드 */
#hud.practice .progress-shell {
  border-color: #57e0c8;
}

#hud.practice #progress-fill {
  background: linear-gradient(90deg, #57e0c8, #89ff90);
}

#practice-bar {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100% - 24px);
  padding: 8px 10px;
  border: 3px solid #57e0c8;
  background: rgba(6, 20, 26, 0.88);
  box-shadow: 0 0 0 3px rgba(8, 40, 44, 0.85);
  touch-action: manipulation;
}

#practice-bar.hidden {
  display: none;
}

.practice-label {
  color: #57e0c8;
  font-weight: 900;
  letter-spacing: 0.12em;
  font-size: 0.85rem;
}

.practice-count {
  color: #b5d8ff;
  font-size: 0.8rem;
  white-space: nowrap;
}

.practice-button {
  border: 2px solid #57e0c8;
  background: rgba(12, 52, 52, 0.95);
  color: var(--text);
  font: 700 0.9rem "Courier New", monospace;
  padding: 10px 14px;
  cursor: pointer;
  white-space: nowrap;
}

.practice-button.add {
  border-color: #89ff90;
  color: #89ff90;
}

.practice-button.remove {
  border-color: #ff9bad;
  color: #ff9bad;
}

.practice-button.exit {
  border-color: #50769c;
  color: #b5d8ff;
}

.practice-button:hover,
.practice-button:focus-visible {
  outline: none;
  filter: brightness(1.25);
}

.practice-button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.practice-button kbd {
  margin-left: 4px;
  padding: 0 4px;
  border: 1px solid currentColor;
  font: inherit;
  font-size: 0.72rem;
  opacity: 0.8;
}

.pixel-button.practice {
  background: linear-gradient(180deg, rgba(20, 110, 100, 0.98), rgba(10, 58, 56, 0.98));
  border-color: #57e0c8;
}

@media (max-width: 640px) {
  #practice-bar {
    left: 8px;
    right: 8px;
    transform: none;
    max-width: none;
    flex-wrap: wrap;
    justify-content: center;
    bottom: 8px;
    gap: 6px;
  }

  .practice-label {
    display: none;
  }

  .practice-count {
    order: 5;
    width: 100%;
    text-align: center;
  }

  .practice-button {
    padding: 10px;
  }

  .practice-button kbd {
    display: none;
  }
}

#screen-root {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
}

.screen {
  width: min(92vw, 680px);
  border: 4px solid var(--line);
  background: linear-gradient(180deg, rgba(14, 21, 44, 0.92), rgba(7, 11, 24, 0.94));
  box-shadow: 0 0 0 6px rgba(11, 25, 44, 0.85), 0 22px 48px rgba(0, 0, 0, 0.4);
  padding: clamp(18px, 4vw, 34px);
  text-align: center;
}

.screen h1,
.screen h2 {
  margin: 0 0 14px;
  letter-spacing: 0.12em;
  text-shadow: 3px 3px 0 #172b55;
}

.screen h1 {
  font-size: clamp(1.8rem, 5vw, 3rem);
}

.screen h2 {
  font-size: clamp(1.4rem, 4vw, 2.2rem);
}

.screen p {
  margin: 10px auto;
  max-width: 44ch;
  line-height: 1.5;
}

.button-row,
.card-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 18px;
}

.pixel-button,
.character-card {
  border: 3px solid var(--line);
  background: linear-gradient(180deg, rgba(27, 55, 99, 0.95), rgba(16, 32, 62, 0.95));
  color: var(--text);
  box-shadow: 0 0 0 3px #10233f;
}

.pixel-button {
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 12px 18px;
  min-width: 148px;
}

.pixel-button:hover,
.pixel-button:focus-visible,
.character-card:hover,
.character-card:focus-visible {
  outline: none;
  transform: translateY(-2px);
  border-color: var(--accent-2);
}

.pixel-button.alt {
  background: linear-gradient(180deg, rgba(90, 46, 105, 0.95), rgba(47, 26, 62, 0.95));
}

.pixel-button.danger {
  background: linear-gradient(180deg, rgba(126, 43, 76, 0.95), rgba(72, 22, 41, 0.95));
}

.pixel-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  transform: none;
}

.pixel-button.pod {
  background: linear-gradient(180deg, rgba(27, 119, 116, 0.98), rgba(12, 61, 73, 0.98));
}

.editor-screen {
  width: min(96vw, 1180px);
  height: min(94vh, 820px);
  padding: 16px;
  text-align: left;
  display: grid;
  grid-template-rows: auto auto minmax(230px, 1fr) auto;
  gap: 12px;
  overflow: hidden;
  position: relative;
}

.editor-screen h2 {
  margin: 0;
  text-align: center;
}

.editor-toolbar {
  display: grid;
  gap: 10px;
}

.editor-toolbar-row,
.editor-actions,
.editor-nudge,
.rotate-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.rotate-row {
  gap: 6px;
}

.editor-label {
  color: #b5d8ff;
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  min-width: 76px;
}

.tool-button,
.mode-button,
.nudge-button {
  border: 2px solid #50769c;
  background: rgba(11, 27, 49, 0.94);
  color: var(--text);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  padding: 8px 10px;
  cursor: pointer;
}

.tool-button:hover,
.tool-button:focus-visible,
.mode-button:hover,
.mode-button:focus-visible,
.nudge-button:hover,
.nudge-button:focus-visible,
.tool-button.active,
.mode-button.active {
  outline: none;
  border-color: var(--accent-2);
  color: var(--accent-2);
}

.tool-button.active,
.mode-button.active {
  background: rgba(76, 54, 9, 0.92);
}

.tool-button:disabled,
.nudge-button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.mode-button.move-toggle.active {
  background: rgba(16, 84, 52, 0.95);
  border-color: var(--success);
  color: var(--success);
}

.editor-workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
  gap: 12px;
}

/* 스크롤 대신 MOVE 모드에서만 드래그로 화면 이동 */
.editor-grid-scroll {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  border: 3px solid #375f85;
  background: #090f21;
  user-select: none;
}

.editor-grid-scroll.move-mode {
  border-color: var(--success);
}

.editor-grid-scroll.move-mode .grid-cell {
  cursor: grab;
}

.editor-grid-scroll.move-mode.panning .grid-cell {
  cursor: grabbing;
}

.editor-grid {
  display: grid;
  width: max-content;
  min-height: 100%;
  align-content: end;
  background-image:
    linear-gradient(rgba(83, 209, 255, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(83, 209, 255, 0.08) 1px, transparent 1px);
  background-size: 40px 40px;
}

.grid-cell {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-right: 1px solid rgba(83, 209, 255, 0.16);
  border-bottom: 1px solid rgba(83, 209, 255, 0.16);
  background: transparent;
  color: var(--text);
  cursor: crosshair;
  font: inherit;
  font-weight: 900;
  overflow: visible;
}

.grid-cell:hover,
.grid-cell:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: -2px;
  background: rgba(83, 209, 255, 0.12);
}

.grid-cell.clear-column {
  border-right: 3px solid var(--accent-2);
}

.grid-cell.selected {
  background: rgba(255, 218, 103, 0.22);
  outline: 2px solid var(--accent-2);
  outline-offset: -3px;
}

.grid-cell.drag-preview {
  background: rgba(137, 255, 144, 0.26);
  outline: 2px dashed var(--success);
  outline-offset: -3px;
}

.grid-cell.drag-preview.drag-erase {
  background: rgba(255, 107, 138, 0.3);
  outline-color: var(--danger);
}

.grid-cell small {
  position: absolute;
  left: 2px;
  bottom: 1px;
  color: rgba(239, 248, 255, 0.5);
  font-size: 0.55rem;
  font-weight: 400;
  z-index: 3;
  pointer-events: none;
}

/* 8×8 픽셀 스프라이트 */
.sprite {
  background-repeat: no-repeat;
  background-size: 100% 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* 에디터 블록 그림 (회전 지원) */
.editor-object {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 40px;
  height: 40px;
  z-index: 2;
  pointer-events: none;
  transform-origin: 50% 50%;
  filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.35));
}

/* 블록 카테고리 탭 */
.palette-divider {
  width: 2px;
  align-self: stretch;
  background: #274767;
  margin: 0 2px;
}

.category-tab {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 2px solid #3d6a94;
  background: rgba(16, 36, 64, 0.95);
  color: var(--text);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  padding: 8px 10px;
  cursor: pointer;
}

.category-tab small {
  color: #b5d8ff;
  font-size: 0.7rem;
  font-weight: 400;
}

.category-tab .caret {
  color: #b5d8ff;
  font-size: 0.7rem;
}

.category-tab:hover,
.category-tab:focus-visible {
  outline: none;
  border-color: var(--accent-2);
}

.category-tab.has-active {
  border-color: #8a7330;
}

.category-tab.open {
  border-color: var(--accent);
  background: rgba(30, 72, 112, 0.98);
  box-shadow: 0 4px 0 -1px var(--accent);
}

.palette-items {
  padding: 8px;
  border: 2px solid var(--accent);
  background: rgba(10, 26, 48, 0.92);
}

.palette-empty {
  margin: 0;
  color: #b5d8ff;
  font-size: 0.82rem;
}

/* 게임에서는 안 보이는 블록 (S블록): 에디터에서 반투명 + 점선 */
.editor-object.editor-invisible {
  opacity: 0.55;
  outline: 2px dashed rgba(200, 210, 230, 0.7);
  outline-offset: -2px;
  filter: none;
}

.tool-sprite {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 4px;
  vertical-align: -3px;
}

/* 픽셀 디자인 편집기 */
.design-overlay {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: grid;
  place-items: center;
  padding: 10px;
  background: rgba(1, 4, 12, 0.84);
}

.design-panel {
  --px-size: 40px;
  width: min(100%, 920px);
  max-height: 100%;
  overflow: auto;
  border: 3px solid var(--accent);
  background: #0b1429;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  padding: 14px;
  display: grid;
  gap: 12px;
}

.design-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.design-head h3 {
  margin: 0;
  color: var(--accent-2);
  letter-spacing: 0.1em;
}

.design-types,
.design-brushes,
.design-swatches,
.design-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.design-body {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.design-grid {
  display: grid;
  grid-template-columns: repeat(8, var(--px-size));
  grid-template-rows: repeat(8, var(--px-size));
  width: max-content;
  border: 3px solid #50769c;
  background: #050a16;
  touch-action: none;
  user-select: none;
}

.design-px {
  --px: transparent;
  width: var(--px-size);
  height: var(--px-size);
  padding: 0;
  border: 0;
  outline: 1px solid rgba(255, 255, 255, 0.08);
  outline-offset: -1px;
  background: var(--px);
  cursor: crosshair;
  position: relative;
}

.design-px.px-empty {
  background: #050a16;
}

.design-px.px-empty::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 3px;
  height: 3px;
  margin: -1.5px;
  background: rgba(255, 255, 255, 0.14);
}

.design-px.px-transparent,
.design-px.px-alpha {
  background:
    linear-gradient(var(--px), var(--px)),
    repeating-conic-gradient(#3c4b68 0 25%, #1c2640 0 50%) 0 0 / 10px 10px;
}

.design-px.px-transparent {
  box-shadow: inset 0 0 0 2px rgba(158, 240, 255, 0.55);
}

.design-grid.show-hitbox .design-px:not(.px-empty) {
  box-shadow: inset 0 0 0 3px rgba(255, 80, 110, 0.95);
}

.design-side {
  display: grid;
  gap: 10px;
  min-width: 0;
}

.design-side h4 {
  margin: 2px 0 0;
  color: #b5d8ff;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
}

.design-side p {
  margin: 0;
  font-size: 0.82rem;
  line-height: 1.45;
  color: #b5d8ff;
}

.design-color {
  width: 44px;
  height: 36px;
  padding: 0;
  border: 2px solid #50769c;
  background: #071126;
  cursor: pointer;
}

.swatch {
  width: 26px;
  height: 26px;
  padding: 0;
  border: 2px solid #274767;
  background: var(--sw);
  cursor: pointer;
}

.swatch.active,
.swatch:hover,
.swatch:focus-visible {
  outline: none;
  border-color: var(--accent-2);
}

.design-preview {
  display: flex;
  align-items: end;
  gap: 12px;
}

.design-preview .sprite {
  background-color: #10172b;
  border: 2px solid #274767;
}

.design-code {
  width: 100%;
  min-height: 96px;
  resize: vertical;
  border: 2px solid #50769c;
  background: #040914;
  color: #89ff90;
  font: 0.78rem/1.4 "Courier New", monospace;
  padding: 8px;
  word-break: break-all;
}

/* 블록 테그 · 코드 */
.tag-chip {
  display: inline-block;
  margin-left: 5px;
  padding: 1px 5px;
  border: 1px solid #50769c;
  background: #071126;
  color: #89ff90;
  font: 700 0.68rem/1.4 "Courier New", monospace;
  letter-spacing: 0;
  vertical-align: 1px;
  user-select: all;
}

.tag-chip.big {
  font-size: 0.9rem;
  padding: 2px 8px;
}

.tag-line {
  margin: 0;
  color: #b5d8ff;
  font-size: 0.85rem;
}

.code-badge {
  position: absolute;
  right: 1px;
  top: 1px;
  z-index: 3;
  padding: 0 2px;
  background: #ffda67;
  color: #2a1d00;
  font: 900 0.55rem/1.2 "Courier New", monospace;
  pointer-events: none;
}

.code-mark {
  color: var(--accent-2);
  margin-right: 3px;
}

.coded-tool {
  display: inline-flex;
}

.coded-tool .tool-button {
  border-color: #8a7330;
}

.coded-remove {
  border: 2px solid #8a7330;
  border-left: 0;
  background: rgba(60, 40, 8, 0.94);
  color: #ffda67;
  font: 900 0.9rem/1 "Courier New", monospace;
  padding: 0 7px;
  cursor: pointer;
}

.code-button:not(:disabled) {
  border-color: #8a7330;
  color: var(--accent-2);
}

.code-panel {
  width: min(100%, 1040px);
}

.code-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 14px;
  min-height: 0;
}

.code-main {
  display: grid;
  gap: 8px;
  align-content: start;
}

.code-input {
  width: 100%;
  min-height: 380px;
  resize: vertical;
  border: 3px solid #50769c;
  background: #040914;
  color: #89ff90;
  font: 0.95rem/1.55 "Courier New", monospace;
  padding: 12px;
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}

.code-help {
  display: grid;
  gap: 4px;
  align-content: start;
  max-height: 470px;
  overflow-y: auto;
  padding-right: 4px;
}

.code-help h4 {
  margin: 0 0 4px;
  color: #b5d8ff;
  font-size: 0.85rem;
}

.code-help-item {
  display: grid;
  gap: 1px;
  text-align: left;
  border: 1px solid #274767;
  background: rgba(11, 27, 49, 0.94);
  color: var(--text);
  padding: 5px 8px;
  cursor: pointer;
  font: inherit;
}

.code-help-item:hover,
.code-help-item:focus-visible {
  outline: none;
  border-color: var(--accent-2);
}

.code-help-item code {
  color: #89ff90;
  font-size: 0.82rem;
  font-weight: 700;
}

.code-help-item span {
  color: #b5d8ff;
  font-size: 0.74rem;
}

@media (max-width: 860px) {
  .code-body {
    grid-template-columns: 1fr;
  }

  .code-input {
    min-height: 240px;
  }

  .code-help {
    max-height: 240px;
  }
}

@media (max-width: 720px) {
  .design-panel {
    --px-size: min(40px, 10.5vw);
    padding: 10px;
  }

  .design-body {
    grid-template-columns: 1fr;
  }

  .design-grid {
    justify-self: center;
  }
}

.editor-close {
  position: absolute;
  right: 10px;
  top: 8px;
  width: 38px;
  height: 38px;
  border: 2px solid #ff9bad;
  background: rgba(87, 20, 43, 0.95);
  color: white;
  font: 900 1.25rem/1 "Courier New", monospace;
  cursor: pointer;
  z-index: 3;
}

.confirm-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(1, 4, 12, 0.76);
}

.confirm-dialog {
  width: min(92%, 430px);
  border: 3px solid var(--accent-2);
  background: #0b1429;
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  padding: 22px;
  text-align: center;
}

.confirm-dialog h3 { margin: 0 0 10px; }

.load-screen {
  width: min(92vw, 760px);

    <header id="hud" class="hidden" aria-live="polite">

      <button type="button" class="practice-button remove" data-practice="remove" title="마지막 체크포인트 삭제 (X)">✕ 삭제 <kbd>X</kbd></button>
      <span class="practice-count" data-practice-count>체크포인트 0 · 시도 0</span>

    </div>

    <div id="screen-root"></div>

  <script>
/* =========================================================
   mapGen.js  –  맵 생성 알고리즘 + 도형(충돌) 유틸
   ========================================================= */
const TILE = 40;
const STAGE_LENGTH = 8000;
const WORLD_HEIGHT = 540;
const GROUND_Y = 430;
const CEILING_Y = 150; // 볼 · 스파이더 기본 맵의 천장
const DASH_ANGLE_LIMIT = 80; // 화살표 공점 각도 범위 -80° ~ 80°

// 블록 회전 규칙: 화살표 공점은 -80° ~ 80° 안으로
function fixBlockRotation(type, angle) {
  const value = normalizeAngle(angle || 0);
  if (type !== 'dashOrb') return value;
  const signed = value > 180 ? value - 360 : value;
  return normalizeAngle(Math.max(-DASH_ANGLE_LIMIT, Math.min(DASH_ANGLE_LIMIT, signed)));
}

/*
  게임 모드 (캐릭터)
    id     : 내부 이름
    code   : 맵 코드 이름 → startMode(Code), 포털 블록 mode{Code}, 스프라이트 start{Code}
    stage  : 기본 스테이지 맵 종류 (cube = 바닥 장애물, ship = 터널, gravity = 바닥+천장 통로)
*/
const MODES = [
  { id: 'cube', code: 'Cube', label: 'CUBE', stage: 'cube', desc: '클릭하면 점프' },
  { id: 'ship', code: 'Airplane', label: 'SHIP', stage: 'ship', desc: '누르고 있으면 상승' },
  { id: 'ball', code: 'Ball', label: 'BALL', stage: 'gravity', desc: '클릭하면 중력 반전' },
  { id: 'ufo', code: 'Ufo', label: 'UFO', stage: 'cube', desc: '클릭마다 공중 도약' },
  { id: 'wave', code: 'Wave', label: 'WAVE', stage: 'ship', desc: '누르면 ↗ 떼면 ↘' },
  { id: 'robot', code: 'Robot', label: 'ROBOT', stage: 'cube', desc: '오래 누를수록 높이 점프' },
  { id: 'spider', code: 'Spider', label: 'SPIDER', stage: 'gravity', desc: '클릭하면 반대 면으로 순간 이동' },
  { id: 'swing', code: 'Swing', label: 'SWING', stage: 'ship', desc: '누르면 위로, 떼면 아래로 중력' },
];
const MODE_BY_ID = Object.fromEntries(MODES.map((mode) => [mode.id, mode]));
const MODE_BY_CODE = Object.fromEntries(MODES.map((mode) => [mode.code, mode]));
const PORTAL_TYPES = MODES.map((mode) => `mode${mode.code}`);
const FLYING_MODES = new Set(['ship', 'wave', 'swing']);
const GRAVITY_MODES = new Set(['ball', 'spider', 'swing']);
const characterSpriteKey = (character) => `start${(MODE_BY_ID[character] || MODES[0]).code}`;

// blockSpecial(type, x, y, angle) 로 회전할 수 있는 블록
// blockSpecial / rot() 로 회전할 수 있는 블록 (start 제외 전부, 히트박스도 같이 회전)
const ROTATABLE_TYPES = new Set(['dieBlock', 'square', 'slope', 'thorn', 'jumpUp', 'nextJump', 'greenOrb', 'blackOrb', 'dashOrb', 'sBlock', 'halfSpeed', 'doubleSpeed', ...PORTAL_TYPES]);
// 이 기울기(|dy/dx|)보다 가파른 면은 밟지 못하고 벽 취급
const MAX_WALKABLE_GRAD = 1.25;

const CUBE_PATTERNS = [
  'singleSpike',
  'doubleSpike',
  'tripleSpike',
  'shortBlock',
  'blockSpike',
  'tallBlockPad',
  'boostLane',
  'slowLane',
  'doubleBlock',
];

const SHIP_PAD_TYPES = ['boost', 'slow'];

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function hashString(value) {
  let hash = 2166136261;
  for (let i = 0; i < value.length; i += 1) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

class SeededRandom {
  constructor(seed) {
    this.seed = seed >>> 0;
  }

  next() {
    this.seed = (1664525 * this.seed + 1013904223) >>> 0;
    return this.seed / 4294967296;
  }

  float(min = 0, max = 1) {
    return min + (max - min) * this.next();
  }

  int(min, max) {
    return Math.floor(this.float(min, max + 1));
  }

  chance(probability) {
    return this.next() < probability;
  }

  pick(items) {
    return items[this.int(0, items.length - 1)];
  }
}

/* ---------- 도형 유틸 ---------- */
function normalizeAngle(value) {
  const rounded = Math.round(Number(value) * 10) / 10;
  const wrapped = Math.round((((rounded % 360) + 360) % 360) * 10) / 10;
  return wrapped >= 360 ? 0 : wrapped;
}

function rectPoints(x, y, w, h) {
  return [
    { x, y },
    { x: x + w, y },
    { x: x + w, y: y + h },
    { x, y: y + h },
  ];
}

// 화면 기준 시계 방향 회전 (캔버스 / CSS rotate 와 같은 방향)
function rotatePoints(points, cx, cy, deg) {
  if (!deg) return points.map((point) => ({ ...point }));
  const rad = (deg * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const round = (value) => Math.round(value * 1000) / 1000;
  return points.map(({ x, y }) => {
    const dx = x - cx;
    const dy = y - cy;
    return { x: round(cx + dx * cos - dy * sin), y: round(cy + dx * sin + dy * cos) };
  });
}

function scalePoints(points, factor) {
  const cx = points.reduce((sum, p) => sum + p.x, 0) / points.length;
  const cy = points.reduce((sum, p) => sum + p.y, 0) / points.length;
  return points.map(({ x, y }) => ({ x: cx + (x - cx) * factor, y: cy + (y - cy) * factor }));
}

function polygonBounds(points) {
  const xs = points.map((p) => p.x);
  const ys = points.map((p) => p.y);
  const minX = Math.min(...xs);
  const minY = Math.min(...ys);
  return { x: minX, y: minY, w: Math.max(...xs) - minX, h: Math.max(...ys) - minY };
}

function polyShape(type, points, extra = {}) {
  return { type, points, ...polygonBounds(points), ...extra };
}

function projectPolygon(points, ax, ay) {
  let min = Infinity;
  let max = -Infinity;
  for (const p of points) {
    const value = p.x * ax + p.y * ay;
    if (value < min) min = value;
    if (value > max) max = value;
  }
  return { min, max };
}

// 볼록 다각형 SAT 충돌 판정
function polygonsOverlap(a, b) {
  for (const poly of [a, b]) {
    for (let i = 0; i < poly.length; i += 1) {
      const p1 = poly[i];
      const p2 = poly[(i + 1) % poly.length];
      const ax = -(p2.y - p1.y);
      const ay = p2.x - p1.x;
      if (ax === 0 && ay === 0) continue;
      const pa = projectPolygon(a, ax, ay);
      const pb = projectPolygon(b, ax, ay);
      if (pa.max <= pb.min || pb.max <= pa.min) return false;
    }
  }
  return true;
}

// x 위치에서 다각형 윗면(top) 또는 아랫면(bottom)의 높이와 기울기
function polyEdgeAt(points, x, which) {
  let best = null;
  for (let i = 0; i < points.length; i += 1) {
    const a = points[i];
    const b = points[(i + 1) % points.length];
    if (a.x === b.x) continue;
    if (x < Math.min(a.x, b.x) || x > Math.max(a.x, b.x)) continue;
    const t = (x - a.x) / (b.x - a.x);
    const y = a.y + t * (b.y - a.y);
    const grad = (b.y - a.y) / (b.x - a.x);
    if (!best || (which === 'top' ? y < best.y : y > best.y)) best = { y, grad };
  }
  return best;
}

// 캐릭터 발판 구간 [x1, x2] 아래(위)의 가장 높은(낮은) 면
function surfaceUnder(points, x1, x2, which = 'top') {
  const better = which === 'top' ? (a, b) => a < b : (a, b) => a > b;
  let best = null;
  for (const sx of [x1, (x1 + x2) / 2, x2]) {
    const hit = polyEdgeAt(points, sx, which);
    if (hit && (!best || better(hit.y, best.y))) best = hit;
  }
  for (const p of points) {
    if (p.x > x1 && p.x < x2 && (!best || better(p.y, best.y))) best = { y: p.y, grad: 0 };
  }
  return best;
}

/* ---------- 테마 / 배경 ---------- */
function buildStageTheme(stageNumber, character) {
  const themes = [
    {
      skyTop: '#1d2047',
      skyBottom: '#090c1c',
      glow: '#53d1ff',
      glow2: '#f3ff72',
      ground: '#183352',
      ground2: '#0e213a',
    },
    {
      skyTop: '#26144c',
      skyBottom: '#090616',
      glow: '#ff78cb',
      glow2: '#53d1ff',
      ground: '#3a2059',
      ground2: '#1d1236',
    },
    {
      skyTop: '#0f314d',
      skyBottom: '#051017',
      glow: '#53ffbf',
      glow2: '#8dd6ff',
      ground: '#15575c',
      ground2: '#0a2f34',
    },
    {
      skyTop: '#3c1b2d',
      skyBottom: '#0e0813',
      glow: '#ffb347',
      glow2: '#ff6b8a',
      ground: '#55322d',
      ground2: '#2b1716',
    },
  ];

  const theme = { ...themes[(stageNumber - 1) % themes.length] };
  if (character === 'ship') {
    theme.glow2 = '#f8fbff';
  }
  return theme;
}

function createStars(rng, length, theme) {
  const stars = [];
  const layerSpeeds = [0.18, 0.35, 0.55];
  const counts = [64, 48, 36];

  counts.forEach((count, layerIndex) => {
    for (let i = 0; i < count; i += 1) {
      const size = 2 + layerIndex;
      stars.push({
        x: rng.float(0, length),
        y: rng.float(24, WORLD_HEIGHT - 120),
        size,
        layer: layerIndex,
        speedFactor: layerSpeeds[layerIndex],
        color: layerIndex === 0 ? theme.glow2 : layerIndex === 1 ? theme.glow : '#ffffff',
      });
    }
  });

  return stars;
}

function obstacleRect(type, x, y, w, h, extra = {}) {
  return { type, x, y, w, h, ...extra };
}

function padRect(type, x, y, w, h, extra = {}) {
  return { id: `${type}-${Math.round(x)}-${Math.round(y)}`, type, x, y, w, h, ...extra };
}

function generateCubeMap(rng, stageNumber) {
  const obstacles = [];
  const pads = [];
  const difficulty = stageNumber - 1;
  let x = 430;
  let segmentIndex = 0;

  while (x < STAGE_LENGTH - 650) {
    const safeGap = rng.int(100, 220) + difficulty * 10;
    x += safeGap;
    const pattern = CUBE_PATTERNS[rng.int(0, Math.min(CUBE_PATTERNS.length - 1, 4 + difficulty))];

    if (pattern === 'singleSpike') {
      obstacles.push(obstacleRect('spikeUp', x, GROUND_Y - 30, 28, 30));
      x += 95;
    } else if (pattern === 'doubleSpike') {
      obstacles.push(obstacleRect('spikeUp', x, GROUND_Y - 30, 28, 30));
      obstacles.push(obstacleRect('spikeUp', x + 26, GROUND_Y - 30, 28, 30));
      x += 130;
    } else if (pattern === 'tripleSpike') {
      for (let i = 0; i < 3; i += 1) {
        obstacles.push(obstacleRect('spikeUp', x + i * 26, GROUND_Y - 30, 28, 30));
      }
      x += 165;
    } else if (pattern === 'shortBlock') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 44, 44));
      x += 125;
    } else if (pattern === 'blockSpike') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 44, 44));
      obstacles.push(obstacleRect('spikeUp', x + 56, GROUND_Y - 30, 28, 30));
      x += 165;
    } else if (pattern === 'tallBlockPad') {
      pads.push(padRect('jump', x - 82, GROUND_Y - 18, 42, 18, { power: 760 }));
      obstacles.push(obstacleRect('block', x, GROUND_Y - 86, 48, 86));
      x += 165;
    } else if (pattern === 'boostLane') {
      pads.push(padRect('boost', x - 14, GROUND_Y - 16, 48, 16, { multiplier: 1.38, duration: 2.3 }));
      obstacles.push(obstacleRect('spikeUp', x + 110, GROUND_Y - 30, 28, 30));
      obstacles.push(obstacleRect('spikeUp', x + 136, GROUND_Y - 30, 28, 30));
      x += 220;
    } else if (pattern === 'slowLane') {
      pads.push(padRect('slow', x - 10, GROUND_Y - 16, 48, 16, { multiplier: 0.78, duration: 2.7 }));
      obstacles.push(obstacleRect('block', x + 102, GROUND_Y - 44, 44, 44));
      obstacles.push(obstacleRect('spikeUp', x + 158, GROUND_Y - 30, 28, 30));
      x += 240;
    } else if (pattern === 'doubleBlock') {
      obstacles.push(obstacleRect('block', x, GROUND_Y - 44, 42, 44));
      obstacles.push(obstacleRect('block', x + 92, GROUND_Y - 44, 42, 44));
      x += 190;
    }

    if (segmentIndex % 5 === 3 && rng.chance(0.35)) {
      pads.push(padRect('jump', x + 28, GROUND_Y - 18, 42, 18, { power: 740 }));
      obstacles.push(obstacleRect('block', x + 120, GROUND_Y - 70, 44, 70));
      x += 210;
    }

    segmentIndex += 1;
  }

  return {
    type: 'cube',
    groundY: GROUND_Y,
    obstacles,
    solids: [],
    pads,
    length: STAGE_LENGTH,
    baseSpeed: 300 + difficulty * 18,
    recommendedJumpVelocity: -610 - difficulty * 8,
  };
}

function generateShipMap(rng, stageNumber) {
  const obstacles = [];
  const pads = [];
  const difficulty = stageNumber - 1;
  let x = 0;
  let center = 268;

  while (x < STAGE_LENGTH) {
    const segW = x < 420 ? 180 : rng.int(180, 260);
    const shift = x < 420 ? 0 : rng.int(-1 - difficulty, 1 + difficulty) * 18;
    center = clamp(center + shift, 175, 340);
    const gap = clamp(196 - difficulty * 14 + rng.int(-10, 20), 132, 210);
    const topHeight = clamp(center - gap / 2, 70, 300);
    const bottomStart = clamp(center + gap / 2, 230, WORLD_HEIGHT - 90);

    obstacles.push(obstacleRect('block', x, 0, segW, Math.round(topHeight), { zone: 'top' }));
    obstacles.push(obstacleRect('block', x, Math.round(bottomStart), segW, WORLD_HEIGHT - Math.round(bottomStart), { zone: 'bottom' }));

    if (x > 260 && rng.chance(0.4)) {
      const spikeW = 30;
      const spikeH = 26 + difficulty * 3;
      const spikeX = x + rng.int(24, Math.max(24, segW - 56));
      if (rng.chance(0.5)) {
        obstacles.push(obstacleRect('spikeDown', spikeX, Math.round(topHeight) - 2, spikeW, spikeH));
      } else {
        obstacles.push(obstacleRect('spikeUp', spikeX, Math.round(bottomStart) - spikeH + 2, spikeW, spikeH));
      }
    }

    if (x > 320 && x < STAGE_LENGTH - 500 && rng.chance(0.28)) {
      const padType = rng.pick(SHIP_PAD_TYPES);
      const midY = clamp(center - 14, 140, WORLD_HEIGHT - 150);
      pads.push(
        padRect(padType, x + segW * 0.5 - 18, midY, 36, 36, {
          multiplier: padType === 'boost' ? 1.34 : 0.8,
          duration: padType === 'boost' ? 2 : 2.5,
          floating: true,
        }),
      );
    }

    x += segW;
  }

  return {
    type: 'ship',
    groundY: GROUND_Y,
    obstacles,
    solids: [],
    pads,
    length: STAGE_LENGTH,
    baseSpeed: 286 + difficulty * 16,
    thrust: 1460 + difficulty * 30,
  };
}

// 볼 · 스파이더: 바닥과 천장 사이 통로. 바닥 장애물이면 천장으로, 천장 장애물이면 바닥으로
function generateGravityMap(rng, stageNumber) {
  const obstacles = [];
  const difficulty = stageNumber - 1;
  let x = 560;
  let lastSide = null;

  while (x < STAGE_LENGTH - 650) {
    const side = rng.chance(0.5) ? 'floor' : 'ceiling';
    // 반대쪽으로 옮겨야 하면 이동할 시간을 넉넉히
    x += side === lastSide ? rng.int(110, 190) : rng.int(310, 380) - difficulty * 14;
    if (rng.chance(0.3)) {
      const height = rng.int(40, 64 + difficulty * 6);
      obstacles.push(side === 'floor'
        ? obstacleRect('block', x, GROUND_Y - height, 40, height)
        : obstacleRect('block', x, CEILING_Y, 40, height));
      x += 40;
    } else {
      const count = rng.int(1, Math.min(4, 2 + difficulty));
      for (let i = 0; i < count; i += 1) {
        obstacles.push(side === 'floor'
          ? obstacleRect('spikeUp', x + i * 26, GROUND_Y - 30, 28, 30)
          : obstacleRect('spikeDown', x + i * 26, CEILING_Y, 28, 30));
      }
      x += count * 26 + 2;
    }
    lastSide = side;
  }

  return {
    type: 'gravity',
    groundY: GROUND_Y,
    ceilingY: CEILING_Y,
    obstacles,
    solids: [],
    pads: [],
    length: STAGE_LENGTH,
    baseSpeed: 290 + difficulty * 14,
  };
}

function generateStageMap({ stageNumber, character, sessionSeed }) {
  const seed = hashString(`${sessionSeed}-${character}-${stageNumber}`);
  const rng = new SeededRandom(seed);
  const stageType = MODE_BY_ID[character]?.stage || 'cube';
  const base = stageType === 'ship'
    ? generateShipMap(rng, stageNumber)
    : stageType === 'gravity'
    ? generateGravityMap(rng, stageNumber)
    : generateCubeMap(rng, stageNumber);

  return {
    ...base,
    stageNumber,
    character,
    seed,
    custom: false,
    theme: buildStageTheme(stageNumber, character),
    stars: createStars(rng, STAGE_LENGTH, buildStageTheme(stageNumber, character)),
  };
}

// 블록 종류별 동작 (모양·히트박스는 8×8 픽셀 디자인이 결정)
const PAD_BEHAVIORS = {
  jumpUp: { type: 'jump', power: 760 },
  halfSpeed: { type: 'slow', multiplier: 0.5, duration: 2.8 },
  doubleSpeed: { type: 'boost', multiplier: 2, duration: 2.2 },
  nextJump: { type: 'orb' },
  greenOrb: { type: 'orbGreen' },
  blackOrb: { type: 'orbBlack' },
  dashOrb: { type: 'orbDash' },
  sBlock: { type: 'dashStop' },
  ...Object.fromEntries(MODES.map((mode) => [`mode${mode.code}`, { type: 'portal', mode: mode.id }])),
};

// 커스텀 맵의 블록 종류(테그) 목록: 기본 10종 + 맵 코드의 design(...) 정의
function buildRuntimeKinds(specKinds = {}) {
  const kinds = DESIGN_TYPES.map((type) => {
    const design = specKinds[type]?.design || DEFAULT_DESIGNS[type];
    return { name: type, type, design, tag: kindTag(type, design) };
  });
  Object.values(specKinds).forEach((kind) => {
    if (kind.name === kind.type) return;
    kinds.push({ name: kind.name, type: kind.type, design: kind.design, tag: kind.name });
  });
  return kinds;
}

function resolveRuntimeKind(world, text) {
  const key = String(text).trim();
  const lower = key.toLowerCase();
  return world.kinds.find((kind) => kind.tag === key)
    || world.kinds.find((kind) => kind.name === key)
    || world.kinds.find((kind) => kind.tag.toLowerCase() === lower || kind.name.toLowerCase() === lower)
    || null;
}

// 블록 위치·회전·디자인이 바뀌면 히트박스와 스프라이트를 다시 계산
function refreshRuntimeBlock(block) {
  const x = block.x * TILE;
  const top = GROUND_Y - (block.y + 1) * TILE;
  block.cx = x + TILE / 2;
  block.cy = top + TILE / 2;
  block.parts = designParts(block.design, x, top, block.rotation);
  block.bounds = block.parts.length ? polygonBounds(block.parts.flat()) : null;
  block.sprite = getSpriteCanvas(block.design);
  block.dirty = false;
}

function rebuildWorldLists(world) {
  const obstacles = [];
  const solids = [];
  const pads = [];
  const decor = [];
  world.blocks.forEach((block) => {
    if (block.dirty) refreshRuntimeBlock(block);
    if (block.hidden) return; // 사라진 블록은 안 보이고 히트박스도 없음
    decor.push(block);
    if (!block.bounds) return;
    if (block.type === 'dieBlock' || block.type === 'thorn') {
      obstacles.push({ type: 'pixelHazard', parts: block.parts, ...block.bounds, owner: block });
    } else if (block.type === 'square' || block.type === 'slope') {
      block.parts.forEach((points) => solids.push(polyShape('solidPart', points, { kind: block.type, owner: block })));
    } else if (PAD_BEHAVIORS[block.type]) {
      pads.push({ ...PAD_BEHAVIORS[block.type], id: block.id, parts: block.parts, cx: block.cx, cy: block.cy, ...block.bounds, owner: block });
    }
  });
  world.obstacles = obstacles;
  world.solids = solids;
  world.pads = pads;
  world.decor = decor;
  world.listsDirty = false;
}

function markBlockDirty(block) {
  block.dirty = true;
  if (app.world) app.world.listsDirty = true;
}

function buildCustomWorld(spec) {
  const character = MODE_BY_CODE[spec.startMode]?.id || 'cube';
  const start = spec.blocks.find((block) => block.type === 'start');
  // 이보다 위로 날아가면 사망 (가장 높은 블록보다 8칸 위, 최소 바닥에서 12칸)
  const highestRow = spec.blocks.reduce((max, block) => Math.max(max, block.y), 0);
  const topLimit = GROUND_Y - (Math.max(12, highestRow + 9)) * TILE;
  const clearWorldX = spec.clearX * TILE;
  const startWorldX = start.x * TILE;
  const length = Math.max(clearWorldX, startWorldX + TILE);
  const seed = hashString(JSON.stringify({ m: spec.startMode, b: spec.blocks, c: spec.clearX, k: spec.kinds }));
  const rng = new SeededRandom(seed);
  const theme = buildStageTheme(2, character);
  const kinds = buildRuntimeKinds(spec.kinds);

  const world = {
    type: character,
    character,
    custom: true,
    stageNumber: 'CUSTOM',
    groundY: GROUND_Y,
    obstacles: [],
    solids: [],
    pads: [],
    decor: [],
    kinds,
    blocks: [],
    scripts: [],
    globals: new Map(),
    disabledKeys: {},
    scriptErrors: [],
    time: 0,
    listsDirty: true,
    length,
    startWorldX,
    startGridY: start.y,
    clearWorldX,
    baseSpeed: character === 'ship' ? 286 : 300,
    recommendedJumpVelocity: -610,
    topLimit,
    thrust: 1460,
    seed,
    theme,
    stars: createStars(rng, Math.max(length, 960), theme),
  };

  spec.blocks.forEach((item, index) => {
    if (item.type === 'start') return;
    const kind = kinds.find((candidate) => candidate.name === item.name)
      || kinds.find((candidate) => candidate.name === item.type);
    const block = {
      id: `b${index}`,
      kind,
      type: kind.type,
      design: [...kind.design],
      x: item.x,
      y: item.y,
      rotation: item.rotation || 0,
      ghost: 0,          // 투명도 0~100
      hidden: false,
      jumped: false,     // 이 블록 위에서 점프했는지 (jump 조건)
      vars: new Map(),
      dirty: true,
      hasCode: Boolean(item.code && item.code.trim()),
    };
    world.blocks.push(block);
    if (block.hasCode) {
      world.scripts.push(createScriptRuntime(block, world, compileScript(item.code)));
    }
  });

  rebuildWorldLists(world);
  return world;
}

     #rrggbb / #rgb / #rrggbbaa : 색이 있는 픽셀 (히트박스 O)
     #00000000 (알파 00)        : 투명 픽셀   (히트박스 O, 안 보임)

const DESIGN_SIZE = 8;
const EMPTY_PX = '#';
const TRANSPARENT_PX = '#00000000';

function designFromRows(rows, palette) {
  return rows.join('').split('').map((ch) => {
    if (ch === '.') return EMPTY_PX;
    if (ch === 'T') return TRANSPARENT_PX;
    return palette[ch];
  });
}

function portalDesign(color, inner, glyph) {
  const rows = [
    '..PPPP..',
    '.PTTTTP.',
    ...glyph.map((row) => `PT${row.replace(/\./g, 'T')}TP`),
    '.PTTTTP.',
    '..PPPP..',
  ];
  return designFromRows(rows, { P: color, i: inner });
}

const DESIGN_TYPES = ['dieBlock', 'square', 'slope', 'thorn', 'jumpUp', 'nextJump', 'greenOrb', 'blackOrb', 'dashOrb', 'sBlock', 'halfSpeed', 'doubleSpeed', ...PORTAL_TYPES];

function normalizePixelToken(raw) {
  const token = String(raw).trim().toLowerCase();
  if (token === EMPTY_PX) return EMPTY_PX;
  const match = token.match(/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/);
  if (!match) return null;
  let hex = match[1];
  if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
  if (hex.length === 8) {
    if (hex.endsWith('00')) return TRANSPARENT_PX;
    if (hex.endsWith('ff')) hex = hex.slice(0, 6);
  }
  return `#${hex}`;
}

function parseDesignTokens(text) {
  const tokens = String(text).split(',').map((part) => part.trim()).filter((part) => part.length);
  if (tokens.length !== DESIGN_SIZE * DESIGN_SIZE) {
    throw new Error(`#hex 픽셀은 정확히 64개여야 합니다. (지금 ${tokens.length}개)`);
  }
  return tokens.map((token, index) => {
    const normalized = normalizePixelToken(token);
    if (!normalized) throw new Error(`${index + 1}번째 픽셀 '${token}'은(는) 올바른 #hex가 아닙니다.`);
    return normalized;
  });
}

function designsEqual(a, b) {
  return a.length === b.length && a.every((token, index) => token === b[index]);
}

function getDesign(designs, type) {
  return designs?.[type] || DEFAULT_DESIGNS[type] || DEFAULT_DESIGNS.dieBlock;
}

// 블록 테그: 기본 디자인이면 블록 이름, 디자인이 다르면 이름_해시6자리
function kindTag(type, design) {
  if (designsEqual(design, DEFAULT_DESIGNS[type])) return type;
  const hash = hashString(`${type}:${design.join(',')}`).toString(16).padStart(8, '0').slice(0, 6);
  return `${type}_${hash}`;
}

function designHitboxCount(tokens) {
  return tokens.filter((token) => token !== EMPTY_PX).length;
}

// 히트박스 픽셀을 줄 단위로 묶고, 위아래로 같은 폭이면 합친 직사각형 목록 (픽셀 단위)
const hitboxRectCache = new Map();
function hitboxRects(tokens) {
  const key = tokens.join(',');
  if (hitboxRectCache.has(key)) return hitboxRectCache.get(key);
  const rects = [];
  let open = [];
  for (let row = 0; row < DESIGN_SIZE; row += 1) {
    const runs = [];
    let col = 0;
    while (col < DESIGN_SIZE) {
      if (tokens[row * DESIGN_SIZE + col] !== EMPTY_PX) {
        const startCol = col;
        while (col < DESIGN_SIZE && tokens[row * DESIGN_SIZE + col] !== EMPTY_PX) col += 1;
        runs.push({ x: startCol, w: col - startCol });
      } else {
        col += 1;
      }
    }
    const next = [];
    runs.forEach((run) => {
      const previous = open.find((rect) => rect.x === run.x && rect.w === run.w);
      if (previous) {
        previous.h += 1;
        next.push(previous);
      } else {
        const rect = { x: run.x, y: row, w: run.w, h: 1 };
        rects.push(rect);
        next.push(rect);
      }
    });
    open = next;
  }
  hitboxRectCache.set(key, rects);
  return rects;
}

// 월드 좌표의 히트박스 다각형들 (칸 중심 기준 회전)
function designParts(tokens, x, top, rotation = 0) {
  const pixel = TILE / DESIGN_SIZE;
  const cx = x + TILE / 2;
  const cy = top + TILE / 2;
  return hitboxRects(tokens).map((rect) => rotatePoints(
    rectPoints(x + rect.x * pixel, top + rect.y * pixel, rect.w * pixel, rect.h * pixel),
    cx, cy, rotation,
  ));
}

const spriteCanvasCache = new Map();
function getSpriteCanvas(tokens) {
  const key = tokens.join(',');
  if (spriteCanvasCache.has(key)) return spriteCanvasCache.get(key);
  const sprite = document.createElement('canvas');
  sprite.width = DESIGN_SIZE;
  sprite.height = DESIGN_SIZE;
  const spriteCtx = sprite.getContext('2d');
  tokens.forEach((token, index) => {
    if (token === EMPTY_PX || token === TRANSPARENT_PX) return;
    spriteCtx.fillStyle = token;
    spriteCtx.fillRect(index % DESIGN_SIZE, Math.floor(index / DESIGN_SIZE), 1, 1);
  });
  spriteCanvasCache.set(key, sprite);
  return sprite;
}

const spriteUrlCache = new Map();
function getSpriteDataUrl(tokens) {
  const key = tokens.join(',');
  if (!spriteUrlCache.has(key)) spriteUrlCache.set(key, getSpriteCanvas(tokens).toDataURL());
  return spriteUrlCache.get(key);
}


/* =========================================================
   script.js  –  블록 코드 code{ } 해석기
   ---------------------------------------------------------
   들여쓰기로 묶음을 나눔 (ifCode / wT / until 아래는 한 칸 더 들여쓰기)
   반복문은 한 바퀴마다 한 프레임 쉬고, wait(A)는 A초 동안 멈춤
   ========================================================= */
// 단독으로 쓰는 명령: 이름(소문자) → [최소 인자 수, 최대 인자 수]
const SCRIPT_COMMANDS = {
  convert: [1, 1],
  rot: [1, 1],
  tran: [1, 1],
  tranplus: [1, 1],
  move: [2, 2],
  px: [2, 2],
  disapp: [0, 0],
  appear: [0, 0],
  wait: [1, 1],
  rotmove: [2, 2],
  nokey: [1, 2],
  catp: [2, 2],
  kill: [0, 0],
};

// 값을 돌려주는 함수
const SCRIPT_FUNCTIONS = {
  blocktag: [0, 0],
  coox: [0, 0],
  cooy: [0, 0],
  pxcolor: [1, 1],
  cacoox: [0, 0],
  cacooy: [0, 0],
  sin: [1, 1],
  cos: [1, 1],
  tan: [1, 1],
  abs: [1, 1],
};

const SCRIPT_CONDITION_WORDS = ['dis', 'app', 'jump', 'true', 'false'];
const SCRIPT_STEP_LIMIT = 5000;
const SCRIPT_NAME = '[A-Za-z_$\\u3131-\\uD79D][\\w$\\u3131-\\uD79D]*';

class ScriptError extends Error {
  constructor(message, line) {
    super(line ? `${line}줄: ${message}` : message);
    this.line = line;
  }
}

function tokenizeExpression(source, line) {
  const tokens = [];
  let index = 0;
  const nameRe = new RegExp(`^${SCRIPT_NAME}`);
  while (index < source.length) {
    const rest = source.slice(index);
    const ch = source[index];
    if (/\s/.test(ch)) {
      index += 1;
      continue;
    }
    const number = rest.match(/^(\d+(\.\d+)?|\.\d+)/);
    if (number) {
      tokens.push({ t: 'num', v: Number(number[0]) });
      index += number[0].length;
      continue;
    }
    if (ch === '#') {
      const hex = rest.match(/^#[0-9a-fA-F]*/)[0];
      tokens.push({ t: 'hex', v: hex });
      index += hex.length;
      continue;
    }
    if (ch === '"' || ch === "'") {
      const end = source.indexOf(ch, index + 1);
      if (end < 0) throw new ScriptError('따옴표가 닫히지 않았습니다.', line);
      tokens.push({ t: 'str', v: source.slice(index + 1, end) });
      index = end + 1;
      continue;
    }
    const name = rest.match(nameRe);
    if (name) {
      tokens.push({ t: 'id', v: name[0] });
      index += name[0].length;
      continue;
    }
    const op = rest.match(/^(\/\/|==|!=|<=|>=|&&|\|\||[+\-*/%<>=!(),])/);
    if (op) {
      tokens.push({ t: 'op', v: op[0] });
      index += op[0].length;
      continue;
    }
    throw new ScriptError(`알 수 없는 문자 '${ch}'가 있습니다.`, line);
  }
  return tokens;
}

function parseExpression(source, line) {
  const tokens = tokenizeExpression(source, line);
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const isOp = (value) => peek()?.t === 'op' && peek().v === value;
  const isWord = (word) => peek()?.t === 'id' && peek().v.toLowerCase() === word;

  function orExpr() {
    let left = andExpr();
    while (isOp('||') || isWord('or')) {
      next();
      left = { k: 'bin', op: 'or', a: left, b: andExpr() };
    }
    return left;
  }
  function andExpr() {
    let left = notExpr();
    while (isOp('&&') || isWord('and')) {
      next();
      left = { k: 'bin', op: 'and', a: left, b: notExpr() };
    }
    return left;
  }
  function notExpr() {
    if (isOp('!') || isWord('not')) {
      next();
      return { k: 'un', op: 'not', a: notExpr() };
    }
    return compareExpr();
  }
  function compareExpr() {
    let left = addExpr();
    while (peek()?.t === 'op' && ['==', '!=', '<', '>', '<=', '>=', '='].includes(peek().v)) {
      let op = next().v;
      if (op === '=') op = '==';
      left = { k: 'bin', op, a: left, b: addExpr() };
    }
    return left;
  }
  function addExpr() {
    let left = mulExpr();
    while (isOp('+') || isOp('-')) {
      const op = next().v;
      left = { k: 'bin', op, a: left, b: mulExpr() };
    }
    return left;
  }
  function mulExpr() {
    let left = unary();
    while (isOp('*') || isOp('/') || isOp('//') || isOp('%')) {
      const op = next().v;
      left = { k: 'bin', op, a: left, b: unary() };
    }
    return left;
  }
  function unary() {
    if (isOp('-')) {
      next();
      return { k: 'un', op: 'neg', a: unary() };
    }
    if (isOp('+')) {
      next();
      return unary();
    }
    return primary();
  }
  function primary() {
    const token = next();
    if (!token) throw new ScriptError('식이 중간에 끝났습니다.', line);
    if (token.t === 'num') return { k: 'num', v: token.v };
    if (token.t === 'str') return { k: 'str', v: token.v };
    if (token.t === 'hex') return { k: 'hex', v: token.v };
    if (token.t === 'op' && token.v === '(') {
      const inner = orExpr();
      if (!isOp(')')) throw new ScriptError('괄호 ) 가 닫히지 않았습니다.', line);
      next();
      return inner;
    }
    if (token.t === 'id') {
      const lower = token.v.toLowerCase();
      if (isOp('(')) {
        next();
        const args = [];
        if (!isOp(')')) {
          args.push(orExpr());
          while (isOp(',')) {
            next();
            args.push(orExpr());
          }
        }
        if (!isOp(')')) throw new ScriptError(`${token.v}( 의 괄호가 닫히지 않았습니다.`, line);
        next();
        return { k: 'call', name: lower, raw: token.v, args };
      }
      if (SCRIPT_CONDITION_WORDS.includes(lower)) return { k: 'kw', name: lower };
      return { k: 'var', name: token.v };
    }
    throw new ScriptError(`'${token.v}' 자리에 값이 와야 합니다.`, line);
  }

  const expression = orExpr();
  if (pos < tokens.length) throw new ScriptError(`'${tokens[pos].v}' 근처의 식을 확인해 주세요.`, line);
  return expression;
}

function checkArity(table, node, line) {
  const [min, max] = table[node.name];
  if (node.args.length < min || node.args.length > max) {
    const expected = min === max ? `${min}개` : `${min}~${max}개`;
    throw new ScriptError(`${node.raw}()에는 값이 ${expected} 필요합니다.`, line);
  }
}

// 식 안의 함수 호출 검사
function validateExpression(node, line) {
  if (!node) return;
  if (node.k === 'call') {
    if (SCRIPT_COMMANDS[node.name]) throw new ScriptError(`${node.raw}()는 식 안에 쓸 수 없는 명령입니다.`, line);
    if (!SCRIPT_FUNCTIONS[node.name]) throw new ScriptError(`'${node.raw}' 함수는 없습니다.`, line);
    checkArity(SCRIPT_FUNCTIONS, node, line);
    node.args.forEach((arg) => validateExpression(arg, line));
  } else if (node.k === 'un') {
    validateExpression(node.a, line);
  } else if (node.k === 'bin') {
    validateExpression(node.a, line);
    validateExpression(node.b, line);
  }
}

function parseStatement(text, line) {
  let match = text.match(/^ifCode\s+(.+?)\s*:$/i);
  if (match) {
    const cond = parseExpression(match[1], line);
    validateExpression(cond, line);
    return { k: 'if', cond, line, needsBody: true };
  }
  if (/^wT\s*:$/i.test(text)) return { k: 'forever', line, needsBody: true };
  match = text.match(/^until\s+(.+?)\s*:$/i);
  if (match) {
    const cond = parseExpression(match[1], line);
    validateExpression(cond, line);
    return { k: 'until', cond, line, needsBody: true };
  }
  match = text.match(new RegExp(`^(${SCRIPT_NAME})\\s+c(\\+?)=\\s*(.+)$`));
  if (match) {
    const expr = parseExpression(match[3], line);
    validateExpression(expr, line);
    return { k: 'assign', name: match[1], add: match[2] === '+', expr, line };
  }
  if (text.endsWith(':')) throw new ScriptError(`'${text}'은(는) 알 수 없는 문장입니다. (ifCode, wT, until 중 하나인가요?)`, line);

  const expr = parseExpression(text, line);
  if (expr.k !== 'call') throw new ScriptError(`'${text}'은(는) 명령이 아닙니다.`, line);
  if (SCRIPT_FUNCTIONS[expr.name]) throw new ScriptError(`${expr.raw}()는 값을 돌려주는 함수라 단독으로 쓸 수 없습니다.`, line);
  if (!SCRIPT_COMMANDS[expr.name]) throw new ScriptError(`'${expr.raw}' 명령은 없습니다.`, line);
  checkArity(SCRIPT_COMMANDS, expr, line);
  expr.args.forEach((arg) => validateExpression(arg, line));
  return { k: 'call', name: expr.name, args: expr.args, line };
}

// 코드 → 실행 트리. lineOffset: 맵 코드 안에서의 줄 번호 보정
function compileScript(source, lineOffset = 0) {
  const lines = [];
  String(source).replace(/\t/g, '    ').split(/\r?\n/).forEach((raw, index) => {
    const text = raw.replace(/\s+$/, '');
    const content = text.trim();
    if (!content || content.startsWith('//')) return;
    lines.push({ indent: text.length - text.trimStart().length, text: content, line: index + 1 + lineOffset });
  });
  if (!lines.length) return [];

  let index = 0;
  function parseBlock(indent) {
    const statements = [];
    while (index < lines.length) {
      const current = lines[index];
      if (current.indent < indent) break;
      if (current.indent > indent) throw new ScriptError('들여쓰기가 맞지 않습니다.', current.line);
      index += 1;
      const statement = parseStatement(current.text, current.line);
      if (statement.needsBody) {
        const following = lines[index];
        if (!following || following.indent <= indent) {
          throw new ScriptError(`'${current.text}' 아래에 한 칸 더 들여쓴 코드가 필요합니다.`, current.line);
        }
        statement.body = parseBlock(following.indent);
      }
      statements.push(statement);
    }
    return statements;
  }

  const program = parseBlock(lines[0].indent);
  if (index < lines.length) throw new ScriptError('들여쓰기가 맞지 않습니다.', lines[index].line);
  return program;
}

// 코드 앞쪽 공통 들여쓰기 제거 (줄 수는 유지)
function dedentCode(source) {
  const lines = String(source).replace(/\t/g, '    ').split(/\r?\n/);
  const indents = lines.filter((line) => line.trim()).map((line) => line.length - line.trimStart().length);
  const common = indents.length ? Math.min(...indents) : 0;
  return lines.map((line) => line.slice(Math.min(common, line.length - line.trimStart().length))).join('\n').replace(/\s+$/, '');
}

/* ---------- 실행 ---------- */
const isScriptName = (value) => Boolean(value && typeof value === 'object' && value.isName);

function scriptNumber(value) {
  if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
  if (typeof value === 'boolean') return value ? 1 : 0;
  if (isScriptName(value)) return 0;
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function scriptText(value) {
  if (isScriptName(value)) return value.name;
  if (typeof value === 'number') return String(Math.round(value * 1e6) / 1e6);
  return String(value);
}

function scriptTruthy(value) {
  if (typeof value === 'boolean') return value;
  if (typeof value === 'number') return value !== 0;
  if (isScriptName(value)) return false;
  return value !== '' && value !== '0' && String(value).toLowerCase() !== 'false';
}

function scriptNumericLike(value) {
  if (typeof value === 'number') return value;
  if (typeof value === 'boolean') return value ? 1 : 0;
  if (typeof value === 'string' && value.trim() !== '' && Number.isFinite(Number(value))) return Number(value);
  return null;
}

function scriptEquals(a, b) {
  const na = scriptNumericLike(a);
  const nb = scriptNumericLike(b);
  if (na !== null && nb !== null) return Math.abs(na - nb) < 1e-9;
  const normalize = (value) => {
    const text = scriptText(value);
    return text.startsWith('#') ? normalizePixelToken(text) || text : text;
  };
  return normalize(a) === normalize(b);
}

const cleanNumber = (value) => (Math.abs(value) < 1e-10 ? 0 : Math.round(value * 1e9) / 1e9);
const degToRad = (deg) => (deg * Math.PI) / 180;

function evalScript(rt, node) {
  const block = rt.block;
  switch (node.k) {
    case 'num':
    case 'str':
    case 'hex':
      return node.v;
    case 'var': {
      const store = node.name.startsWith('$') ? rt.world.globals : rt.vars;
      return store.has(node.name) ? store.get(node.name) : { isName: true, name: node.name };
    }
    case 'kw':
      if (node.name === 'true') return true;
      if (node.name === 'false') return false;
      if (node.name === 'dis') return block.hidden;
      if (node.name === 'app') return !block.hidden;
      if (node.name === 'jump') {
        const jumped = block.jumped;
        block.jumped = false; // 한 번 확인하면 초기화
        return jumped;
      }
      return false;
    case 'un':
      return node.op === 'not' ? !scriptTruthy(evalScript(rt, node.a)) : -scriptNumber(evalScript(rt, node.a));
    case 'bin': {
      if (node.op === 'and') return scriptTruthy(evalScript(rt, node.a)) && scriptTruthy(evalScript(rt, node.b));
      if (node.op === 'or') return scriptTruthy(evalScript(rt, node.a)) || scriptTruthy(evalScript(rt, node.b));
      const a = evalScript(rt, node.a);
      const b = evalScript(rt, node.b);
      if (node.op === '==') return scriptEquals(a, b);
      if (node.op === '!=') return !scriptEquals(a, b);
      const x = scriptNumber(a);
      const y = scriptNumber(b);
      switch (node.op) {
        case '+':
          // 숫자가 아닌 글자끼리는 이어 붙임
          if (scriptNumericLike(a) === null && typeof a === 'string') return a + scriptText(b);
          return cleanNumber(x + y);
        case '-': return cleanNumber(x - y);
        case '*': return cleanNumber(x * y);
        case '/': return y === 0 ? 0 : cleanNumber(x / y);
        case '//': return y === 0 ? 0 : Math.floor(x / y);          // 몫
        case '%': return y === 0 ? 0 : cleanNumber(x - y * Math.floor(x / y)); // 나머지
        case '<': return x < y;
        case '>': return x > y;
        case '<=': return x <= y;
        case '>=': return x >= y;
        default: return 0;
      }
    }
    case 'call': {
      const args = node.args.map((arg) => evalScript(rt, arg));
      switch (node.name) {
        case 'blocktag': return block.kind.tag;
        case 'coox': return cleanNumber(block.x);
        case 'cooy': return cleanNumber(block.y);
        case 'pxcolor': {
          const pixel = Math.round(scriptNumber(args[0])) - 1;
          return block.design[pixel] ?? EMPTY_PX;
        }
        case 'cacoox': return playerGridPosition().x;
        case 'cacooy': return playerGridPosition().y;
        case 'sin': return cleanNumber(Math.sin(degToRad(scriptNumber(args[0]))));
        case 'cos': return cleanNumber(Math.cos(degToRad(scriptNumber(args[0]))));
        case 'tan': return cleanNumber(Math.tan(degToRad(scriptNumber(args[0]))));
        case 'abs': return Math.abs(scriptNumber(args[0]));
        default: return 0;
      }
    }
    default:
      return 0;
  }
}

function normalizeKeyName(text) {
  const key = String(text).trim().toLowerCase();
  if (key === 'space' || key === 'spacebar' || key === ' ') return 'space';
  if (['click', 'mouse', 'touch', 'tap', 'pointer'].includes(key)) return 'click';
  if (key === 'all' || key === 'any') return 'all';
  return null;
}

/*
  실행 상태는 "스택"으로만 들고 있어서 그대로 복사할 수 있음 (연습 모드 체크포인트용)
  프레임: { kind: 'seq' | 'forever' | 'until', body, index, pendingCheck, cond?, line? }
*/
function createScriptRuntime(block, world, program) {
  return {
    block,
    vars: block.vars,
    world,
    done: program.length === 0,
    steps: 0,
    waitUntil: null,
    stack: [{ kind: 'seq', body: program, index: 0, pendingCheck: false }],
  };
}

function withLine(line, fn) {
  try {
    return fn();
  } catch (error) {
    if (error instanceof ScriptError && error.line) throw error;
    throw new ScriptError(error instanceof Error ? error.message : String(error), line);
  }
}

// 한 프레임 실행: 반복 한 바퀴 끝 · wait · 단계 제한에서 멈추고 다음 프레임에 이어서
function stepScript(rt) {
  if (rt.done) return;
  if (rt.waitUntil !== null) {
    if (rt.world.time < rt.waitUntil) return;
    rt.waitUntil = null;
  }
  rt.steps = 0;
  while (!rt.done) {
    const frame = rt.stack[rt.stack.length - 1];
    if (!frame) {
      rt.done = true;
      return;
    }
    if (frame.pendingCheck) {
      frame.pendingCheck = false;
      if (frame.kind === 'until' && withLine(frame.line, () => scriptTruthy(evalScript(rt, frame.cond)))) {
        rt.stack.pop();
        continue;
      }
      frame.index = 0;
    }
    if (frame.index >= frame.body.length) {
      if (frame.kind === 'forever' || frame.kind === 'until') {
        frame.pendingCheck = true;
        return; // 반복 한 바퀴마다 한 프레임 쉼
      }
      rt.stack.pop();
      continue;
    }
    rt.steps += 1;
    if (rt.steps > SCRIPT_STEP_LIMIT) return; // 쉬지 않고 너무 오래 돌면 다음 프레임에 이어서
    const statement = frame.body[frame.index];
    frame.index += 1;
    if (withLine(statement.line, () => execScriptStatement(rt, statement))) return;
  }
}

// true를 돌려주면 이번 프레임은 여기까지
function execScriptStatement(rt, statement) {
  const push = (kind, extra = {}) => rt.stack.push({ kind, body: statement.body, index: 0, pendingCheck: false, line: statement.line, ...extra });
  switch (statement.k) {
    case 'if':
      if (scriptTruthy(evalScript(rt, statement.cond))) push('seq');
      return false;
    case 'forever':
      push('forever');
      return false;
    case 'until':
      if (!scriptTruthy(evalScript(rt, statement.cond))) push('until', { cond: statement.cond });
      return false;
    case 'assign': {
      const value = evalScript(rt, statement.expr);
      const store = statement.name.startsWith('$') ? rt.world.globals : rt.vars;
      if (statement.add) {
        const current = store.has(statement.name) ? store.get(statement.name) : 0;
        store.set(statement.name, cleanNumber(scriptNumber(current) + scriptNumber(value)));
      } else {
        store.set(statement.name, isScriptName(value) ? value.name : value);
      }
      return false;
    }
    case 'call':
      return execScriptCommand(rt, statement);
    default:
      return false;
  }
}

function execScriptCommand(rt, statement) {
  const block = rt.block;
  const args = statement.args.map((arg) => evalScript(rt, arg));
  const num = (index) => scriptNumber(args[index]);

  switch (statement.name) {
    case 'convert': {
      const kind = resolveRuntimeKind(rt.world, scriptText(args[0]));
      if (!kind) throw new ScriptError(`블록 테그 '${scriptText(args[0])}'을(를) 찾을 수 없습니다.`, statement.line);
      block.kind = kind;
      block.type = kind.type;
      block.design = [...kind.design];
      block.rotation = fixBlockRotation(kind.type, block.rotation);
      markBlockDirty(block);
      return false;
    }
    case 'rot':
      block.rotation = fixBlockRotation(block.type, block.rotation + num(0)); // 화살표 공점은 -80°~80°
      markBlockDirty(block);
      return false;
    case 'tran':
      block.ghost = clamp(num(0), 0, 100);
      return false;
    case 'tranplus':
      block.ghost = clamp(block.ghost + num(0), 0, 100);
      return false;
    case 'move':
      block.x = cleanNumber(block.x + num(0));
      block.y = cleanNumber(block.y + num(1));
      markBlockDirty(block);
      return false;
    case 'rotmove': {
      const rad = degToRad(num(0));
      block.x = cleanNumber(block.x + Math.cos(rad) * num(1));
      block.y = cleanNumber(block.y + Math.sin(rad) * num(1));
      markBlockDirty(block);
      return false;
    }
    case 'px': {
      const pixel = Math.round(num(0)) - 1;
      if (pixel < 0 || pixel > 63) throw new ScriptError('픽셀 번호는 1~64 사이여야 합니다.', statement.line);
      const token = normalizePixelToken(scriptText(args[1]));
      if (!token) throw new ScriptError(`'${scriptText(args[1])}'은(는) 올바른 #hex가 아닙니다.`, statement.line);
      block.design = [...block.design]; // 복사 후 수정 (체크포인트가 옛 배열을 그대로 들고 있을 수 있음)
      block.design[pixel] = token;
      markBlockDirty(block);
      return false;
    }
    case 'disapp':
      if (!block.hidden) {
        block.hidden = true;
        markBlockDirty(block);
      }
      return false;
    case 'appear':
      if (block.hidden) {
        block.hidden = false;
        markBlockDirty(block);
      }
      return false;
    case 'wait':
      rt.waitUntil = rt.world.time + Math.max(0, num(0));
      return true;
    case 'nokey': {
      const key = normalizeKeyName(scriptText(args[0]));
      if (!key) throw new ScriptError('noKey에는 Space, Click, All 중 하나를 쓰세요.', statement.line);
      const duration = args.length > 1 ? Math.max(0, num(1)) : Infinity;
      rt.world.disabledKeys[key] = rt.world.time + duration;
      return false;
    }
    case 'catp':
      teleportPlayer(num(0), num(1));
      return false;
    case 'kill':
      rt.done = true;
      failStage();
      return true;
    default:
      return false;
  }
}

/* =========================================================
   screens.js  –  화면(UI) 관리
   ========================================================= */
const SCREENS = {
  START: 'start',
  CHARACTER: 'character',
  POD: 'pod',

function categoryOfType(type) {
  return EDITOR_CATEGORIES.find((category) => category.types.includes(type))?.id || null;
}

function formatMapNumber(value) {
  const rounded = Math.round(Number(value) * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

const TYPE_LABELS = Object.fromEntries(EDITOR_TOOLS.map((tool) => [tool.type, tool.label]));

/* ---------- 에디터 블록 종류(kind)와 테그 ---------- */
function getEditorKind(editor, kindId) {
  return editor.kinds.find((kind) => kind.id === kindId) || null;
}

function editorKindTag(kind) {
  return kind ? kindTag(kind.type, kind.design) : '';
}

function editorBlockTag(editor, block) {
  if (!block || block.type === 'start') return 'start';
  return editorKindTag(getEditorKind(editor, block.kindId));
}

function editorBlockDesign(editor, block) {
  return getEditorKind(editor, block.kindId)?.design || DEFAULT_DESIGNS[block.type];
}

function indentCode(code) {
  return code.split('\n').map((line) => (line.trim() ? `    ${line}` : '')).join('\n');
}

function buildMapCode(editor) {
  const blocks = [...editor.blocks].sort((a, b) => {
    if (a.type === 'start' && b.type !== 'start') return -1;
    if (b.type === 'start' && a.type !== 'start') return 1;
    return a.x - b.x || a.y - b.y;
  });

  // 기본 디자인과 다른 블록 종류만 design(테그, ...)로 내보냄
  const designLines = new Map();
  editor.kinds.forEach((kind) => {
    const tag = editorKindTag(kind);
    if (tag !== kind.type && !designLines.has(tag)) designLines.set(tag, `design(${tag}, ${kind.design.join(', ')})`);
  });

  const blockLines = [];
  blocks.forEach((block) => {
    const name = editorBlockTag(editor, block);
    const coords = `${formatMapNumber(block.x)}, ${formatMapNumber(block.y)}`;
    let rotation = block.type !== 'start' ? normalizeAngle(block.rotation || 0) : 0;
    if (block.type === 'dashOrb' && rotation > 180) rotation -= 360; // 화살표 공점은 -80~80으로 표기
    blockLines.push(rotation
      ? `blockSpecial(${name}, ${coords}, ${formatMapNumber(rotation)})`
      : `block(${name}, ${coords})`);
    if (block.code && block.code.trim()) {
      blockLines.push('code{', indentCode(block.code), '}');
    }
  });

  return [
    `startMode(${editor.startMode})`,
    ...designLines.values(),
    ...blockLines,
    `clear(${formatMapNumber(editor.clearX)})`,
  ].join('\n');
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function spriteClassFor(editor, block) {
  if (block.type === 'start') return `sprite-start${editor.startMode}`;
  return `sprite-k-${block.kindId}`;
}

// 에디터용 스프라이트 CSS 클래스 (.sprite-k-<kindId>, .sprite-start…)
function spriteStyleBlock(editor) {
  const rules = editor.kinds.map((kind) => `.sprite-k-${kind.id}{background-image:url(${getSpriteDataUrl(kind.design)})}`);
  MODES.forEach((mode) => rules.push(`.sprite-start${mode.code}{background-image:url(${getSpriteDataUrl(DEFAULT_DESIGNS[`start${mode.code}`])})}`));
  return `<style>${rules.join('')}</style>`;
}

function editorBlockMarkup(editor, block) {
  if (!block) return '';
  const fx = Math.round((block.x - Math.floor(block.x)) * 10) / 10;
  const fy = Math.round((block.y - Math.floor(block.y)) * 10) / 10;
  const rotation = block.type !== 'start' ? block.rotation || 0 : 0;
  const style = `transform:translate(${fx * EDITOR_CELL}px, ${-fy * EDITOR_CELL}px) rotate(${rotation}deg)`;
  const badge = block.code && block.code.trim() ? '<span class="code-badge" aria-hidden="true">{}</span>' : '';
  const invisible = block.type === 'sBlock' ? ' editor-invisible' : ''; // 게임에서는 안 보이는 블록
  return `<span class="editor-object sprite ${spriteClassFor(editor, block)}${invisible}" style="${style}" aria-hidden="true"></span>${badge}`;
}

const MAP_NUM = '(-?\\d+(?:\\.\\d+)?)';
const MAP_NAME = '([A-Za-z][A-Za-z0-9_]*)';
const BLOCK_LINE_RE = new RegExp(`^block\\(\\s*${MAP_NAME}\\s*,\\s*${MAP_NUM}\\s*,\\s*${MAP_NUM}\\s*\\)$`);
const SPECIAL_LINE_RE = new RegExp(`^blockSpecial\\(\\s*${MAP_NAME}\\s*,\\s*${MAP_NUM}\\s*,\\s*${MAP_NUM}\\s*,\\s*${MAP_NUM}\\s*\\)$`);

/*
  맵 코드 형식
    startMode(Cube|Airplane|Ball|Ufo|Wave|Robot|Spider|Swing)
    design(테그, #hex × 64)          테그 = 기본 블록 이름 또는 이름_xxxx
    block(테그, x, y)
    blockSpecial(테그, x, y, 각도)
    code{                            ← 바로 위 블록에 붙는 코드
        ...
    }
    clear(x)
*/
function parseMapCode(source) {
  const rawLines = String(source).split(/\r?\n/);
  if (!rawLines.some((line) => line.trim())) throw new Error('맵 코드를 입력해 주세요.');

  let startMode = null;
  let clearX = null;
  let statementCount = 0;
  const blocks = [];
  const kinds = {};

  const pushBlock = (lineNumber, name, rawX, rawY, rotation = 0) => {
    const x = Number(rawX);
    const y = Number(rawY);
    if (x < 0 || y < 0) throw new Error(`${lineNumber}줄: 좌표에는 음수를 사용할 수 없습니다.`);
    blocks.push({ name, type: null, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, rotation, code: '', lineNumber });
  };

  for (let i = 0; i < rawLines.length; i += 1) {
    const lineNumber = i + 1;
    const line = rawLines[i].trim();
    if (!line) continue;

    const codeOpen = line.match(/^code\s*\{(.*)$/);
    if (codeOpen) {
      const target = blocks[blocks.length - 1];
      if (!target) throw new Error(`${lineNumber}줄: code{ } 바로 위에 블록이 있어야 합니다.`);
      if (target.name === 'start') throw new Error(`${lineNumber}줄: start 블록에는 code를 넣을 수 없습니다.`);
      if (target.code) throw new Error(`${lineNumber}줄: 이 블록에는 이미 code가 있습니다.`);
      const rest = codeOpen[1];
      const body = [];
      let closed = false;
      let bodyStart = lineNumber;
      if (rest.trim().endsWith('}')) {
        body.push(rest.trim().slice(0, -1));
        closed = true;
      } else {
        if (rest.trim()) body.push(rest);
        else bodyStart = lineNumber + 1;
        while (i + 1 < rawLines.length) {
          i += 1;
          if (rawLines[i].trim() === '}') {
            closed = true;
            break;
          }
          body.push(rawLines[i]);
        }
      }
      if (!closed) throw new Error(`${lineNumber}줄: code{ 가 } 로 닫히지 않았습니다.`);
      const code = dedentCode(body.join('\n'));
      try {
        compileScript(code, bodyStart - 1);
      } catch (error) {
        throw new Error(`code 오류 · ${error.message}`);
      }
      target.code = code;
      continue;
    }

    statementCount += 1;
    if (statementCount > 5002 + 500) throw new Error('블록은 최대 5000개까지 불러올 수 있습니다.');

    const modeMatch = line.match(/^startMode\(\s*([A-Za-z]+)\s*\)$/);
    if (modeMatch && !MODE_BY_CODE[modeMatch[1]]) {
      throw new Error(`${lineNumber}줄: 시작 모드는 ${MODES.map((mode) => mode.code).join(', ')} 중 하나여야 합니다.`);
    }
    if (modeMatch) {
      if (startMode) throw new Error(`${lineNumber}줄: startMode는 한 번만 사용할 수 있습니다.`);
      startMode = modeMatch[1];
      continue;
    }

    const designMatch = line.match(/^design\(\s*([A-Za-z][A-Za-z0-9_]*)\s*,(.*)\)$/);
    if (designMatch) {
      const [, name, body] = designMatch;
      const variant = name.match(/^([A-Za-z]+)_[A-Za-z0-9]+$/);
      const type = DESIGN_TYPES.includes(name) ? name : variant && DESIGN_TYPES.includes(variant[1]) ? variant[1] : null;
      if (!type) throw new Error(`${lineNumber}줄: '${name}'은(는) 디자인할 수 없는 블록 테그입니다. (예: thorn, thorn_a1b2c3)`);
      if (kinds[name]) throw new Error(`${lineNumber}줄: ${name} 디자인은 한 번만 쓸 수 있습니다.`);
      try {
        kinds[name] = { name, type, design: parseDesignTokens(body) };
      } catch (error) {
        throw new Error(`${lineNumber}줄: ${error.message}`);
      }
      continue;
    }

    const specialMatch = line.match(SPECIAL_LINE_RE);
    if (specialMatch) {
      const [, name, rawX, rawY, rawAngle] = specialMatch;
      if (name === 'start') throw new Error(`${lineNumber}줄: start 블록은 회전할 수 없습니다.`);
      pushBlock(lineNumber, name, rawX, rawY, normalizeAngle(rawAngle));
      continue;
    }

    const blockMatch = line.match(BLOCK_LINE_RE);
    if (blockMatch) {
      const [, name, rawX, rawY] = blockMatch;
      pushBlock(lineNumber, name, rawX, rawY);
      continue;
    }

    const clearMatch = line.match(/^clear\(\s*(-?\d+(?:\.\d+)?)\s*\)$/);
    if (clearMatch) {
      if (clearX !== null) throw new Error(`${lineNumber}줄: clear는 한 번만 사용할 수 있습니다.`);
      clearX = Math.round(Number(clearMatch[1]) * 10) / 10;
      if (clearX < 0) throw new Error(`${lineNumber}줄: clear 좌표에는 음수를 사용할 수 없습니다.`);
      continue;
    }

    throw new Error(`${lineNumber}줄의 형식을 확인해 주세요.`);
  }

  // 블록 이름(테그) 확인
  blocks.forEach((block) => {
    if (block.name === 'start') {
      block.type = 'start';
    } else if (kinds[block.name]) {
      block.type = kinds[block.name].type;
    } else if (DESIGN_TYPES.includes(block.name)) {
      block.type = block.name;
    } else {
      throw new Error(`${block.lineNumber}줄: 알 수 없는 블록 '${block.name}'입니다. 테그라면 design(${block.name}, ...)이 필요합니다.`);
    }
    block.rotation = fixBlockRotation(block.type, block.rotation); // 화살표 공점은 -80°~80°
  });

  if (!startMode) throw new Error(`startMode(...)가 필요합니다. (${MODES.map((mode) => mode.code).join(', ')})`);
  const starts = blocks.filter((block) => block.type === 'start');
  if (starts.length !== 1) throw new Error('start 블록은 정확히 하나가 필요합니다.');
  if (clearX === null) throw new Error('clear(x) 설정이 필요합니다.');
  if (clearX <= starts[0].x) throw new Error('clear 좌표는 시작 위치보다 오른쪽이어야 합니다.');

  const occupied = new Set();
  blocks.forEach((block) => {
    const key = `${Math.floor(block.x)},${Math.floor(block.y)}`;
    if (occupied.has(key)) throw new Error(`(${key}) 칸에 블록이 두 개 이상 있습니다.`);
    occupied.add(key);
  });

  blocks.forEach((block) => delete block.lineNumber);
  return { startMode, blocks, clearX, kinds };
}

  `;
}

      handlers[action]?.(button.dataset.value || undefined);

  });
}

  function attachCodeEditor(editor) {
    const textarea = root.querySelector('#block-code');
    if (!textarea) return;
    const insert = (text) => {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      editor.codeEditor.draft = textarea.value;
      textarea.focus();
    };
    textarea.addEventListener('input', () => {
      editor.codeEditor.draft = textarea.value;
    });
    textarea.addEventListener('keydown', (event) => {
      if (event.key === 'Tab') {
        event.preventDefault();
        insert('    ');
      } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        handlers.saveBlockCode();
      } else if (event.key === 'Enter') {
        // 새 줄에서 앞 줄 들여쓰기 유지, ':'로 끝나면 한 칸 더
        event.preventDefault();
        const before = textarea.value.slice(0, textarea.selectionStart);
        const currentLine = before.slice(before.lastIndexOf('\n') + 1);
        let indent = currentLine.match(/^\s*/)[0];
        if (currentLine.trim().endsWith(':')) indent += '    ';
        insert(`\n${indent}`);
      }
    });
    root.querySelectorAll('[data-snippet]').forEach((button) => {
      button.addEventListener('click', () => insert(button.dataset.snippet.replace(/\\n/g, '\n')));
    });
    textarea.focus();
  }

  // 블록 선택 창: START · ERASE · 카테고리 탭 → 펼친 카테고리의 블록(종류·★변형)
  function toolButton(editor, tool, inner, title) {
    return `<button class="tool-button ${editor.tool === tool ? 'active' : ''}" data-action="selectEditorTool" data-value="${tool}" title="${escapeHtml(title)}">${inner}</button>`;
  }

  function toolCategory(editor, tool) {
    if (String(tool).startsWith('coded:')) return 'coded';
    const kind = getEditorKind(editor, tool);
    return kind ? categoryOfType(kind.type) : null;
  }

  function paletteMarkup(editor) {
    const items = [
      toolButton(editor, 'start', `<span class="tool-sprite sprite sprite-start${editor.startMode}" aria-hidden="true"></span>START`, 'start'),
      toolButton(editor, 'erase', '⌫ ERASE', 'erase'),
      '<span class="palette-divider" aria-hidden="true"></span>',
    ];
    const activeCategory = toolCategory(editor, editor.tool);
    EDITOR_CATEGORIES.forEach((category) => {
      const kinds = editor.kinds.filter((kind) => category.types.includes(kind.type));
      const count = category.id === 'coded' ? editor.codedTools.length : kinds.length;
      const icon = category.id === 'coded'
        ? '<b class="code-mark">{}</b>'
        : `<span class="tool-sprite sprite sprite-k-${kinds[0]?.id}" aria-hidden="true"></span>`;
      const open = editor.paletteCategory === category.id;
      items.push(`<button class="category-tab ${open ? 'open' : ''} ${activeCategory === category.id ? 'has-active' : ''}" data-action="togglePaletteCategory" data-value="${category.id}" aria-expanded="${open}">${icon}${category.label}<small>${count}</small><span class="caret" aria-hidden="true">${open ? '▴' : '▾'}</span></button>`);
    });
    return items.join('');
  }

  function paletteItemsMarkup(editor) {
    const category = EDITOR_CATEGORIES.find((item) => item.id === editor.paletteCategory);
    if (!category) return '';
    if (category.id === 'coded') {
      if (!editor.codedTools.length) return '<p class="palette-empty">블록에 코드를 저장하면 여기에 생깁니다.</p>';
      return editor.codedTools.map((coded) => {
        const kind = getEditorKind(editor, coded.kindId);
        if (!kind) return '';
        const tag = editorKindTag(kind);
        return `<span class="coded-tool">${toolButton(editor, `coded:${coded.id}`, `<span class="tool-sprite sprite sprite-k-${kind.id}" aria-hidden="true"></span><b class="code-mark">{}</b>${TYPE_LABELS[kind.type]}<small class="tag-chip">${escapeHtml(tag)}</small>`, `코드 블록 · 테그: ${tag}\n${coded.code}`)}<button class="coded-remove" data-action="removeCodedTool" data-value="${coded.id}" title="목록에서 빼기" aria-label="코드 블록 목록에서 빼기">×</button></span>`;
      }).join('');
    }
    return category.types.flatMap((type) => editor.kinds.filter((kind) => kind.type === type)).map((kind) => {
      const tag = editorKindTag(kind);
      const chip = tag !== kind.type ? `<small class="tag-chip">${escapeHtml(tag)}</small>` : '';
      return toolButton(editor, kind.id, `<span class="tool-sprite sprite sprite-k-${kind.id}" aria-hidden="true"></span>${TYPE_LABELS[kind.type]}${kind.base ? '' : ' ★'}${chip}`, `테그: ${tag}`);
    }).join('');
  }


  function pixelClass(token) {
    if (token === EMPTY_PX) return 'px-empty';
    if (token === TRANSPARENT_PX) return 'px-transparent';
    if (token.length === 9) return 'px-alpha';
    return '';
  }

  function pixelLabel(token) {
    if (token === EMPTY_PX) return '빈 칸 (히트박스 없음)';
    if (token === TRANSPARENT_PX) return '투명 (히트박스 있음)';
    return `${token} (히트박스 있음)`;
  }

  // 디자인 그리드 칠하기: 드래그 중에는 화면만 바꾸고, 손을 떼면 저장
  function attachDesignPointer(editor, gridEl) {
    const tokens = [...(getEditorKind(editor, editor.design.kindId) || editor.kinds[0]).design];
    let painting = false;
    let changed = false;

    const brushToken = () => {
      const { brush, color } = editor.design;
      if (brush === 'transparent') return TRANSPARENT_PX;
      if (brush === 'empty') return EMPTY_PX;
      return normalizePixelToken(color) || '#ffffff';
    };

    const paint = (el) => {
      const index = Number(el.dataset.px);
      const token = brushToken();
      if (tokens[index] === token) return;
      tokens[index] = token;
      el.className = `design-px ${pixelClass(token)}`;
      el.style.setProperty('--px', token === EMPTY_PX ? 'transparent' : token);
      changed = true;
    };

    const pixelAt = (event) => {
      const el = document.elementFromPoint(event.clientX, event.clientY)?.closest?.('[data-px]');
      return el && gridEl.contains(el) ? el : null;
    };

    gridEl.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      const el = pixelAt(event);
      if (!el) return;
      event.preventDefault();
      if (editor.design.brush === 'pick') {
        onAction('pickDesignColor', tokens[Number(el.dataset.px)]);
        return;
      }
      painting = true;
      changed = false;
      gridEl.setPointerCapture?.(event.pointerId);
      paint(el);
    });

    gridEl.addEventListener('pointermove', (event) => {
      if (!painting) return;
      const el = pixelAt(event);
      if (el) paint(el);
    });

    const finish = () => {
      if (!painting) return;
      painting = false;
      if (changed) onAction('commitDesignPixels', [...tokens]);
    };
    gridEl.addEventListener('pointerup', finish);
    gridEl.addEventListener('pointercancel', finish);
  }

  function showStart() {
    hud.classList.add('hidden');
    root.innerHTML = screenMarkup({
      title: 'GEOMETRY DASH CLONE',
      body: `
        <p>Retro clone-built arcade action with procedural stages, pixel art, and touch/keyboard controls.</p>
        <p class="tip">Tap / click / <span class="flashy">Space</span> · 8 modes: Cube, Ship, Ball, UFO, Wave, Robot, Spider, Swing</p>
      `,
      buttons: `
        <button class="pixel-button" data-action="openCharacterSelect">PLAY</button>
